<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>武学卷 UI 原型</title>
  <style>
    :root { --ink:#07131a; --field:#122b35; --steel:#668d96; --jade:#7bd7c3; --ice:#e1f0f2; --muted:#91adb3; --gold:#cfb66e; --red:#81383b; --font:'Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
    *{box-sizing:border-box} body{margin:0;background:#202426;color:var(--ice);font-family:var(--font);letter-spacing:0} button,select{font:inherit;color:inherit} button{cursor:pointer}.stage{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 0,rgba(53,91,102,.22),transparent 45%),#202426}
    .book{position:relative;width:min(1536px,96vw);aspect-ratio:3/2;overflow:hidden;border:2px solid #789da6;border-radius:4px;background:linear-gradient(90deg,rgba(21,62,70,.32) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(rgba(21,62,70,.25) 1px,transparent 1px) 0 0/32px 32px,radial-gradient(circle at 50% 0,#193b45,#0b1920 58%,#061016);box-shadow:0 24px 45px #0009}.book:before{content:'';position:absolute;inset:12px;border:1px solid #719aa1;box-shadow:inset 0 0 0 5px #030b10a8,inset 0 0 38px #000b;pointer-events:none}.title{position:absolute;top:7%;left:22%;width:56%;height:12%;display:grid;place-items:center;margin:0;border:1px solid #668b95;background:linear-gradient(#1d3a42,#08141b);box-shadow:inset 0 0 0 4px #030b0fb8;font-family:'STKaiti','KaiTi',var(--font);font-size:clamp(23px,2.4vw,38px);text-shadow:0 2px #080f13,0 0 16px #a1e2e633}.faction-badge{position:absolute;z-index:3;top:7%;left:4.8%;width:198px;height:48px;padding:0 18px 0 44px;display:flex;flex-direction:column;justify-content:center;gap:1px;background:url('../game/art/ui/field_hud/v1/hud_scene_badge.png') center/100% 100% no-repeat;text-shadow:0 1px 2px #02080b}.faction-badge small{color:var(--muted);font-size:11px;line-height:14px}.faction-badge strong{color:var(--gold);font-size:16px;line-height:19px}.close{position:absolute;top:4.9%;right:4.9%;width:46px;height:46px;border:0;background:url('../game/art/ui/inventory/buttons/btn_x_normal.png') center/contain no-repeat;font-size:0}.close:hover{background-image:url('../game/art/ui/inventory/buttons/btn_x_hover.png')}
    .frame{position:absolute;border:1px solid #638a92;background:linear-gradient(145deg,#12333cdd,#07141bdd);box-shadow:inset 0 0 0 5px #020b10b8,inset 0 0 26px #000a}.list-frame{left:14%;top:30%;width:30%;height:63%}.detail-frame{left:46%;top:30%;width:48%;height:63%}.primary-tabs{position:absolute;z-index:2;left:15.5%;top:22%;width:27%;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.category-tabs{position:absolute;z-index:2;left:15.5%;top:27%;width:27%;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tab{height:36px;border:1px solid #557b84;background:linear-gradient(#183843,#0a1820);font-size:clamp(12px,1vw,16px);font-weight:700;text-shadow:0 2px #061016}.primary-tabs .tab{height:44px;font-size:clamp(15px,1.2vw,19px)}.tab.selected{border-color:#c0d8d7;color:#f2fff7;background:linear-gradient(#315961,#10282f);box-shadow:inset 0 0 10px #62c9ba66}.tab:hover{filter:brightness(1.18)}
    .learned{position:absolute;z-index:2;top:27.8%;left:48.5%;font-size:14px;color:var(--muted)}
    .skill-list{position:absolute;z-index:2;left:15.3%;top:35%;width:27.5%;height:53%;overflow:auto;padding:3px 7px 10px 2px;scrollbar-color:#54848c #0a161c}.skill-list.mind-list{top:30%;height:58%}.skill-row{position:relative;width:100%;height:74px;margin:0 0 9px;border:1px solid #557681;background:linear-gradient(100deg,#112c35,#0a1920);color:var(--ice);text-align:left;padding:9px 11px 7px 67px}.skill-row:hover{border-color:var(--jade);background:#153944}.skill-row.selected{border-color:var(--gold);box-shadow:inset 0 0 14px #c7b16b22}.skill-row img{position:absolute;left:11px;top:10px;width:48px;height:48px;object-fit:contain}.skill-row strong{display:block;font-size:15px;line-height:20px}.skill-row span{display:block;margin-top:3px;color:#a7c6cb;font-size:12px}.skill-row em{position:absolute;right:11px;top:10px;color:var(--jade);font-size:12px;font-style:normal}
    .detail{position:absolute;z-index:2;left:48.5%;top:35%;width:42.5%;height:52%;overflow:auto;padding:0 12px 12px}.skill-head{display:grid;grid-template-columns:82px 1fr;gap:14px;align-items:center}.skill-icon{width:78px;height:78px;padding:7px;border:1px solid #70a9a8;background:#081820;object-fit:contain}.skill-head h2{margin:0;font-size:clamp(20px,1.8vw,28px)}.meta{margin-top:5px;color:var(--jade);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{padding:8px;border:1px solid #527984;background:#0a1c24b8;text-align:center}.stat span{display:block;color:var(--muted);font-size:12px}.stat b{display:block;margin-top:3px;color:var(--ice);font-size:17px}.detail h3{margin:17px 0 6px;color:var(--gold);font-size:15px}.detail p{margin:0;color:#d0e0e3;font-size:15px;line-height:1.72}.upgrade-box{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;margin-top:19px;padding:12px 14px;border:1px solid #658b92;background:#091a22cc}.upgrade-box strong{display:block;color:var(--ice);font-size:15px}.upgrade-box small{display:block;margin-top:4px;color:var(--muted);font-size:12px}.upgrade-btn{min-width:166px;height:42px;border:1px solid #9ccfbe;background:linear-gradient(#315e61,#122c31);box-shadow:inset 0 0 10px #62c9ba55;color:#f2fff7;font-weight:700}.upgrade-btn:hover{filter:brightness(1.18)}.upgrade-btn:disabled{cursor:not-allowed;filter:none;border-color:#526e73;color:#789095;background:#17262b}.resource-strip{position:absolute;z-index:3;top:15.5%;left:4.8%;display:flex;gap:12px;color:var(--muted);font-size:12px}.resource-strip b{color:var(--jade);font-weight:700}
    @media(max-width:900px){.stage{padding:8px;overflow:auto}.book{min-width:820px}}
    /* Runtime assembly preview: generated art is used for the fixed surfaces;
       labels, values, icons and repeated rows remain live HTML controls. */
    .book{border:0;background:url('../game/art/ui/skill/runtime_v2/panel_bg_v3.png') center/100% 100% no-repeat;box-shadow:0 24px 45px #0009}
    .book:before{display:none}
    .frame{border:0;background:transparent;box-shadow:none}
    .title{border:0;background:transparent;box-shadow:none;top:5%;left:22%;width:56%;height:14%}
    .faction-badge{top:6.7%;left:4.4%;width:12%;height:16%;padding:78px 0 0;align-items:center;justify-content:flex-start;gap:1px;background:url('../game/art/ui/skill/runtime_v2/faction_badge.png') center/100% 100% no-repeat;text-align:center}
    .faction-badge small{font-size:10px}.faction-badge strong{font-size:14px}
    .resource-strip{top:8.2%;left:auto;right:8.1%;width:22%;height:7%;padding:0 14px;align-items:center;justify-content:space-around;background:none}
    .primary-tabs .tab{border:0;background:url('../game/art/ui/skill/runtime_v2/primary_tab_normal.png') center/100% 100% no-repeat;box-shadow:none}
    .primary-tabs .tab.selected{background-image:url('../game/art/ui/skill/runtime_v2/primary_tab_selected.png');box-shadow:none}
    .category-tabs .tab{border:0;background-image:url('../game/art/ui/skill/runtime_v2/secondary_tab_01.png');background-size:100% 100%;box-shadow:none}
    .category-tabs .tab:nth-child(2){background-image:url('../game/art/ui/skill/runtime_v2/secondary_tab_02.png')}.category-tabs .tab:nth-child(3){background-image:url('../game/art/ui/skill/runtime_v2/secondary_tab_03.png')}.category-tabs .tab:nth-child(4){background-image:url('../game/art/ui/skill/runtime_v2/secondary_tab_04.png')}.category-tabs .tab:nth-child(5){background-image:url('../game/art/ui/skill/runtime_v2/secondary_tab_05.png')}
    .category-tabs .tab.selected{filter:brightness(1.22);box-shadow:none}
    .skill-row{border:0;background-image:url('../game/art/ui/skill/runtime_v2/skill_row_normal.png');background-size:100% 100%;box-shadow:none}
    .skill-row.selected{border:0;background-image:url('../game/art/ui/skill/runtime_v2/skill_row_selected.png');box-shadow:none}
    .skill-icon{border:0;background:url('../game/art/ui/skill/runtime_v2/skill_icon_frame.png') center/100% 100% no-repeat;padding:12px}
    .stat{border:0;background:url('../game/art/ui/skill/runtime_v2/stat_cell.png') center/100% 100% no-repeat}
    .upgrade-box{border:0;background:transparent}
    .upgrade-btn{border:0;background:url('../game/art/ui/skill/runtime_v2/upgrade_normal.png') center/100% 100% no-repeat;box-shadow:none}.upgrade-btn:hover{background-image:url('../game/art/ui/skill/runtime_v2/upgrade_hover.png')}.upgrade-btn:active{background-image:url('../game/art/ui/skill/runtime_v2/upgrade_pressed.png')}.upgrade-btn:disabled{background-image:url('../game/art/ui/skill/runtime_v2/upgrade_disabled.png')}
    /* Align live controls to the safe zones in panel_bg_v3.png. */
    .primary-tabs{left:17.5%;top:20%;width:65%;gap:2.2%}.primary-tabs .tab{height:55px}
    .category-tabs{left:5.2%;top:27.5%;width:18.2%;gap:4px}.category-tabs .tab{height:34px;font-size:13px}
    .learned{top:32.2%;left:5.5%;font-size:13px}
    .skill-list{left:5.2%;top:36.5%;width:18.2%;height:51%;padding:3px 2px 10px}
    .skill-row{height:72px;margin-bottom:9px;padding:9px 10px 7px 67px}.skill-row strong{font-size:14px}.skill-row span{font-size:11px}.skill-row em{right:9px;font-size:11px}
    .detail{left:29.5%;top:36.5%;width:61%;height:37.5%;padding:0 18px;overflow:visible}.skill-head{grid-template-columns:82px 1fr}.detail h3{margin-top:16px}.detail p{max-width:82%;font-size:14px}
    .upgrade-box{position:absolute;top:116%;left:0;width:100%;margin:0;padding:13px 22px}.upgrade-box strong{font-size:16px}.upgrade-box small{font-size:13px}
    .resource-strip{top:8.1%;right:4.8%;width:11.5%;height:9%;padding:0;display:grid;grid-template-columns:1fr;gap:1px;justify-items:end;font-size:11px}.resource-strip span{width:100%;text-align:center}
    .faction-badge{padding:101px 0 0}.faction-badge strong{font-size:19px;line-height:22px;text-shadow:0 2px 3px #02080b}.faction-crest{position:absolute;top:15%;left:26%;width:48%;height:48%;object-fit:contain;filter:drop-shadow(0 2px 3px #02080b)}
    .upgrade-box{top:113%;left:4%;width:92%;padding:13px 18px;overflow:hidden}.upgrade-btn{min-width:170px;height:38px;padding:0 12px;font-size:13px;white-space:nowrap;line-height:1}
  </style>
</head>
<body>
<main class="stage"><section class="book" aria-label="武学卷原型"><div class="faction-badge" aria-label="当前门派"><img class="faction-crest" src="../game/art/ui/skill/runtime_v2/faction_huashan.png" alt="华山派徽记"><strong>华山派</strong></div><div class="resource-strip" aria-label="角色资源"><span>总阅历 <b>360</b></span><span>可用阅历 <b id="insight">120</b></span></div><button class="close" aria-label="关闭">关闭</button><h1 class="title">武学卷</h1><div class="frame list-frame"></div><div class="frame detail-frame"></div>
  <nav class="primary-tabs" aria-label="武学类型"><button class="tab selected" data-group="move">招式</button><button class="tab" data-group="mind">心法</button></nav>
  <nav class="category-tabs" aria-label="武学路数"><button class="tab selected" data-filter="all">全部</button><button class="tab" data-filter="sword">剑法</button><button class="tab" data-filter="staff">棍法</button><button class="tab" data-filter="palm">掌法</button><button class="tab" data-filter="blade">刀法</button></nav><div class="learned">已习得　<span id="count">4</span> 门武学</div>
  <div class="skill-list" id="skillList"></div>
  <article class="detail"><div class="skill-head"><img class="skill-icon" id="detailIcon" src="../game/art/ui/inventory/icons/icon_huashan_quick_sword.png" alt="招式图标"><div><h2 id="detailName">一剑断千山</h2><div class="meta" id="detailMeta">剑法 · 攻击招式</div></div></div><div class="stats"><div class="stat"><span>内力消耗</span><b id="statMp">18</b></div><div class="stat"><span>威力倍率</span><b id="statPower">145%</b></div><div class="stat"><span>攻击段数</span><b id="statHits">1</b></div></div><h3>招式说明</h3><p id="detailDesc">凝气于剑，招式凌厉迅捷。面对单个强敌时，可作为稳定的爆发手段。</p><div class="upgrade-box"><div><strong id="upgradeTitle">招式内容 Lv.1</strong><small>消耗阅历 <span id="upgradeCost">30</span>　·　升级后威力 +10%</small></div><button class="upgrade-btn" id="upgradeBtn">提升招式</button></div></article>
</section></main>
<script>
const skills=[
 {id:'sword',name:'一剑断千山',group:'move',route:'sword',routeName:'剑法',typeName:'攻击招式',mp:18,power:145,hits:1,icon:'icon_huashan_quick_sword.png',desc:'凝气于剑，招式凌厉迅捷。面对单个强敌时，可作为稳定的爆发手段。'},
 {id:'palm',name:'劈云掌',group:'move',route:'palm',routeName:'掌法',typeName:'攻击招式',mp:8,power:112,hits:1,icon:'icon_potion.png',desc:'以沉劲推掌，消耗较低，适合在内力不足时维持攻势。'},
 {id:'guard',name:'紫霞凝罡',group:'mind',route:'sword',routeName:'剑法',typeName:'剑法心法',mp:16,power:0,hits:0,icon:'icon_huashan_zixia_sword.png',desc:'真气沿剑脉运行，提升内力恢复，并使剑法招式的威力得到小幅提升。'},
 {id:'inner',name:'周天吐纳',group:'mind',route:'general',routeName:'通用',typeName:'通用心法',mp:12,power:0,hits:0,icon:'icon_inner_breath_pill.png',desc:'调息周天，提升内力上限与恢复速度，并使所有招式都获得稳定的威力提升。'},
 {id:'staff',name:'横扫千军',group:'move',route:'staff',routeName:'棍法',typeName:'攻击招式',mp:14,power:128,hits:1,icon:'icon_bronze_ring_staff.png',desc:'长棍横扫，覆盖身前大范围，适合在敌人逼近时打开空隙。'},
 {id:'blade',name:'开山一刀',group:'move',route:'blade',routeName:'刀法',typeName:'攻击招式',mp:22,power:165,hits:1,icon:'icon_heavy_iron_sword.png',desc:'蓄势后劈出沉重一击，内力消耗较高，但对强敌压制明显。'}];
let filter='all',group='move',selected=skills[0],insight=120;const list=document.querySelector('#skillList');skills.forEach(s=>{s.level=1;s.maxLevel=3;s.cost=30;s.gain=10;s.basePower=s.power});
function render(){const isMove=group==='move',shown=skills.filter(s=>s.group===group&&(isMove?(filter==='all'||s.route===filter):(filter==='general'?s.route==='general':s.route===filter)));document.querySelector('.category-tabs').hidden=false;list.classList.toggle('mind-list',!isMove);document.querySelector('#count').textContent=shown.length;updateCategoryTabs(isMove);list.innerHTML=shown.map(s=>`<button class="skill-row ${s.id===selected.id?'selected':''}" data-id="${s.id}"><img src="../game/art/ui/inventory/icons/${s.icon}" alt=""><strong>${s.name}</strong><span>${s.routeName} · ${s.typeName}</span><em>Lv.${s.level} · 内力 ${s.mp}</em></button>`).join('')||'<p style="color:#91adb3;padding:18px">当前筛选下暂无已习得武学。</p>';list.querySelectorAll('.skill-row').forEach(row=>row.onclick=()=>{selected=skills.find(s=>s.id===row.dataset.id);render();show();});if(!shown.some(s=>s.id===selected.id)&&shown[0]){selected=shown[0];show();}}
function updateCategoryTabs(isMove){const labels=isMove?['全部','剑法','棍法','掌法','刀法']:['通用','剑法','棍法','掌法','刀法'];const filters=isMove?['all','sword','staff','palm','blade']:['general','sword','staff','palm','blade'];document.querySelectorAll('.category-tabs .tab').forEach((tab,index)=>{tab.textContent=labels[index];tab.dataset.filter=filters[index];tab.classList.toggle('selected',tab.dataset.filter===filter);});}
function show(){document.querySelector('#detailIcon').src=`../game/art/ui/inventory/icons/${selected.icon}`;document.querySelector('#detailName').textContent=selected.name;document.querySelector('#detailMeta').textContent=`${selected.routeName} · ${selected.typeName}`;document.querySelector('#statMp').textContent=selected.mp||'--';document.querySelector('#statPower').textContent=selected.power?`${selected.power}%`:'护体';document.querySelector('#statHits').textContent=selected.hits||'--';document.querySelector('#detailDesc').textContent=selected.desc;document.querySelector('#upgradeTitle').textContent=`招式内容 Lv.${selected.level}`;document.querySelector('#upgradeCost').textContent=selected.cost;const btn=document.querySelector('#upgradeBtn');btn.disabled=selected.level>=selected.maxLevel||insight<selected.cost;btn.textContent=selected.level>=selected.maxLevel?'已达上限':`提升招式 · ${selected.cost}阅历`;document.querySelector('#insight').textContent=insight;}
function upgradeSelected(){if(selected.level>=selected.maxLevel||insight<selected.cost)return;insight-=selected.cost;selected.level+=1;selected.power=selected.basePower+(selected.level-1)*selected.gain;render();show();}
document.querySelectorAll('.category-tabs .tab').forEach(tab=>tab.onclick=()=>{filter=tab.dataset.filter;render()});document.querySelectorAll('.primary-tabs .tab').forEach(tab=>tab.onclick=()=>{group=tab.dataset.group;filter=group==='move'?'all':'general';document.querySelectorAll('.primary-tabs .tab').forEach(t=>t.classList.toggle('selected',t===tab));render()});document.querySelector('#upgradeBtn').onclick=upgradeSelected;document.querySelector('.close').onclick=()=>document.querySelector('.book').style.visibility='hidden';render();show();
</script></body></html>
