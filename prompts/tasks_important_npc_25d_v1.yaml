tasks:
  - id: sprite_xingfantian_25d_master_v1
    template: sprite_npc_25d_master_atlas_v1
    category: sprite_sheet/field-25d/important-npcs/v1
    priority: 1
    model: gpt-image-2
    vars:
      portrait_reference: "game/art/characters/portrait_xingfantian_master.png"
      character_spec: "Xing Fantian, a weathered Chinese master in his late forties: broad rugged face, tan skin, deep brow, short mustache and pointed grey-black beard, long black hair tied low with grey at the temples, visible scar crossing one eyebrow. He wears a worn charcoal-grey cross-collar teaching robe with a muted brown inner layer, simple cloth belt and dark boots. He carries no sword, no scarf and no red costume."

  - id: sprite_duqingshan_25d_master_v1
    template: sprite_npc_25d_master_atlas_v1
    category: sprite_sheet/field-25d/important-npcs/v1
    priority: 1
    model: gpt-image-2
    vars:
      portrait_reference: "game/art/characters/portrait_duqingshan_steady.png"
      character_spec: "Du Qingshan, a very muscular Chinese blacksmith in his late thirties: square jaw, sun-browned skin, thick eyebrows, strong thick arms, black topknot, friendly confident expression. He wears an open dark teal sleeveless work vest over a grey shirt, a blue-purple shoulder cloth, leather apron, wide work belt and heavy boots. A blacksmith hammer hangs at his belt; no sword and no long scholar robe."

  - id: sprite_yuewuxing_25d_master_v1
    template: sprite_npc_25d_master_atlas_v1
    category: sprite_sheet/field-25d/important-npcs/v1
    priority: 1
    model: gpt-image-2
    vars:
      portrait_reference: "game/art/characters/portrait_yuewuheng_rescue.png"
      character_spec: "Yue Wuxing, a young Chinese swordswoman in her early twenties: delicate oval face, long black hair in a high half-up bun with small blue-gold hair ornament, determined expression. She wears layered white, pale-blue and deep-blue flowing wuxia robes with restrained gold trim, blue bracers, a slim sword at her left side. Keep her clearly feminine, light-colored and elegant; no red or black assassin outfit."
