    prompt_path: prompts/bianzhou_city_masterplan_20261022b/bianzhou_plan_20261022b_overview_v1.txt
    reference_images:
    - assets/raw/luoyang_city_masterplan_20261019z/luoyang_city_masterplan_overview_v1.png
    vars:
      asset_prompt: 'Use case: stylized-concept

        Asset type: pre-production illustrated CITY MASTERPLAN for a 2D Chinese wuxia RPG. Concept design for review, not a runtime map texture
        and not an in-game screenshot.

        Primary request: Design a coherent, believable, dense BIANZHOU, a fictional northern Central Plains Chinese trading and postal city, seen
        as one complete walled city from an elevated bird''s-eye three-quarter orthographic angle. Create ONE polished wide landscape planning illustration,
        16:10 composition, north up. Show a real town made of continuous street frontages and enclosed courtyard blocks, inhabited and functional,
        designed before any modular construction.

        Input image ONE is STYLE AND DESIGN-QUALITY REFERENCE ONLY: the approved Luoyang masterplan. Match its sophisticated architectural illustration,
        coherent city-scale perspective, material quality, lively street life, generous readable overview and unobtrusive numbered district labels.
        Invent a DISTINCT Bianzhou arrangement based on the description below. Do not reproduce Luoyang''s layout, river port, palace-like mansion
        district, river garden or outlying temple. Do not redraw a sparse gameplay module board.


        CITY IDENTITY AND REQUIRED FUNCTIONAL CONNECTIONS:

        This is a fictional Da-Qian setting, not a reconstruction of historical Kaifeng or a royal capital. Its identity is a Central Plains postal-road
        crossroads, merchant freight exchange and bustling everyday wards. Existing meaningful places: a postal official at the eastern posthouse,
        a central-plains merchant on the western freight street, a public wanted-notice pavilion reachable from the main street. The southern city
        gate leads back to the wider world; the northern gate and outgoing country postal road lead toward the old post station. Preserve these
        spatial relationships. Extra shops and homes in the drawing are proposed architectural functions and anonymous inhabitants only, not new
        named quest NPCs, factions or plotlines.


        OVERALL STRUCTURE:

        Use a modest, coherent near-rectangular grey-brick perimeter wall with corner towers and two deliberate axial gates. Show the entire perimeter
        within the canvas with enough margin; no cropped gatehouse or roof. At bottom centre: an unmistakable fortified SOUTH GATE attached to its
        real city wall, a compact interior inspection court and road outside. It must read as a city entrance, never a tiny freestanding wooden
        arch dropped into a street.

        Inside the south gate, a bright, moderately broad NORTH-SOUTH COMMERCIAL SPINE runs continuously to a much smaller north gate. Make this
        a street with busy built edges, not a gigantic ceremonial plaza. TWO CROSS STREETS connect western and eastern quarters, forming two clearly
        continuous walking loops around enclosed blocks. Side lanes are narrower and turn naturally into courtyards; every passage opens to an actual
        street. Close the gaps between buildings with proper courtyard walls and rear buildings, while keeping clear side alleys and non-intersecting
        roof envelopes.

        Main street width about 6-8 adult body widths, secondary cross streets about 3-4, small alleys about 1.5-2. Buildings and people must share
        one coherent scale. No monumental over-wide empty avenues. Around 50-70 varied main and smaller roof volumes arranged into 8-12 courtyard/block
        clusters, with readable alleys between them. This is a visually compact, complete city, not six isolated buildings on a huge ground plane.


        EIGHT FUNCTIONAL ZONES, with exact numbered labels:

        01 南门候检: bottom centre, continuous defensive gate wall, gatehouse, compact checkpoint court, two guard shelters, travellers, a small waiting
        cart bay to the side. The walking spine stays open. Outside the gate show a country road, a few trees and fields, not a shopping street.

        02 中轴坊市: the central spine, continuous but varied shopfronts on BOTH sides. Show an inn, grain shop, cloth shop, tea/food shop and individual
        market stalls fitted into setbacks beside buildings. Each business has a distinct doorway or frontage with visible threshold and different
        architectural silhouette. Back-of-shop courtyards and service alleys make the frontage belong to actual buildings. The shop edge, awning
        and stalls must leave the main thoroughfare clear.

        03 东驿馆: east/upper-right of the central market, a substantial but non-palatial ENCLOSED POSTHOUSE COMPOUND with its own entrance, front
        hall, two side wings, luggage-handling court, stables, wagon shelter and rear service gate. One anonymous postal clerk at the entrance for
        scale, travellers, stablehand, one horse and one postal cart near the service yard. Freight/service access joins the eastern loop without
        cutting across the entrance footway.

        04 西市货街: west/middle, a merchant freight exchange with SEPARATE warehouse/storefront, loading shed, tightly grouped but non-overlapping
        storage buildings and a small loading yard. Handcarts, a few sacks, closed chests, crates and porters explain its purpose. Freight approaches
        from the secondary loop; cargo stays in yards and along walls, never strewn across the main road. A travelling merchant is near a distinct
        street-side stall.

        05 坊巷民居: southwest and pockets behind shopfronts, several enclosed small courtyard homes, shared well, cooking corner, laundry line, low
        walls and a tiny neighborhood tree court. Elderly residents, a parent and child, someone carrying water. Dense, inhabited lanes, not detached
        cottages scattered on bare mud. A small tree court is a breathing space, not a huge plaza or mansion park.

        06 百工作坊: northwest, repair/cart workshop, carpenter and smithy with unmistakably different work yards, wood rack, simple timber workbench,
        forge area and material shed. A smaller craft lane branches from a cross street and returns into the western loop. Workshop equipment belongs
        to the proper business. Muted ash and worn packed earth distinguish it from market paving.

        07 北街榜亭: north-central, immediately off the spine before the north gate. A small public wanted-notice pavilion against an enclosed civic
        service court frontage, some people reading and a patrol guard. Keep a CLEAR pedestrian approach from the main street. This is modest everyday
        civic infrastructure, not a grand yamen palace or a giant empty government square.

        08 北门驿道: top centre, the north gate in the continuous perimeter wall, postal road continuing visibly through open country toward a SMALL
        DISTANT old post-station silhouette outside the city. Preserve the visual connection, but do not make an additional full urban district
        outside the walls. The outlying station remains a separate destination, not a new interior door inside the posthouse.


        GROUND AND LIVED DETAIL:

        Main spine: lightly worn, well-fitted pale stone paving with subtle drainage channels. Market: warmer worn paving, steps and limited awning
        shadow. Postal court: orderly stone/gravel with a slightly earthier service lane and wheel wear. Freight yards/craft lanes: compacted finer
        earth with subtle ruts and very local work debris, not giant lumpy mud clods. Residential alleys: fine compacted earth and scattered gravel,
        small greenery at walls. Integrate materials naturally into paths, thresholds, curb edges and courtyards; NO geometric rectangular texture
        pads, hard T-shaped road strips, broad unbuilt mud wasteland or uniformly grey open plaza. Trees and greenery belong in yard corners, along
        walls and in the small neighborhood court, not randomly dotted as tiny isolated props.


        STYLE AND COMPOSITION:

        Polished, cohesive hand-painted production-design illustration with realistic traditional Chinese timber, grey brick, dark-grey tiles, restrained
        warm wood and cloth, subtle muted greenery. Bright readable neutral daylight, soft consistent cast shadows attached to buildings and objects.
        Clear parallel/orthographic readability with sufficient roof angle to distinguish function, no vanishing-point distortion or mixed camera
        angles. Every wall is an enclosure boundary with real gates, all roofs have separate believable footprints and fire/side gaps. Modest roof
        variety, one/two-storey public and commercial buildings, mostly one-storey residences. Small readable anonymous people in varied occupations
        and ages, clustered naturally at work and thresholds. Busy market, quieter side lanes; population is a scale cue, not oversized character
        sprites.


        TEXT, VERBATIM: only the eight district labels "01 南门候检", "02 中轴坊市", "03 东驿馆", "04 西市货街", "05 坊巷民居", "06 百工作坊", "07 北街榜亭", "08 北门驿道". Clear
        Simplified Chinese dark lettering on small cream planning tags with muted red number badges, placed without hiding important streets or
        entrances. If character rendering is imperfect, prioritize correct 01-08 positions and leave architectural legibility intact. No decorative
        pseudo-calligraphy or storefront writing. No additional title, legend, UI, HUD, controls, coordinates, player marker, ruler, compass overlay,
        watermark or logo.

        Avoid: loose sprite collage, modular asset showroom, six isolated houses, hard-edged rectangular paving patches, enormous mud apron, repeated
        identical storefront or three incompatible destinations on one facade, roof/building intersections, carts blocking gates, white cutout halos,
        floating props, grass visible through door interiors, giant item icons, heroic portraits, imperial palaces, grand river/port/garden/temple
        copied from Luoyang, European buildings, modern equipment, neon colours. This image exists to establish a strong overall DESIGN to review
        BEFORE building modules.

        '

