  # --- 林西村主街 完整实机场景（取代模块化 atlas 拼接方案）---
  - id: scene_linxi_main_street_full
    template: scene_background_walkable_full
    category: scene_background
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村主街 · 2.5D 预渲染版"
      scene_desc: |
        清晨阳光下的山中村庄主街，画面是一张完整自然的可行走 RPG 场景。
        整体像老式 2.5D RPG 的预渲染场景：建筑有厚实体块、侧墙、屋檐阴影、台阶高度和接地投影，
        但表面仍是手绘武侠贴图和港漫色彩。
        左上是完整木结构小酒馆，门前亮着红灯笼和可动酒幡但没有文字；
        右上是完整铁匠铺，炉火从敞口透出橙色光，屋檐和烟囱有体积；
        中上有一栋民居，烟囱位置清楚。
        下半部是宽阔连续的黄土主路，从左下进入，经过中央石坛空地，通向右侧村口出口。
        翠竹、灌木和草丛只沿画面边缘布置形成框景，不遮挡主路和建筑。
        酒馆屋顶上面预留炊烟位置，铁匠铺预留炉火光晕位置，方便后期叠加动画粒子。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "预渲染 2.5D 体块感、厚屋檐、侧墙、接地阴影、宽阔黄土主路、酒馆灯笼酒幡、烟囱、铁匠铺炉火、中央石坛、边缘翠竹框景"

  # --- 竹尾村主街（ch1_s2_qingfeng 用，取代占位的 bg_main_menu.png）---
  - id: scene_zhuwei_main_street
    template: scene_background_45deg
    category: scene_background
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "竹尾村主街"
      scene_desc: |
        宁静小镇主街，翠竹环抱，街道两旁木结构店铺鳞次栉比。
        左侧客栈门前红灯笼高挂，门廊木质温润；
        右侧杂货铺、药材铺依次排开；
        街道中央铺着青石板，远处可见竹林围绕的镇门牌坊。
        午后阳光温暖，街上行人稀少但生气盎然，飘荡着淡淡饭菜香。
        整体氛围宁静祥和但暗藏不安。
      time_of_day: "afternoon"
      weather: "clear"
      key_elements: "红灯笼、木质客栈、青石板路、翠竹、镇门牌坊、杂货铺"

  # --- 城西废宅（ch1_s3_west_ruin 用，取代占位的 bg_equipment.png）---
