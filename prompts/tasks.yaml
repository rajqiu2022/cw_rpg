  # ============================================================
  # === [v0.2 第一章必产 - 场景背景 3 张] priority=1 ===
  # ============================================================

  # --- 场景 1：林西村主街（明亮基调）---
  - id: scene_linxi_main_street
    template: scene_background_45deg
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村主街"
      scene_desc: |
        清晨阳光明亮的山中小村集市，竹林环抱、阳光从竹叶间洒下。
        黄土村道平整明亮，色彩鲜艳饱和。
        左侧木结构酒馆鲜红色酒幡飘扬，门口悬一对鲜红灯笼，墙体青砖白缝清晰；
        中央村道延伸至画面深处的村口牌坊；
        右侧铁匠铺敞口炉火橙红明亮、铁砧露出半边；
        村道尽头可见武师院的青瓦顶在阳光下闪光。
        鸡犬鸣声、炊烟轻起、阳光通透，整体氛围安宁明亮、色彩活力。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "鲜红酒幡、鲜红灯笼、橙红炉火、青瓦顶、翠竹、黄土村道、明亮阳光"

  # --- 新手关：整图背景 + 隐形碰撞层（替代碎 PNG 拼图）---
  - id: scene_linxi_tutorial_full_bg
    template: scene_background_walkable_full
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村新手关"
      scene_desc: |
        清晨阳光下的山中小村入口，画面是一张完整自然的可行走场景插画。
        左上是一栋完整木结构小酒馆，门前有红灯笼和酒幡但没有文字；
        右上是一栋完整铁匠铺，炉火从敞口透出橙色光；
        中上有一栋小民居作为背景层次。
        下半部是一条宽阔连续的黄土主路，从左下进入，经过中央空地和石坛，通向右侧村外山道出口。
        翠竹、灌木和草丛只沿画面边缘布置，形成村口框景，不遮挡主路。
        整体明亮通透、完整统一、适合玩家在道路和中央空地自由行走。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "宽阔连续黄土主路、完整酒馆、完整铁匠铺、小民居、边缘翠竹、中央石坛、右侧出口"

  # --- 新手关：更强 2.5D 预渲染体块感版本 ---
  - id: scene_linxi_tutorial_3d_bg
    template: scene_background_walkable_full
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村新手关 · 2.5D 预渲染版"
      scene_desc: |
        清晨阳光下的山中小村入口，画面是一张完整自然的可行走 RPG 场景。
        整体像老式 2.5D RPG 的预渲染场景：建筑有厚实体块、侧墙、屋檐阴影、台阶高度和接地投影，
        但表面仍是手绘武侠贴图和港漫色彩。
        左上是一栋完整木结构小酒馆，门前有红灯笼和可动酒幡但没有文字；
        右上是一栋完整铁匠铺，炉火从敞口透出橙色光，屋檐和烟囱有体积；
        中上有一栋小民居，烟囱位置清楚，便于后续叠加炊烟动画。
        下半部是一条宽阔连续的黄土主路，从左下进入，经过中央石坛空地，通向右侧村外山道出口。
        翠竹、灌木和草丛只沿画面边缘布置，形成村口框景，不遮挡主路。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "预渲染 2.5D 体块感、厚屋檐、侧墙、接地阴影、宽阔黄土主路、酒馆旗子、烟囱、铁匠铺炉火、中央石坛"

  # --- 新手关：参考图约束的老式 2.5D ARPG 预渲染场景 ---
  - id: scene_linxi_tutorial_prerendered_bg
    template: scene_background_prerendered_arpg
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村新手关 · 预渲染 ARPG 版"
      scene_desc: |
        山中小村的可行走院落入口，整体像老式 2.5D ARPG 的预渲染关卡截图。
        建筑沿画面上方、左侧、右侧围合出一个可行走庭院：左侧是木结构小酒馆，
        右侧是铁匠铺，后方有小民居和围栏。建筑必须像真实体块站在地上，
        有立面、屋檐厚度、柱子、台阶、强接地阴影和遮挡关系。
        中央是石土混合庭院与黄土路，地面有石板、杂草、木桶、陶罐、晾衣架、竹篱笆等小物件建立尺度。
        预留酒馆旗子、烟囱炊烟和铁匠铺炉火位置，方便运行时叠加动画。
        画面不要任何人物、动物、UI 或文字。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "可遮挡建筑体块、强接地阴影、屋檐厚度、墙体立面、台阶、庭院地面、围栏、木桶陶罐、晾衣架、铁匠铺炉火、烟囱"

  # --- 新手关：保留预渲染建筑体块 + 恢复白天明亮道路植物 ---
  - id: scene_linxi_tutorial_prerendered_day_bg
    template: scene_background_prerendered_daylight_mix
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村新手关 · 白天预渲染 ARPG 版"
      scene_desc: |
        清晨阳光明亮的山中小村可行走院落。保留上一张预渲染版的建筑体块感：
        左侧酒馆、右侧铁匠铺、后方民居都像真实建筑站在地上，
        有立面、屋檐厚度、柱子、台阶、接地阴影和遮挡关系。
        但整体色彩和光照要回到白天：黄土路更明亮，庭院地面更清楚，
        绿色植物更鲜活，天空光更通透，不能像傍晚或阴暗场景。
        中央保持宽阔可行走庭院与道路网络，周围有围栏、木桶、陶罐、
        晾衣架、草丛、石板等尺度物，但不要堵住行走路线。
        预留酒馆旗子、烟囱炊烟和铁匠铺炉火位置，方便运行时叠加动画。
        画面不要任何人物、动物、UI 或文字。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "白天清晨阳光、突出建筑体块、强接地阴影、明亮黄土路、绿色植物、庭院地面、围栏杂物、铁匠铺炉火、烟囱"

  # --- 场景 2：林西村外山道（明亮基调）---
  - id: scene_linxi_road
    template: scene_background_45deg
