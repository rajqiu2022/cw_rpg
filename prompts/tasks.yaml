  - id: bianzhou_plan_20261022b_overview_v1
    template: bianzhou_masterplan_20261022b
    execution_backend: builtin_image_gen
    skip: true
    attempt_budget: 1
    retries_allowed: false
    cli_fallback_allowed: false
