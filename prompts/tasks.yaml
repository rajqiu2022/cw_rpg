        "06 后山清修": upper-left ridge footpath reaching a SMALL meditation pavilion, natural rock platform and scattered wind-bent pines. No oversized
        mysterious statue, no new named boss.

        VISUAL LANGUAGE: cold blue-grey limestone, rough retaining stone, pale worn steps, weathered dark timber, muted bronze/blue-green roofs,
        sparse evergreen pines; low-saturation warm wood detail. Clear cool high-altitude morning light, sunlit terrace floors against a misty distant
        valley, clouds around the bases of cliffs. Deep vertical height and open sky distinguish this from any humid tea valley or desert settlement.
        Density concentrated in three realistic terrace groups, not uniform carpet of temples. Stair widths, railing height and adults share coherent
        scale; adult movement can be visually traced from arrival to every occupied court. Landscape makes the sect distinctive; keep architecture
        modest enough to sit on its actual rock support.


        Constraints: use only the SIX exact numbered Simplified Chinese labels listed above, small clean cream planning tags with dark legible type
        and restrained number badges; keep labels off doorways and important paths. No other writing, title, fake calligraphy, coordinates, UI,
