  # --- 场景 3：竹尾村·村外密林（章末战发生地，特例暗调场景）---
  # 按 world-bible §5.8："密林深处"允许暗调，但紧张感来自光影对比，不靠低饱和
  - id: scene_zhuwei_forest
    template: scene_background_45deg
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "竹尾村外密林"
      scene_desc: |
        黄昏密林深处，翠竹林立、绿光斑驳从竹冠间斜洒而下，
        阳光与树影形成强烈明暗对比（高饱和、不灰暗）。
        画面中央一块空地有古朴石坛半埋于地，石坛被一缕斜阳点亮。
        竹叶从枝头零星飘落，竹林深处藏着伏击的紧张感，
