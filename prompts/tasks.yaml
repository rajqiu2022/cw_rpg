  # --- 主角 ---
  lengguyun: &lengguyun
    character_name: "冷孤云"
    character_appearance: |
      二十岁青年，剑眉入鬓星目狭长，眼神中自带三分慵懒七分锐利，
      鼻梁挺直如削，薄唇微抿嘴角天生微微上扬带一抹玩世不恭的笑意，
      下颌线条利落，黑色长发及肩上半束于脑后以暗色布带扎成低马尾，额前几缕碎发，
      修长精瘦宽肩窄腰，站姿随意懒散，
      外层冷灰色粗布长袍交领右衽略有做旧褪色，内衬白色交领内衫领口微敞露出锁骨一线，
      深灰近黑色布质腰带紧束腰间，右侧挂无鞘饰林西铁剑，
      左侧腰间挂一只青灰色酒葫芦葫芦上有一道旧裂痕补过的痕迹，
      深灰收口长裤深色短靴，冷灰+白+深灰+青灰整体灰冷色调

  # --- 武师（主角师傅） ---
  xingfantian: &xingfantian
    character_name: "刑樊天"
    character_appearance: |
      五十二岁，国字方脸额头宽阔浓眉如刀裁眉尾微垂，眼窝略深目光沉稳如古井，
      鼻梁粗直嘴唇厚实紧抿，两鬓至耳后已有白霜眼角三道深纹，
      黑发夹杂灰白约五五开束成简单顶髻以旧木簪固定，胡子刮得干净，
      虎背熊腰肩膀极宽手臂粗壮有力，腰背挺直如松，
      深灰近黑粗布长袍肘部和膝盖有补丁，灰色交领内衫布质粗糙，
      宽布腰带无任何挂饰无武器无玉佩，深色长裤黑色粗布鞋，
      全身深灰+黑+灰白没有任何鲜亮颜色，跟名字一样沉重

  # --- 林西村酒馆老板（兼商店NPC，套用 art_validation_v2 已通过的客栈老板风格）---
  shenbanzhan: &shenbanzhan
    character_name: "沈半盏"
    character_appearance: |
      五十五岁矮胖圆脸男子，秃顶周围一圈白发，
      围裙上全是酒渍永远笑眯眯，深褐色粗布短袍外罩米色围裙，
      酒馆掌柜世故气息，眼神精明但面容和善

  # --- 林西村铁匠（送主角第一把铁剑）---
  duqingshan: &duqingshan
    character_name: "杜青衫"
    character_appearance: |
      四十八岁铁匠，中等身材偏壮光膀子围皮围裙，
      双臂全是烫痕和肌肉，国字脸络腮胡，
      神色憨厚直爽眼神坚定有力，铁匠世家出身的真挚气质

  # --- 女主 1：凌月派大师姐 ---
  yuewuxing: &yuewuxing
    character_name: "悦无姮"
    character_appearance: |
      二十二岁女子，精致瓜子脸下颌线条柔和但干脆，丹凤眼微挑眼角自带三分冷意，
      瞳孔深褐色，鼻梁秀挺薄唇嘴角自然平直，肤色白皙不过分，
      乌黑长发及腰上半以两支银簪交叉挽成凌云髻下半披散于背，
      两鬓各留一缕碎发垂于耳侧，修长纤细但手臂和腰腹有习武之人肌肉线条，
      月白色长裙交领右衽裙摆开叉至膝侧外罩一层淡紫色薄纱对襟长褙子绣银色月纹暗花，
      纯白交领内衫银灰色丝质束腰左侧挂凌月派短剑右侧挂暗器囊，
      白色收腿裤浅灰软底短靴，右腕一只细银镯月白+淡紫+银灰整体冷调素雅

  # --- 女主 2：赵思颖（§4.4）---
