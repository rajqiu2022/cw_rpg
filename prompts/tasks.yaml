    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村新手关"
      scene_desc: |
        清晨阳光下的山中小村入口，画面是一张完整自然的可行走场景插画。
        左上是一栋完整木结构小酒馆，门前有红灯笼和酒幡但没有文字；
        右上是一栋完整铁匠铺，炉火从敞口透出橙色光；
        中上有一栋小民居作为背景层次。
        下半部是一条宽阔连续的黄土主路，从左下进入，经过中央空地和石坛，通向右侧村外山道出口。
        翠竹、灌木和草丛只沿画面边缘布置，形成村口框景，不遮挡主路。
