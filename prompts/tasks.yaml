        houses scattered over empty rectangular road pads. Concept topology is suggestive, not a measured navigation contract.


        LOCATION: WUDANG martial sect, an airy mountainous Daoist sanctuary high above a sea of clouds. Its dominant form is an ASCENDING CHAIN
        OF THREE MOUNTAIN TERRACES connected by rail-protected stone stairways, set diagonally across grey limestone ridges, NOT a flat walled city.
        The lower mountain gate is bottom-left; a clearly visible gradual stair rises to a medium training terrace; the upper temple court sits
        farther back against a real broad rock shoulder. A narrower inhabited service path returns along the sheltered mountainside, with real landings
        and retaining walls. Keep clouds below the walkable surfaces; no cloud hiding crucial stairs, unsupported bridges or stairs directly into
        the sky. Overall design serene and disciplined, not imperial or monstrous.

        SIX ZONES, exact labels:

        "01 解剑山门": lower-left, a modest dark timber-and-grey-stone roofed gate attached to a short boundary wall, wide adult-height passage, resting
        ledge and small visitor shelter beside a real arrival path; two anonymous plain-robed mountain disciples, no headbands.

        "02 太极道场": central broad but human-scale stone terrace, low safe perimeter rail, subtle worn circular stone inlay occupying only part of
        its floor, several tiny students doing EMPTY-HAND tai chi, a separate small sword-practice edge and a covered weapon rack; central circulation
        unobstructed.

        "03 紫霄宫院": highest/main terrace, a dignified restrained Daoist timber hall, modest bronze-green aged roof and grey stone base, two smaller
        side halls enclosing an actual court; stair lands in front, doors and side exits legible. Do not turn it into a giant royal palace or a
        single pagoda.

        "04 藏经静院": compact quiet side courtyard with reading room, smaller roof, one pine, stone bench and protected access from upper court.

        "05 弟子居舍": sheltered lower-right cluster of connected modest dormitory wings, shared washing trough, wood store, vegetable/medicinal garden
