  # --- 林西村外官道（ch1_s1_road 用，取代占位的 bg_battle_default.png）---
  - id: scene_ch1_s1_road
    template: scene_background_45deg
    category: scene_background
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村外 · 竹林官道"
      scene_desc: |
        蜿蜒山间的石板官道，两侧翠竹高耸如壁，
        竹叶轻摇、光影斑驳；道路左侧有一块古旧石碑半隐于竹丛中，
        石碑青苔斑驳、刻字模糊；
        道路中段地面可见一些散落杂物、断裂兵器暗示刚发生过搏斗。
        前方道路延伸消失于竹林深处。
        清晨薄雾未散，空气清冷。
