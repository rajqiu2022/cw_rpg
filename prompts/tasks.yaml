    character_appearance: |
      二十出头年轻男子，黑色长直发束于脑后，脸型清瘦轮廓分明，
      眉目俊朗神色沉稳，身着黑色长袍外披深紫色披风，
      腰间束带，体格修长矫健

  niefeng: &niefeng
    character_name: "聂风"
    character_appearance: |
      二十出头长发男子，黑色长发自然飘落，眉目俊朗带笑意，
      身着浅灰色武服外罩深蓝色短披风，
      赤手空拳但姿态从容，体格匀称矫健

  # ============================================================
  # v0.4 新锚点（基于 world-bible.md v0.4 完整角色谱，2026-05-24）
