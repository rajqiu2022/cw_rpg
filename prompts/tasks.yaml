    template: scene_background_45deg
    category: scene_background
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "城西废宅"
      scene_desc: |
        镇西偏僻角落的荒废宅院，围墙半坍、杂草丛生，
        正门木板朽烂半开，门框歪斜；
        院内散落旧木箱、破酒坛、断木梁；
        后院有一间较完整的内堂，门窗紧闭透出微弱烛光暗示有人活动。
        黄昏光线从破洞屋顶斜射入，尘埃飘浮，氛围阴森诡异。
      time_of_day: "dusk"
      weather: "overcast"
      key_elements: "坍塌围墙、破旧木门、杂草、旧木箱、破酒坛、断梁、微弱烛光、尘埃"

