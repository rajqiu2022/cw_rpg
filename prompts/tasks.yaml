  # --- 场景 1：林西村主街（明亮基调）---
  - id: scene_linxi_main_street
    template: scene_background_45deg
    category: scene/v2
    priority: 1
    model: gpt-image-2
    vars:
      scene_name: "林西村主街"
      scene_desc: |
        清晨阳光明亮的山中小村集市，竹林环抱、阳光从竹叶间洒下。
        黄土村道平整明亮，色彩鲜艳饱和。
        左侧木结构酒馆鲜红色酒幡飘扬，门口悬一对鲜红灯笼，墙体青砖白缝清晰；
        中央村道延伸至画面深处的村口牌坊；
        右侧铁匠铺敞口炉火橙红明亮、铁砧露出半边；
        村道尽头可见武师院的青瓦顶在阳光下闪光。
        鸡犬鸣声、炊烟轻起、阳光通透，整体氛围安宁明亮、色彩活力。
      time_of_day: "morning"
      weather: "clear"
      key_elements: "鲜红酒幡、鲜红灯笼、橙红炉火、青瓦顶、翠竹、黄土村道、明亮阳光"

