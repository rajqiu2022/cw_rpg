      scene_desc: |
        清晨阳光下的山中小村入口，画面是一张完整自然的可行走 RPG 场景。
        整体像老式 2.5D RPG 的预渲染场景：建筑有厚实体块、侧墙、屋檐阴影、台阶高度和接地投影，
        但表面仍是手绘武侠贴图和港漫色彩。
        左上是一栋完整木结构小酒馆，门前有红灯笼和可动酒幡但没有文字；
        右上是一栋完整铁匠铺，炉火从敞口透出橙色光，屋檐和烟囱有体积；
        中上有一栋小民居，烟囱位置清楚，便于后续叠加炊烟动画。
        下半部是一条宽阔连续的黄土主路，从左下进入，经过中央石坛空地，通向右侧村外山道出口。
        翠竹、灌木和草丛只沿画面边缘布置，形成村口框景，不遮挡主路。
