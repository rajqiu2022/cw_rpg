        Primary request: ONE complete, polished, wide landscape bird''s-eye architectural masterplan, approximately 16:10, elevated three-quarter
        parallel perspective. Design a coherent inhabited place BEFORE modular construction. The entire settlement/sect and its access paths must
        fit within the frame with generous margin. Make its terrain, building silhouettes, connected lanes, entrance thresholds, courtyards and
