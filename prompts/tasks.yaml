      scene_desc: |
        山中小村的可行走院落入口，整体像老式 2.5D ARPG 的预渲染关卡截图。
        建筑沿画面上方、左侧、右侧围合出一个可行走庭院：左侧是木结构小酒馆，
        右侧是铁匠铺，后方有小民居和围栏。建筑必须像真实体块站在地上，
        有立面、屋檐厚度、柱子、台阶、强接地阴影和遮挡关系。
        中央是石土混合庭院与黄土路，地面有石板、杂草、木桶、陶罐、晾衣架、竹篱笆等小物件建立尺度。
