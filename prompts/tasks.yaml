# 资产生成任务清单
# gen_assets.py 会读取本文件，对每个 task 加载对应模板，渲染变量，调用 GPT Image 2 生成
#
# task 字段说明：
#   id          : 唯一标识，用于输出文件名（落到 assets/raw/{category}/{id}.png）
#   template    : 模板文件名（不带 .yaml 后缀）
#   category    : 子目录分类（character / sprite / ui / scene / tileset 等）
#   vars        : 注入模板 variables 的具体值
#   priority    : 1=必跑（MVP 第一章必产），2=次要，0=一致性测试（已完成）
#   skip        : true 临时跳过
#
# ============================================================
# 修订记录
# ============================================================
# v0.1 (2026-04 早期):  旧 IP 角色（步惊云 / 聂风 / 排云掌 / 绝世好剑 / 天下会大殿）
# v0.2 (2026-04-27)   :  对齐 docs/world-bible.md v0.3 + design-mvp-chapter1.md v0.2
#                        - 旧 IP 任务全部 skip:true（保留作历史追溯）
#                        - 新增 v0.2 第一章必产任务：6 立绘 + 3 场景 + 物品图标
#                        - 新角色锚点：冷孤云 / 刑樊天 / 沈半盏 / 杜青衫 / 悦无姮 / 蒙面杀手首领

# ============================================================
# 共享角色身份锚点
# ============================================================
character_anchors:

  # --- v0.1 旧锚点（已弃用，仅保留以追溯一致性测试历史任务）---
  bujingyun: &bujingyun
    character_name: "步惊云"
    character_appearance: |
      二十出头年轻男子，黑色长直发束于脑后，脸型清瘦轮廓分明，
      眉目俊朗神色沉稳，身着黑色长袍外披深紫色披风，
      腰间束带，体格修长矫健

  niefeng: &niefeng
    character_name: "聂风"
    character_appearance: |
      二十出头长发男子，黑色长发自然飘落，眉目俊朗带笑意，
      身着浅灰色武服外罩深蓝色短披风，
      赤手空拳但姿态从容，体格匀称矫健

  # ============================================================
  # v0.2 新锚点（基于 world-bible.md v0.3）
  # 项目级命名禁区：避免蜘蛛 / 蛛丝 / 蛛网（详见 docs/world-bible.md §5.7）
  # ============================================================

  # --- 主角 ---
  lengguyun: &lengguyun
    character_name: "冷孤云"
    character_appearance: |
      二十岁青年男子，黑发束于脑后系一条简素深色发带，几缕刘海略显不羁，
      面庞清瘦俊朗，眉目英挺、嘴角常带一丝不羁的笑意，
      眼神锐利却含玩世不恭之意，
      身着深灰色布袍内衬白色中衣，腰间束带悬一柄长剑，腰侧挂一只青瓷酒葫芦，
      体格修长矫健，武者身板但不威猛粗壮，
      整体气质放荡不羁、行侠仗义

  # --- 武师（主角师傅） ---
  xingfantian: &xingfantian
    character_name: "刑樊天"
    character_appearance: |
      五十出头中年男子，黑发已夹银丝、束于脑后，胡须浓重未刮净，
      面容方正坚毅、左眉骨有一道淡淡旧疤暗示江湖经历，
      神色严肃中藏温和，凝重时眉头深锁，
      身材高大健硕、体格粗壮，武者身板，
      身着深褐色厚布短衣外罩青灰色对襟长衣，腰间束粗皮带，
      气息内敛，武者退隐山林之态

  # --- 林西村酒馆老板（兼商店NPC，套用 art_validation_v2 已通过的客栈老板风格）---
  shenbanzhan: &shenbanzhan
    character_name: "沈半盏"
    character_appearance: |
      五十出头中年男子，微胖红润，国字脸络腮胡，
      头戴黑色软帽，神情和善但眼神精明，
      身着深褐色粗布短袍外罩米色围裙，
      酒馆掌柜世故气息

  # --- 林西村铁匠（送主角第一把铁剑）---
  duqingshan: &duqingshan
    character_name: "杜青衫"
    character_appearance: |
      四十多岁壮汉，黝黑肤色，束发简陋，
      着无袖粗布短衣袒露胸膛，肌肉鼓胀，双臂粗壮有力，
      腰间围着皮制围裙、身上多处淡淡铁锈痕迹，
      神色憨厚直爽，眼神坚定有力，
      铁匠世家出身的真挚气质

  # --- 女主 1：凌月派大师姐 ---
  yuewuxing: &yuewuxing
    character_name: "悦无姮"
    character_appearance: |
      二十二岁年轻女子，乌黑长发束于脑后留几缕散于颊侧，
      容貌清丽冷艳、气质独立坚毅（绝非萌系，参照成熟侠女风），
      眉目英气带一丝忧愁，神色坚毅,
      身着凌月派标志性月白色武服外罩淡紫色飘逸披帛，
      腰悬长剑、剑鞘玄黑，
      体格纤细但矫健，练武女子的英气，
      整体气质独立侠女

  # --- 章末战 boss：蒙面杀手首领（茗雾派伪装烈云盟）---
  killer_leader: &killer_leader
    character_name: "蒙面杀手首领"
    character_appearance: |
      三十多岁男子，全身黑色紧身夜行衣，黑色蒙面巾仅露一双锐利眼睛，
      胸前挂着烈云盟令牌（伪装道具，明显），袖口与腰带处隐约可见茗雾派独有暗器（暗示真实出处），
      右手持单手匕首，左手暗器袋鼓鼓囊囊，
      体格精瘦灵活，潜伏蓄势姿态，
      眼神冷酷无情、毫无温度

