tasks:
  - id: ui_quest_runtime_panel_v4
    template: ui_formal_panel
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      panel_description: >-
        a production runtime quest journal panel for the wuxia RPG Yun Ying Xia Zhuan.
        This must be an edge-to-edge opaque UI image: the forged-metal outer frame fills every
        pixel of the canvas, including all corners and side margins. Absolutely no sky, mountain,
        clouds, scenery, landscape, characters, or exterior visible behind or outside the frame.
        Use a wide 3:2 two-column layout: one centered blank title plaque at top, exactly two
        large blank primary-tab sockets above the left column, then a tall narrow left quest-list
        frame. In the header of that left frame: exactly two small secondary-tab sockets and one
        single wide blank dropdown recess. The right is one wide quest-detail frame with calm
        empty writing space. Along its lower-left place exactly three small empty square reward
        icon sockets in one row. Place exactly one medium blank command-button socket at the
        lower-right inside the detail frame. Use matte blue-black forged steel, teal jade trim,
        restrained cloud engraving and hand-painted Hong Kong wuxia comic material. No other
        sockets, no right-side top tabs, no footer bar, no double-button bar, no text, no symbols,
        no numbers, no item art, no watermark, no logo.
