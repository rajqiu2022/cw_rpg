tasks:
  - id: ui_quest_runtime_panel_v5
    template: ui_formal_panel
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      panel_description: >-
        a production runtime quest journal panel for the wuxia RPG Yun Ying Xia Zhuan.
        This must be an edge-to-edge opaque UI image: the forged-metal outer frame fills every
        pixel of the canvas, including every corner and side margin. Absolutely no sky, mountain,
        clouds, scenery, landscape, characters, or exterior visible behind or outside the frame.
        Use a wide 3:2 two-column layout: one centered blank title plaque at top, exactly two
        large blank primary-tab mounting zones above the left column, then one tall narrow empty
        quest-list frame on the left. The right is one wide empty quest-detail frame with calm
        writing space and generous blank lower area for live reward icons and a live command
        button. The list frame and the detail frame must have clean, simple inset interiors so
        Godot can overlay scrollable task rows, labels and controls precisely.
        Do NOT include any secondary tabs, chapter dropdown, reward icon sockets, buttons,
        button recesses, footer bars, fixed icon grids, extra top tabs, text, symbols, numbers,
        item art, watermark, or logo. Use matte blue-black forged steel, teal jade trim,
        restrained cloud engraving and hand-painted Hong Kong wuxia comic material.

