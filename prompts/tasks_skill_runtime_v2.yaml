tasks:
  - id: ui_skill_panel_runtime_v2
    template: ui_formal_panel
    category: ui/skill
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a formal martial arts manual interface background for a wuxia RPG: a wide title plaque, a small upper-left faction badge bay, a compact resource strip bay for total and available insight points, two large aligned columns with a narrower learned-skill list on the left and a larger skill-detail area on the right, two primary tab bays, five compact secondary filter bays, and a lower detail upgrade bay for raising a skill content level. Keep every live content area empty and clearly separated."

  - id: ui_skill_controls_runtime_v2
    template: ui_formal_control_atlas
    category: ui/skill
    priority: 1
    model: gpt-image-2
    vars:
      control_description: "a reusable atlas of separate formal wuxia RPG controls for a martial arts manual: two large primary tab controls, five compact secondary filter tab controls, one repeatable learned-skill row card in normal and selected states, one compact stat cell, one skill icon frame, one faction badge frame, one insight resource strip frame, and one upgrade-skill button in normal, hover, pressed, disabled states. Arrange each control as a clearly isolated rectangle with generous padding for slicing."
