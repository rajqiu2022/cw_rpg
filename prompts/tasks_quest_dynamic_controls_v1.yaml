tasks:
  - id: ui_quest_primary_tab_atlas_v1
    template: ui_formal_control_atlas
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      control_description: >-
        a clean sprite atlas of exactly four large horizontal primary navigation tabs for a wuxia
        quest journal: normal, selected, hover, pressed, arranged in one horizontal row with
        wide, perfectly even blank spacing between each tab. Each tab is a separate, standalone
        rounded-rectangle plaque of the exact same 3:1 size, with no text and no symbols. Normal
        is subdued blue-black forged steel with jade edge; selected has a crisp cold cyan jade
        rim and slight inner glow; hover is brighter; pressed is visibly recessed. Flat opaque
        near-black background only. No panel, no frame, no other controls, no item art, no text,
        no numbers, no watermark, no logo.

  - id: ui_quest_secondary_tab_atlas_v1
    template: ui_formal_control_atlas
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      control_description: >-
        a clean sprite atlas of exactly four small horizontal secondary navigation tabs for a
        wuxia quest journal: normal, selected, hover, pressed, arranged in one horizontal row
        with wide, perfectly even blank spacing. Each tab is a separate standalone plaque of the
        exact same 2.5:1 size, about 70 percent the height of a primary tab, with no text or
        symbols. Material is matte blue-black forged steel with restrained teal jade trim.
        Selected is clearly active with a cold cyan jade rim, hover brighter, pressed recessed.
        Flat opaque near-black background only. No panel, no frame, no dropdown, no buttons,
        no item art, no text, no numbers, no watermark, no logo.

  - id: ui_quest_chapter_dropdown_atlas_v1
    template: ui_formal_control_atlas
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      control_description: >-
        a clean sprite atlas of exactly three standalone wide chapter dropdown controls for a
        wuxia quest journal: normal, hover, open, arranged in one horizontal row with wide even
        blank spacing. Each control is the same 4:1 horizontal size, a quiet blue-black forged
        steel field with a teal jade border and one simple non-text down chevron at the far right.
        The control has a large empty center for live Chinese text. Hover has a brighter rim;
        open has a subtle recessed dark interior. Flat opaque near-black background only. No
        panel, no list of chapters, no other controls, no text, no numbers, no watermark, no logo.

  - id: ui_quest_reward_slot_atlas_v1
    template: ui_formal_control_atlas
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      control_description: >-
        a clean sprite atlas of exactly three standalone square reward item icon frames for a
        wuxia quest journal: normal, hover, selected, arranged in one horizontal row with wide
        perfectly even blank spacing. Each is an empty square socket with a transparent-looking
        very dark interior for a live item icon, same size and perspective, no item illustration,
        no quantity badge, no fixed number of slots. Matte blue-black forged steel with teal jade
        corners; hover brighter; selected has a crisp cold cyan rim. Flat opaque near-black
        background only. No panel, no button, no text, no numbers, no watermark, no logo.

  - id: ui_quest_track_button_atlas_v1
    template: ui_formal_control_atlas
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      control_description: >-
        a clean sprite atlas of exactly three medium horizontal command buttons for a wuxia quest
        journal: normal, hover, pressed, arranged in one horizontal row with wide perfectly even
        blank spacing. Each button is the same 3:1 size and has a calm empty center for live
        Chinese text, with no text or symbols baked in. Use blue-black forged steel, restrained
        teal jade trim, hover cold cyan rim, pressed visibly recessed. Flat opaque near-black
        background only. No panel, no reward sockets, no tab, no text, no numbers, no watermark,
        no logo.
