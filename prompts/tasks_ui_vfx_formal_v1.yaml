tasks:
  - id: ui_quest_panel_formal_v1
    template: ui_formal_panel
    category: ui/quest
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a quest dossier interface: a wide title plaque at the top, two large columns with a slightly narrower quest-list column on the left and a detail column on the right, two aligned primary tab bays under the title and three smaller secondary filter bays below them, plus a compact lower action strip"
  - id: ui_skill_panel_formal_v1
    template: ui_formal_panel
    category: ui/skill
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a martial arts manual interface: a wide title plaque at the top, a left-side technique list column, a larger right-side technique detail column, a row of compact category filter bays, a small school selector bay, and two balanced action bays along the bottom"
  - id: ui_shop_panel_formal_v1
    template: ui_formal_panel
    category: ui/system
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a travelling merchant shop interface: two equal inventory columns divided by an understated vertical steel rule, a slim title plaque at the top, a coin/status strip at the bottom"
  - id: ui_save_panel_formal_v1
    template: ui_formal_panel
    category: ui/system
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "an archive and save-record interface: a calm upper title plaque, five evenly spaced horizontal record bays, and a compact command area along the bottom"
  - id: ui_result_panel_formal_v1
    template: ui_formal_panel
    category: ui/system
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a battle result and chapter settlement interface: a strong central result plaque, three compact reward bays below it, and a quiet lower action strip"
  - id: ui_dialog_panel_formal_v1
    template: ui_formal_panel
    category: ui/system
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a dialogue choice interface: a wide lower dialogue field and three evenly spaced thin choice bays above it, with ink-brush corner decoration"
  - id: ui_battle_command_panel_formal_v1
    template: ui_formal_panel
    category: ui/system
    priority: 1
    model: gpt-image-2
    vars:
      panel_description: "a turn-based combat command interface: five evenly spaced command bays along the lower third, status and combat-log framing, and a restrained central turn plaque"

