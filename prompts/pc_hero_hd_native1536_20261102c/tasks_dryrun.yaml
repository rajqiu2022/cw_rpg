      asset_prompt: |
        Use case: identity-preserve
        Asset type: ONE production native-resolution PC-HD transparent protagonist idle sprite sheet.
        Input image 1: current v7 down-facing idle strip, strict identity, clothes, face, hair, empty hands, accessory sides, camera and planted-feet reference. Input image 2: current v7 down-facing walk strip, supporting identity and sheathed-sword reference, NOT an idle pose source.
        Preserve the exact same young Chinese swordsman: narrow face, warm natural skin, long tied black hair, charcoal blue-grey layered knee-length robe, off-white crossed collar, brown belt and pouches, bracers, black boots and fully sheathed plain sword. Keep the original accessory sides and scabbard length. Both hands empty. No new weapon, armor, hat, embellishment, handsome-face redesign or costume change. Repaint actual fine face, hair and cloth details at higher native density; do not enlarge/interpolate the old pixels.
        Output exact native1536x1024 RGBA, exactly FOUR equal384x1024 cells in ONE horizontal row. Each cell contains the same complete adult standing at the same centerx192 relative to that cell. Visible height450px from highest hair at abouty318 to lowest planted boot at abouty768; the large transparent top and bottom areas are intentional for this production layout. Do not expand the figure to fill the tall cell. Require at least26 transparent pixels around every complete silhouette; keep head, hair, boots, hands, sword and all accessories fully inside the cell. Do not move the person between cells or fit each pose independently.
        Four ordered subtle idle frames: neutral, gentle inhale, soft breathing peak, return. Exact same planted legs and boot stance in all four; only extremely restrained chest, hair-tip and cloth breathing. No walking, stepping, foot shuffle, lifted heels, turning or big gestures. All frames face screen DOWN toward the viewer in the original35-degree-down orthographic2.5D gameplay camera. Same adult proportions and camera in every frame; no eye-level portrait angle, no chibi or plastic doll.
        Style is crisp restrained realistic hand-painted wuxia game character art with upper-left diffuse daylight, matching v7 colors and material identity. Preserve small-scale readability rather than adding decorative clutter.
        Genuinely transparent RGBA in all empty space and all cell edges, no matte, magenta, grey mist, checkerboard drawing, floor patch, floor shadow, background, grid line, cell border, text, number, label, watermark or signature. Exactly four separate frames only. Native body target450px and minimum320px must be measured after generation; under-resolution, clipping, incorrect frame count or invalid grid is rejected, never upscaled into compliance.
