tasks:
  - id: ui_quest_runtime_panel_v2
    template: ui_formal_panel
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      panel_description: >-
        a final production quest journal screen for the wuxia RPG Yun Ying Xia Zhuan:
        a fully illustrated dark forged-steel and teal-jade panel with a broad blank title plaque,
        two large blank primary tab sockets, three compact blank category-tab sockets, a tall left
        quest-list recess, a larger right quest-detail recess, and two blank lower command-button
        sockets. The frame must look like hand-painted Hong Kong wuxia comic game art, with cloud
        engraving, jade clasps and restrained worn metal detail. It must be a self-contained UI
        background with no scenery outside the frame; every text area remains dark, quiet and blank
        for Godot-rendered dynamic text.
