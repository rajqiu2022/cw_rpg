tasks:
  - id: ui_quest_runtime_panel_v3
    template: ui_formal_panel
    category: ui/quest
    priority: 1
    model: gpt-image-2
    skip: false
    vars:
      panel_description: >-
        a final production runtime quest journal panel for the wuxia RPG Yun Ying Xia Zhuan,
        based on a two-column 3:2 landscape layout. Create one broad blank title plaque centered
        near the top; below it, a large two-socket primary-tab rail aligned over the left column
        only. The left column is a tall narrow quest-list frame with a compact internal header band
        for two small secondary tabs and one chapter dropdown recess, then a quiet scrollable list
        area. The right column is a wide, tall quest-detail frame: generous description space,
        a horizontal reward-icon strip in the lower-left of the detail content, and exactly one
        small blank command-button socket placed at the lower-right inside the detail frame.
        The panel must use dark forged steel, teal jade trim, restrained cloud engraving and
        hand-painted Hong Kong wuxia comic material. All slots are blank and low contrast for
        Godot-rendered Chinese text and runtime icons. Do not include any right-side top tabs,
        any empty top-right sockets, any bottom footer sockets, any double-button bar, or any
        decorative compartment outside the title, two-column content frames and single command slot.
