tasks:
  - id: ui_skill_faction_crests_v1
    template: ui_formal_control_atlas
    category: ui/skill
    priority: 1
    model: gpt-image-2
    vars:
      control_description: "five separate circular wuxia faction crest icons in one evenly spaced horizontal row, generous black matte gaps for slicing. From left to right: Wudang, a balanced black-white mountain-water and soft cloud emblem; Huashan, a silver sword rising before a sharp pale mountain peak; Gufeng, a warm amber cleaver silhouette and rugged mountain ridge; Lingyue, a pale silver crescent moon with icy petals; Mingwu, deep ink mist curling around an abstract dark mask motif. Each icon uses the same blue-black forged metal rim and jade inlay, has a clear central image, contains no letters, no Chinese text, no runes, no numbers, and no logo."
