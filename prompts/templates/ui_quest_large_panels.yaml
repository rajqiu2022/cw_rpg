id: ui_quest_large_panels
description: 任务面板大组件（面板底图、详情面板、标题匾额）+ 参考设计稿
size: "1536x1024"
resolution: "1k"
reference_images:
  - "game/art/ui/cold_wuxia/v2/ui_display_quest_bright.png"

prompt_template: |
  参考设计稿风格。纯白背景，放置 3 个独立大控件，互不重叠，控件间留足白色间距。
  
  1. 面板底图（1180×680）：深色玄铁底，四角云纹角花，冷钢蓝边框，内部竹影暗纹分区。无文字。
  2. 详情面板（610×480）：深墨蓝底，钢蓝边框，内有 4 条水平淡色分隔线暗示标题/描述/条件/奖励区。无文字。
  3. 标题匾额（320×60）：玄铁扁长条，云纹角花，冷钢蓝边框，中间留空。无文字。
  
  港漫厚涂冷色暗调。禁止文字数字字母水印。

variables: {}
