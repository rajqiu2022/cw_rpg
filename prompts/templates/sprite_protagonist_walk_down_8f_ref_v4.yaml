id: sprite_protagonist_walk_down_8f_ref_v4
description: High-resolution reference-locked down walk 8+1 loop-check strip.
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/game/art/characters/protagonist_portrait.png"
require_reference_images: true

prompt_template: |
  Use the supplied portrait as the exact identity and body-proportion reference. Preserve the black tied hair, dark blue-grey cross-collar robe, leather chest strap, dark boots, sword, and one small grey-green double-lobed wine gourd at the left belt.

  Create one 1536x1024 horizontal RPG walking sprite strip with exactly nine isolated equal cells and pure white gaps. Each cell contains one complete full-body character around 150px high, facing straight toward the camera with the same baseline and ample space around the figure.

  Frames 1-8: left contact, recoil with feet closing, left passing directly beneath torso, right forward swing, right contact, recoil with feet closing, right passing directly beneath torso, left forward swing. Frame 9 exactly repeats frame 1 for loop checking. Keep torso, belt, sword and gourd stable. No stretched source art, no crop, no cell crossing, no standing pose, no text, grid, shadow, duplicate or trail.
  Hong Kong wuxia comic game sprite style. Avoid: {negative}

variables: {}
