# 主角 Field 向下（正面朝镜头）行走 8 帧 balanced 扩展 strip
# 基于用户确认可接受的下走 4 帧 balanced，保留关键姿态，只补小过渡。

id: sprite_protagonist_walk_down_8f_balanced_from_4f
description: Field 用向下行走 8 帧 balanced 循环 strip（由 4 帧 balanced 插补）
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_down_4f_balanced_slow.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图是用户确认可接受的 **下走 4 帧 balanced 版**，必须作为角色外观、体块、中轴稳定、脚步节奏、剑和酒葫芦位置的权威参考。
  - 本次任务是把这套 4 帧扩展成 8 帧：保留原关键姿态，只在它们之间插入小过渡帧。
  - 不要重新设计角色；不要改变衣服颜色、发型、剑、酒葫芦、脸型或身高比例。

  【输出目标】
  - 一张 **单行 8 格** 向下（角色正面朝向镜头、相对玩家向下走）sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：保留 4 帧 balanced，不要重新生成新动作】
  - 参考图第 1 / 2 / 3 / 4 格分别对应本图第 1 / 3 / 5 / 7 格。
  - 第 2 / 4 / 6 / 8 格只是小过渡：脚、膝盖、袖口、袍子下缘轻微变化。
  - 头、脸中心、胸口白衣中心、腰带扣中心、整体身高必须与参考图稳定一致。
  - 禁止重新画成大袍摆左右摇；禁止把四个关键姿态抹平到几乎一样。
  - contact 帧与 passing 帧保留中等轮廓差，按慢速播放应稳定不摇。

  【中轴与基线硬要求】
  - 8 格头顶高度、眼睛高度、胸口白衣中心、腰带扣中心稳定；水平漂移不超过 2 px。
  - 四帧关键姿态和四帧过渡都保持同一脚底最低基线；禁止上下跳。
  - 左右肩不要摇摆，肩线只能有极小上下呼吸感；不要身体左右倾斜。
  - 袍摆只允许小幅开合，不允许像披风一样向一侧大甩。

  【向下 8 帧循环】
  - 角色视角：正面朝向镜头。能看到脸、胸口、白色中衣、腰带、剑柄和青瓷酒葫芦。
  - 第 1 格：左脚 contact A，接近参考图第 1 格。
  - 第 2 格：第 1 到第 3 的小过渡，左脚收回，右脚准备经过中线；中轴不动。
  - 第 3 格：passing A，接近参考图第 2 格。
  - 第 4 格：第 3 到第 5 的小过渡，右脚向画面下方/前方摆出；中轴不动。
  - 第 5 格：右脚 contact B，接近参考图第 3 格。
  - 第 6 格：第 5 到第 7 的小过渡，右脚收回，左脚准备经过中线；中轴不动。
  - 第 7 格：passing B，接近参考图第 4 格。
  - 第 8 格：第 7 回到第 1 的小过渡，左脚准备向画面下方/前方踏出；不要突然大跳。
  - 播放顺序为 1 → 2 → 3 → 4 → 5 → 6 → 7 → 8 → 1。按 120-140ms/帧或 160ms/帧播放都应自然。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止左右摇摆；禁止大袍摆甩动；禁止脚底上下跳。
  - 禁止变成侧向或背向；本图必须是正面朝镜头。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
