id: sprite_protagonist_turnaround_standard_v1
description: Medium-build four-direction full-body turnaround reference.
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/game/art/characters/protagonist_portrait.png"
require_reference_images: true

prompt_template: |
  Use the supplied portrait for identity. Create a clean 1024x1024 four-direction full-body RPG character turnaround with exactly four equally sized isolated views: front, back, right, left. Pure white background, no text or labels.

  Lock one medium wuxia body standard in every view: approximately seven heads tall, medium athletic torso, natural shoulders, moderate legs, neither tall-thin nor short-stocky. Dark blue-grey cross-collar robe reaches mid-calf, dark boots, leather chest strap, sword, and exactly one small grey-green double-lobed wine gourd at the left belt. All four views have exactly the same character height, head size, shoulder width, waist level, robe length and boot size.

  Hong Kong wuxia comic game-sprite reference, clean ink outlines. Standing neutral only: no walking, no action pose, no crop, shadow, grid, duplicate, or exaggerated anatomy.
  Avoid: {negative}

variables: {}
