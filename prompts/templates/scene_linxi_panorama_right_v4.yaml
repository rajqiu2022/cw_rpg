id: scene_linxi_panorama_right_v4
description: Native right panel for Linxi's scrollable tutorial map without an image-reference request.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 right-hand continuation panel for a scrollable Chinese wuxia RPG map. It must visually match a hand-painted, ink-outlined 2.5D village in warm morning light: natural gray tile roofs, weathered dark wood, muted bamboo green, pale dirt paths, cool stone, clear comic ink outlines, high three-quarter camera (not isometric tile art).

  Composition: the left 12 percent is a dense bamboo, rocky slope and a low wooden fence bordering a broad pale dirt lane, designed as a seam transition from a previous panel. The lane continues with completely clear, continuous 200-pixel-wide walking ground through the center, curves gently down and right, then visibly reaches a modest open timber village gate at the lower-right edge. Put a compact open-front blacksmith workshop in the upper-right quarter, with gray tile roof, stone footings, open door-level frontage, and an empty forge bay. Keep the road and the full front of the workshop unobscured. The shoulder beside the lane is intentionally empty so a separately placed chest and stone tablet can be added later.

  This is only the base scenery layer. No people, NPCs, animals, characters, readable writing, signs, UI, portal arrows, watermark, chest, stone tablet, stele, marker, corpse, cart, or loose interactive props. No oversized roof must cover the road. Do not make a collage; make one coherent gameplay map panel.
