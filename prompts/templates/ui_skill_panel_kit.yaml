id: ui_skill_panel_kit
description: 武学技能面板 UI 控件集合（参考技能界面设计稿）
size: "1536x1024"
resolution: "1k"
reference_images:
  - "game/art/ui/cold_wuxia/v2/ui_display_skill_bright.png"

prompt_template: |
  参考提供的设计稿风格。纯白背景，放置以下独立 UI 控件，互不重叠，留足间距。

  1. 面板底框（约 1280×700）：深色玄铁底，冷钢蓝边框，四角云纹角花，内部竹影暗纹。无文字。
  2. 标题匾额（约 320×60）：玄铁扁长条形，冷钢蓝边框，中间留空。无文字。
  3. 关闭按钮 三态竖排（各约 44×44）：normal=暗钢底冷蓝边 / hover=光晕提亮 / pressed=内凹暗色。无文字。
  4. 技能行底框 两态竖排（各约 430×96）：normal=暗墨蓝底细钢蓝边 / selected=霜蓝边框微光。无文字。
  5. 筛选标签 三态横排（各约 96×38）：normal=深墨蓝底细边 / selected=霜蓝高亮 / hover=加亮。无文字。
  6. 快捷设置按钮 两态横排（各约 160×48）：normal=深竹绿底钢蓝边 / hover=青绿光晕。无文字。
  7. 详情面板（约 610×400）：深墨蓝底钢蓝边框，内部有分隔线暗示标题/描述/效果区。无文字。

  风格：港漫厚涂冷色暗调，玄铁/霜蓝/深竹绿。禁止文字数字水印。

variables: {}
