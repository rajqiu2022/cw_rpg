id: scene_linxi_hero_bedroom_interior_v2_scale_v1
description: Correctly scaled small bedroom interior for the Linxi protagonist.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior background, viewed from a high three-quarter angle. This is a genuinely small single-person bedroom in a modest bamboo village cottage, not a grand hall. Use a standing adult character reference height of about 90 pixels on the 1536x1024 canvas: the single bed must be only about 150 to 180 pixels wide and 220 pixels long, with believable human-scale furniture. The bed must never dominate the room or exceed three times the character width.

  Show one modest wooden bed along the upper-left wall with a folded blue-grey robe, a small writing desk, a narrow weapon stand, a bamboo window, a woven mat, and a small travel pack. Leave a broad clear walking floor in the center and right. Keep a clearly visible open doorway at the lower center leading outside.

  Style: warm hand-painted Hong Kong wuxia comic game art, crisp ink contours, believable compact-room perspective, consistent scale between bed, desk, weapon stand and a human player, no people, no animals, no text, no UI, no watermark.

  Do not draw a treasure chest, large furniture, oversized bed, mansion-sized room, gate, foreground frame, or any object blocking the lower-center doorway. Leave the right side open for a separate small interactive chest.
