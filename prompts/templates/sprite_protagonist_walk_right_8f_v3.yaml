# 主角 Field 向右行走 8 帧 strip（v2 统一版）
# 纯文提示词，无参考图，确保与其他方向同一批次风格一致。

id: sprite_protagonist_walk_right_8f_v3
description: Field 用向右行走 8 帧 strip（v2 统一版，侧向视角）
quality: medium
size: "1536x1024"

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【输出目标】
  - 一张 **单行 8 格** 向右行走 sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，八格保持同一脚底基线；上方留白可以很多。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【视角】
  - 正交侧向略俯视（Field Sprite2D 用），身体主轴朝画幅左侧。
  - 禁止 45° 等距地砖透视；禁止变成正面或背面。
  - 角色是侧身像，能看到身体侧面、剑和酒葫芦在腰侧。

  【向右 8 帧循环，相位必须均匀】
  - 第 1 格 contact A：左脚在前方（画面右侧）落地，右脚在后方；步幅适中。
  - 第 2 格 down A：左脚承重，右脚后跟抬起，身体极轻微下沉；不要与第 1 或第 3 重复。
  - 第 3 格 passing A：右脚经过身体正下方，双脚距离最小；身体回到中位。
  - 第 4 格 up A：右脚向画面右侧摆出但尚未落地，左脚开始蹬地；不要与第 3 或第 5 重复。
  - 第 5 格 contact B：右脚在前方落地，左脚在后方；与第 1 左右腿对调。
  - 第 6 格 down B：右脚承重，左脚后跟抬起，身体极轻微下沉；不要与第 5 或第 7 重复。
  - 第 7 格 passing B：左脚经过身体正下方，双脚距离最小；身体回到中位。
  - 第 8 格 up B：左脚向画面右侧摆出，即将回到第 1 格；不要突然大跳。
  - 播放顺序 1→2→3→4→5→6→7→8→1。

  【对齐硬要求】
  - 8 格脚底基线完全一致：支撑脚鞋底都压在同一条不可见水平线。
  - 8 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 3 px；腰带高度变化不超过 2 px。
  - 身体绝对不能左右摇晃；躯干垂直中轴线在 8 格中位置完全固定。
  - 剑、衣摆、头发不要跨进相邻格。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。
  - 剑和青瓷酒葫芦在所有帧中位置稳定，不要忽然换边、消失或变色。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止身体左右摇晃。
  - 禁止 45° 等距地砖透视。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
