prompt_template: |
  Use the supplied image strictly as the identity, costume, body-proportion, contour and lighting reference for Leng Guyun. Create ONE horizontal four-cell game sprite strip for a Chinese wuxia 2.5D RPG. The four equal cells must show the exact same full-body character walking to screen right in a clean seamless cycle: frame 1 right-foot contact, frame 2 passing pose with feet close, frame 3 left-foot contact, frame 4 passing pose matching the transition back to frame 1.

  Each cell contains one complete character, full head to boots, same 90-pixel runtime silhouette proportion, same seven-head medium athletic build, same tied black hair, blue-grey cross-collar robe, pale collar, brown diagonal strap, waist sword, and exactly one grey-green gourd on his left belt. He faces clearly right in every cell. Keep head, chest, belt and foot baseline locked to the same positions across all cells; only legs, arms, hem and small hair movement may change. The sword and gourd must not change sides or drift between cells.

  Preserve the reference's premium 2.5D hand-painted game-sprite rendering: warm upper-left key light, subtle cool right-side fill, soft cloth-fold occlusion, matte materials, clean dark ink contours. Use a perfectly flat #00ff00 chroma-key background only, with no floor, shadow, scenery, labels, grid lines, borders, text, watermark or extra figures. Leave generous green spacing between cells. Avoid long strides, floating feet, pose drift, cropped body, perspective rotation, photorealism, chibi style, headband, red hair tie, extra gourd or western armor.
