id: ui_field_hud_player_panel_v6
description: 左上角角色信息面板（用户原版prompt），400×150有效区
quality: high
size: "1024x1024"

prompt_template: |
  生成一个中国武侠RPG游戏的左上角角色信息面板，整个面板长方形，整个面板底图是深蓝色金属材质，有质感，左上角圆形的角色头像框，底部是名字框（4个字），右边等级、门派信息，。底部话一个铜钱图标，右边一个文本框显示金钱数量，长度100px，再往右显示生命和内力值。气+内，右边是进度条，血槽蓝槽是深色空凹槽，右边不需要图标。名字、金钱、等级、门派、气和内对应的数字留空不显示。头像框保留背景，头像不显示，切记：头像位置是透明的，不是白色，底部名字留空，整个面板区域400*150，其余都是白色，可以方便裁切。

variables: {}
