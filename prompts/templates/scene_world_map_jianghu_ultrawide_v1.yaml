id: scene_world_map_jianghu_ultrawide_v1
description: Final native-width capability test for a scrollable world travel map.
quality: high
size: "3072x1024"

prompt_template: |
  Create one complete ultrawide 3:1 world travel map for a Chinese wuxia single-player RPG, seen from a high three-quarter illustrated atlas perspective. Compose a continuous east-west continent rather than separate panels: western sword mountains and misty valleys on the left, bamboo villages and connected farmland in the center, a major walled river city and lake settlement to the right, and a blue eastern coast with a small island at the far right. A broad continuous pale road must run from the far-left village through the central plain and city approaches to the far-right coast; add only natural side roads to distinct landmarks.

  This is a strategic overworld with clear roads for a walking player. Keep all landmarks naturally connected by plains, rivers and bridges. Use hand-painted 2.5D Chinese martial-arts game art, controlled dark ink contours, jade green, earth ochre, stone gray and river blue, coherent sunny light.

  No people, NPCs, animals, text, labels, UI, arrows, markers, readable signs, parchment border, compass, watermark, collage panels, hard vertical composition breaks, duplicated landmarks, or cut-off roads.
