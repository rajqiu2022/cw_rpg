# 主角 sprite · 模块化拆件实验图（单张大图排版）
# 参考：「游戏元素拆分 gpt-image2」一文：分段 + 清单 + 排版要求，让模型像拼乐高一样理解部件。
# 注意：gpt-image-2 单张分辨率有限，拆件越多越容易糊/粘连；本模板偏「探索实验」，通过后需人工裁切与校对。

id: sprite_protagonist_parts_sheet
description: 冷孤云（或同锚点）港漫风拆件总图，白底，部件分区摆放
quality: medium
size: "896x896"

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  拆件后每一小块的脸型、发型、服饰配色仍须与整体描述一致。

prompt_template: |
  {style_anchor}

  【整体要求】
  - 输出一张「角色拆件总图」sprite sheet：港漫厚涂 2.5D、墨线清晰、色彩明亮饱和（非像素块）。
  - 仅一名角色的部件，禁止出现完整第二人。
  - 纯白背景 #FFFFFF，部件之间留出明显空隙，禁止部件边缘互相粘连、禁止阴影把缝隙糊死。
  - 单张 896×896，因此部件数量要克制：只做「头颈 + 躯干主块 + 双臂 + 发型大块 + 剑 + 酒葫芦」级别，不要细碎到每根睫毛。

  【角色身份】
  {identity_anchor}

  【必须拆出的独立图块（每一块轮廓闭合、可矩形裁切）】
  - 头部整体（含五官，不必再拆眼球）
  - 前发与后发分为两块（若发量简单可合并为「头发」一块）
  - 躯干上装（含腰带，可与下摆分块或整块）
  - 左臂、右臂（上臂+前臂可各一块，手与袖子可合并）
  - 长剑一柄（完整武器）
  - 腰侧酒葫芦一只（完整道具）

  【排版要求】
  - 所有部件平铺在画面中下部，自上而下大致分三行：上行头发与中块、中行头与躯干、下行手臂与武器酒壶。
  - 同类部件靠近摆放，块与块之间至少留 8～16 像素级距的纯白间隙（视觉上清晰可分）。
  - 不要画外框、不要写部件名称文字、不要标尺线。

  【禁止】
  - 禁止蜘蛛、蛛丝、蛛网。
  - 禁止繁体中文、水印、签名。

  【反向】
  {negative}

  【备注】
  {{sheet_note}}

variables:
  character_name: "必填"
  character_appearance: "必填"
  sheet_note: "一句话说明实验目的，如：v0.1 拆件总图实验"
