# 主角 Field 向右行走 8 帧循环 strip + 闭环校验帧
# 生成 9 格：第 1～8 格用于动画，第 9 格必须复制第 1 格姿态，用来强制 8→1 闭环。

id: sprite_protagonist_walk_right_8f_loop_strip
description: Field 用向右行走 8 帧循环 strip（第9格为第1格闭环校验）
quality: medium
size: "1440x512"

reference_images:
  - "C:/Users/rajqiu/.cursor/projects/f-Code-RPG-GAME/assets/c__Users_rajqiu_AppData_Roaming_Cursor_User_workspaceStorage_d8451740145b37dfe4633684e350af4b_images_image-de2e0dd6-c5f2-458b-a9f8-bc6409c5ad15.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图只用于理解传统武侠 RPG sprite 的小人比例、行走节奏、帧表排布。
  - 不要照抄参考图人物、蓝衣、文字标签、深色背景、色板、边框或 UI。

  【输出目标】
  - 一张 **单行 9 格** 向右行走 sprite strip，画布 **1440×512**。
  - 第 1～8 格是可播放的 8 帧循环；**第 9 格是闭环校验帧，必须与第 1 格姿态几乎相同**，用于证明第 8 帧能自然接回第 1 帧。
  - 隐形网格：9 列 × 1 行；每格约 160×512；每帧小人居中。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 sprite，不是大立绘。

  【对齐硬要求】
  - 9 格角色脚底基线完全一致：支撑脚鞋底都压在同一条不可见水平线。
  - 9 格角色身体中心在各自格子的水平中心；角色大小一致，头顶高度变化不超过 6 px。
  - 不要让剑、衣摆、头发跨进相邻格太多；每格都能单独裁切。

  【向右 8 帧循环，相位必须均匀】
  - 第 1 格 / 帧1 contact A：左脚在前方（画面右侧）脚跟着地，右脚在后方脚尖点地；双腿最大步幅。
  - 第 2 格 / 帧2 down A：身体略下沉，左脚全掌承重，右脚后跟抬起准备离地。
  - 第 3 格 / 帧3 passing A：右脚抬起经过身体正下方，膝盖弯曲；左脚支撑，双脚间距最小。
  - 第 4 格 / 帧4 up A：右脚向前摆到画面右侧但尚未落地，身体略升；左脚开始蹬地。
  - 第 5 格 / 帧5 contact B：右脚在前方脚跟着地，左脚在后方脚尖点地；与第 1 格左右腿对调。
  - 第 6 格 / 帧6 down B：身体略下沉，右脚全掌承重，左脚后跟抬起准备离地。
  - 第 7 格 / 帧7 passing B：左脚抬起经过身体正下方，膝盖弯曲；右脚支撑，双脚间距最小。
  - 第 8 格 / 帧8 up B：左脚已经向前摆到画面右侧、即将落成第 1 格的左脚前踏；身体略升；这是接回第 1 格前的最后过渡。
  - 第 9 格 / loop check：**复制第 1 格 contact A 姿态**（左脚前、右脚后、同一手臂摆动），只允许极小衣摆差异。
  - 重点：第 8 格到第 9 格必须是最小动作差，不得突然换成完全不同的大跨步；第 9 格与第 1 格必须能重叠。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 9 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩行走；禁止第 8 格到第 1 格跳帧。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
