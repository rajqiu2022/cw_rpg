prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior: a compact martial arts training hall as an isometric cutaway room centered on a pure black 1536x1024 canvas. The room takes about 72 percent of the canvas; everything outside is solid pure black. Restrained hand-painted Hong Kong wuxia comic game art with strong ink contours, warm wood and muted jade banners. Include training mats along the left and right sides, a weapon rack at the back, one wooden practice dummy, a simple master desk, and a hanging plaque without readable text. Leave a large uncluttered central floor for a 90-pixel-tall player, NPC sparring and runtime effects. At lower center leave one unframed black exit gap only. No doorframe, exterior scenery, people, animals, chest, UI, readable text or watermark.
