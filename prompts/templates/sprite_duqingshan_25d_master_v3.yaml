prompt_template: |
  Create exactly one square 4 by 4 sprite atlas for Du Qingshan, the Linxi village blacksmith. He is a tall, sturdy Chinese man in his late thirties: practical athletic build, broad shoulders but not bodybuilder-muscular, sun-browned square face, thick eyebrows and black hair tied in a short working topknot. He wears a dark teal sleeveless work vest over a faded blue-grey shirt, a worn brown leather apron, broad work belt, loose dark work trousers and sturdy dark boots. One small smith hammer hangs at his belt. He is warm and capable, not an armored warrior, not a bandit, not chibi, not short or round.

  Rendering must harmonize with the blue-grey-robed protagonist: premium 2.5D Chinese wuxia comic field sprite, restrained dark ink contours, warm upper-left light, cool fill and painted material volume readable at 160 pixels tall.

  Flat #ff00ff chroma-key background only. Row 1 front/down, row 2 back/up, row 3 right, row 4 left. Columns 1-4 calm planted stance, gentle breath, tiny apron/shoulder cloth flutter, return to planted stance. Every full body has both boots complete and on an identical foot baseline. No grid, text, UI, scene, floor, cast shadow, crop, extra limb, duplicate figure or action pose.

