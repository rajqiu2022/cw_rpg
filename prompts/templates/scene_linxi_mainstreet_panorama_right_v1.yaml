id: scene_linxi_mainstreet_panorama_right_v1
description: Right panel continuation for Linxi Village's scrollable main street exploration map.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 right-hand continuation panel for a scrollable Chinese wuxia RPG village main street. Match an inviting hand-painted comic 2.5D environment: high three-quarter camera, crisp ink outlines, warm morning light, gray tile roofs, weathered timber, pale stone, muted bamboo green, faded red lanterns without people or writing.

  Composition: at the far left, continue a broad 220-pixel-wide stone-and-dirt lane from a previous village panel, framed by low wall and bamboo. The open lane travels diagonally through the center and continues toward a clear village exit at the lower-right edge. Place static building masses only: a compact open-front blacksmith workshop in the upper-left with clear door-level frontage and a dark unlit forge bay, and a quiet residence with a small stone courtyard in the upper-right. Keep the middle and both road shoulders open for later NPCs, chest, forge glow, quest board, and portal-arrow overlays. The exit must be visibly reachable along the lane, not behind a roof or fence.

  Base scenery only: no people, NPCs, animals, carts, chest, tablets, quest boards, loose props, readable writing, sign text, UI, arrows, watermark, or roof blocking the route. No crowded market, no collage; make one coherent gameplay map panel with clear feet-level collision landmarks.
