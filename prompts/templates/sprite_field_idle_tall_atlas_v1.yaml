id: sprite_field_idle_tall_atlas_v1
description: Tall-proportion four-direction subtle idle atlas for a field character.
quality: medium
size: "1024x1024"

prompt_template: |
  Create one 2.5D Chinese wuxia RPG idle-sprite atlas for {character_spec}. The figure must be a natural adult 7.5-head-tall proportion: visibly longer legs, narrower waist and shoulders than a bodybuilder, never short, squat, wide or chibi. Keep a clean grounded silhouette readable at 160 pixels tall.

  Exactly one 4 by 4 atlas on a perfectly flat #ff00ff chroma-key background. Rows: front/down, back/up, right, left. Columns: calm planted stance, tiny breathing, slight cloth/hair movement, return to the planted stance. Feet must remain fixed in every column: no stepping, no walking, no sliding. Full head-to-boots body, identical scale, same feet baseline, each figure isolated in its own cell.

  Premium 2.5D hand-painted field sprite, warm upper-left key light, cool ambient fill, matte cloth and leather, restrained comic ink contours. No background, floor, cast shadow, grid, label, UI, card, text, border, crop, extra limbs, duplicate figure, armor, cape or unrelated accessories.

variables:
  character_spec: ""
