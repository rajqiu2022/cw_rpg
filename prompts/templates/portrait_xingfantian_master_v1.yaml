id: portrait_xingfantian_master_v1
description: 刑樊天退隐武师头像，简朴村中装束，大师气质，对话框用
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  角色头像特写，用于游戏对话框 UI 头像显示。1024×1024 正方形。

  角色：刑樊天，五十多岁的退隐武师。

  外貌特征：
  - 四十岁左右中年男子，黑色长发中夹杂几缕银丝，随意束于脑后
  - 脸上有风霜痕迹但不过分苍老，面容方正刚毅，眼神深邃内敛
  - 左眉骨有一道淡淡的旧刀疤，暗示曾经江湖经历
  - 胡须修剪随意略带粗犷，正值壮年
  - 身材魁梧壮实，武者骨架，但穿着极为朴素

  服装（关键——退隐村中武师，不是门派弟子）：
  - 粗麻布质感的灰褐色短褐（农民穿的粗布上衣），袖口挽起露出手臂
  - 外罩一件洗得发白的深灰色旧长衫，打着几处不明显的补丁
  - 腰间系一条粗布腰带，没有任何门派标识或华丽装饰
  - 整体穿着简朴到近乎寒酸，像村中普通长者
  - 不要任何门派制服、华丽纹饰、金线刺绣

  气质：
  - 虽然穿着简朴，但眼神中藏着高手的内敛锋芒
  - 不怒自威，静如深渊，一看便知不是普通村夫
  - 神色温和中带着一丝凝重与沧桑
  - 二十年隐退生活的沉淀感

  构图：
  - 正方形头像特写，肩部以上，脸部占画面 60% 以上
  - 角色居中偏上，正面微侧 3/4
  - 背景：林西村清晨竹林虚化散景，柔和的晨光从侧面照来
  - 港式漫画厚涂，墨线分明，脸型方正立体

  反向：{negative}

variables: {}
