# 主角 idle 待机 4 帧 strip（v2 加强风动版）
# 双脚不动，衣服下摆、发带、袍袖、散发有明显风吹飘动。

id: sprite_protagonist_idle_wind_4f_v2
description: Field 用 idle 待机 4 帧 strip，双脚不动，风动衣发可见
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/sprite_lengguyun_walk_right_8f_v2.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图是刚生成的右走 8 帧 v2，作为角色外观、身高比例、衣袍颜色、脸型、剑和酒葫芦的**唯一权威参考**。
  - 本次做的是 idle 待机，角色静止站立，只有风吹衣发的微动。
  - 角色身体比例、大小、头部尺寸、衣袍颜色必须与参考图完全一致。
  - 角色在画布上的总体高度（脚到头顶）必须与参考图一致。

  【输出目标】
  - 一张 **单行 4 格** 待机 idle sprite strip，画布 **1024×1024**。
  - 隐形网格：4 列 × 1 行；每格约 256×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度与参考图完全一致（约 **72～96 px**）。

  【视角】
  {{facing_desc}}

  【核心：idle 待机 + 明显风动】
  - **双脚完全不动**，稳稳站在地上，脚位和鞋尖方向在 4 帧中完全固定。
  - 身体躯干、头、腰带保持高度稳定，水平漂移不超过 2 px，垂直漂移不超过 1 px。
  - **风吹效果必须肉眼可见**，不能太微弱让人看不出来：
    - 脑后发带尾端来回飘摆（位移 **8～15 px**），是画面中最显眼的动感元素
    - 几缕散发在脸颊或颈侧来回拂动（位移 **4～8 px**）
    - 袍摆下缘被风掀起又落下，前摆和后摆交替上扬（波动幅度 **6～12 px**）
    - 袖口边缘小幅飘拂（位移 **4～8 px**）
    - 腰带末端左右晃动（位移 **3～6 px**）
    - 衣袍上有 1～3 条轻微衣褶随风变化位置
  - 4 帧风动相位要均匀分布，播放后能无缝循环。
  - 风的方向是持续的轻风从左向右吹（侧向时）/ 从画面远处向前吹（正面时）。

  【待机 4 帧风动相位】
  - 第 1 格：微风吹起，发带和袍摆开始上扬。
  - 第 2 格：风到最强，发带扬至最高点，袍摆抬至最高，散发飘开最远。
  - 第 3 格：风渐弱，发带开始回落，袍摆开始下沉。
  - 第 4 格：风最弱，发带近垂近静，袍摆近原位。与第 1 格衔接自然。
  - 播放 1→2→3→4→1 形成无缝循环。

  【对齐硬要求】
  - 4 格脚底位置完全一致，身体中轴位置完全一致。
  - 头顶高度变化不超过 2 px；腰带高度变化不超过 1 px。
  - 每格都能单独裁切。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 4 格必须是同一人，与参考图完全一致的外观。
  - 外衣统一为 **中偏深冷灰粗布长袍**。
  - 内衬白色；腰带近黑褐；酒葫芦青瓷灰绿；鞋深色短靴。
  - 黑发束脑后，简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 简化到小人 sprite，轮廓线清楚。
  - 整体气质沉静从容，不是战斗姿态。
  - 与参考图完全一致的风格、笔触、上色方式。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服。
  - 禁止双脚移动、迈步、换脚、滑步。
  - 禁止身体左右摇晃、上下跳动。
  - 禁止风动太弱几乎看不见。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
