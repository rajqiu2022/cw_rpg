id: ui_quest_panel_kit_v2
description: 任务面板 UI 控件集合（参考 ui_display_quest_bright 设计稿）
size: "1024x1024"
resolution: "1k"

# 用已有的设计稿作为参考锚定风格
reference_images:
  - "game/art/ui/cold_wuxia/v2/ui_display_quest_bright.png"

prompt_template: |
  参考提供的设计稿风格，生成一张武侠游戏"任务卷宗界面"的 UI 控件图。
  纯白背景（后期抠除），上面摆放多个独立的小控件，互不重叠，控件之间留足白色间距。
  
  必须包含以下控件（全部透明或纯白背景，无任何文字）：
  
  1. 面板底图（约 1180×680）：深色玄铁底，四角云纹角花，冷钢蓝边框，内部浅暗纹分区暗示。无文字。
  2. 标题匾额（约 320×60）：玄铁扁长条形，云纹角花，冷钢蓝边框，中间留空。无文字。
  3. 关闭按钮 三态横排（各约 40×40）：normal=暗钢底+冷蓝边 / hover=光晕提亮 / pressed=内凹暗色。无文字。
  4. 详情面板（约 610×480）：深墨蓝底，钢蓝边框，内部有水平分隔线暗示标题/描述/条件/奖励四区。无文字。
  5. 任务列表行 两态纵排（各约 430×96）：normal=暗墨蓝底+细钢蓝边框 / selected=霜蓝边框+微光。无文字。
  6. 追踪按钮 三态横排（各约 180×42）：深竹绿底+钢蓝边框 / 绿光晕 / 暗绿内凹。无文字。
  7. 筛选标签 四态横排（各约 96×38）：深墨蓝底+细钢蓝边框 / 选中高亮 / hover加亮 / pressed内凹。无文字。
  
  风格：港漫厚涂、冷色暗调、墨线清晰、玄铁/霜蓝/深竹绿/暗酒红点缀。
  禁止：任何文字、数字、字母、水印、签名、繁体字、暖金色大片、喜庆红。

variables: {}
