id: ui_quest_detail_panel
resolution: "1k"
size: "1024x1024"
reference_images:
  - "assets/raw/ui_dialog/ui_cold_wuxia_quest_screen_gpt_v1.png"

prompt_template: |
  参考提供的游戏界面设计稿风格。纯白背景，生成以下独立控件，互不重叠，留足间距。
  
  1. 任务详情面板底框（约 580×500）：深墨蓝底，冷钢蓝边框，四角云纹角花。
     内部分为四个区域暗示：
     - 顶部标题区（留空，文字运行时叠加）
     - 描述区（大面积留白）
     - 目标/进度区（左侧留空放文字，右侧留空放进度数字）
     - 奖励区（底部横排留 3-4 个小格子位置，暗示道具图标）
     所有区域用淡分割线隔开。无任何文字。
  
  2. 任务列表行底框 两态竖排（各约 550×110）：
     - normal: 暗墨蓝底，细钢蓝边框
     - selected: 霜蓝边框，微金光泽
     左侧留一个小图标位置，右侧留标题和简述位置。无文字。
  
  风格：港漫厚涂冷色暗调，玄铁/霜蓝/微金。禁止文字数字水印。

variables: {}
