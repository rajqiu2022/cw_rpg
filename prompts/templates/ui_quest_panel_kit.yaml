id: ui_quest_panel_kit
description: 任务面板 UI 控件集合（绿底）
size: "1024x1024"
resolution: "1k"

prompt_template: |
  生成一张武侠游戏 UI 控件集合图。绿色背景（像绿幕一样），上面放着多个独立的小控件卡片。

  每个控件是独立的矩形小卡片，卡片之间留出绿色间距，不要连在一起。
  绿色背景会被后期抠掉，所以每个控件必须被纯绿包围。

  控件清单（从左到右，从上到下依次摆放）：

  1. 一个深色游戏面板 1280×700，玄铁质感底，边框冷钢蓝，四角有云纹角花装饰
  2. 一个深色小匾额 360×70，玄铁底，冷钢蓝边框
  3. 关闭按钮，暗红色底+霜蓝边框（3个横排：普通、发光、凹陷）
  4. 筛选标签按钮，深墨蓝底+细钢蓝边框（4个横排：普通、高亮蓝边、加亮、凹陷）
  5. 深墨蓝下拉框 190×42，右边有个蓝色三角箭头
  6. 任务行背景卡片 460×100（2个竖排：普通暗蓝底、选中态金色边框）
  7. 深墨蓝详情面板 630×500，钢蓝边框，内部有几条淡色分隔线
  8. 追踪按钮 190×50（3个横排：深绿底、绿发光、暗绿凹陷）

  要求：港漫厚涂质感、冷色暗调、所有控件不要任何文字。背景纯绿色。

variables: {}