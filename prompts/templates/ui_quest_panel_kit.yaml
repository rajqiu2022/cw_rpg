id: ui_quest_panel_kit
description: 任务面板 UI 组件 atlas（无字，可切分复用）
quality: high
size: "1536x1024"

identity_anchor: |
  《云影侠传》寒山玄铁冷色武侠 UI 组件 atlas，
  深墨蓝、玄铁黑、冷钢蓝边、霜蓝高光、寒玉点缀，
  港漫厚涂质感，墨线清晰，云纹暗刻、竹影。

prompt_template: |
  {{identity_anchor}}

  生成一张"任务卷宗界面"的 UI 组件切图 atlas。这些组件会被切分成独立 PNG 并在 Godot 引擎中作为正式 UI 素材使用。
  这不是完整界面截图，不是 loading 图，不是网页设计稿。

  必须包含的组件（全部独立摆放、互不重叠、留足切分间距）：

  1. 面板底图（1280×700）：深色玄铁纹理底，四角云纹角花，边框冷钢蓝，内部有淡淡的竹影暗纹。居中放置。
  2. 标题匾额（320×60）：玄铁底、冷钢蓝边框、云纹角花，匾额中央留空（文字由游戏运行时叠加）。匾额暗示"任务卷宗"的位置和形状。
  3. 关闭按钮（三态横排，各 120×42）：normal=暗钢色底+霜蓝描边，hover=霜蓝光晕增强，pressed=内凹暗色。无文字。
  4. 筛选标签按钮（四态横排，各 96×38）：normal=深墨蓝底+细钢蓝边框，selected=霜蓝高亮边框+微光，hover=边框加亮，pressed=内凹。无文字。
  5. 章节下拉框（180×38）：深墨蓝底、右侧冷钢蓝三角箭头、边框霜蓝。无文字。
  6. 任务列表项底框（两态纵排，各 430×96）：normal=暗墨蓝底+细钢蓝边框，selected=霜蓝边框+金色微光。内部分上下两行文字区的布局暗示。无文字。
  7. 详情区面板（610×480）：深墨蓝底、钢蓝边框、云纹角花，内部有标题区/描述区/条件区/奖励区的分区阴影暗示，各区之间用细霜蓝线分隔。无文字。
  8. 追踪按钮（三态横排，各 180×42）：normal=深竹绿底+钢蓝边框，hover=竹绿光晕，pressed=暗绿内凹。无文字。
  9. 卷宗统计标签（200×24）：深墨蓝细底、右侧对齐布局暗示。无文字。

  规格：
  - 1536×1024 横版画布，纯白或纯黑背景（便于后处理抠图）。
  - 所有组件编号顺序从上到下、从左到右排列，互不重叠，间距至少 20px。
  - 9-slice 友好：面板的四角和四边清晰、对称、可拉伸。
  - 画面内不要任何文字、数字、字母、符号。所有按钮和面板的"文字位置"通过留空区域暗示。
  - 中国武侠元素：玄铁匾额、冷钢边、云纹暗刻、寒玉扣、竹影暗纹、山雨雾气。
  - 色调：阴沉冷色，深墨蓝、玄铁、冷钢蓝、霜蓝、寒玉；深竹绿用于追踪按钮；暗酒红仅用于关闭按钮 hover 态的微小点缀。
  - 不要橙黄色、不要暖金（除列表项选中态的微金）、不要喜庆红绸、不要西幻、不要现代扁平 UI。

  反向：英文文字、拉丁字母、数字编号、水印、签名、网页 UI、扁平化、西幻符文、魔法阵、科幻霓虹、暖金色主色、喜庆红色、橙黄色。繁体字、伪中文、乱码。

variables:
  kit_name: "任务卷宗界面组件 kit"
