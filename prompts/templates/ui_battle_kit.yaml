id: ui_battle_kit
description: 战斗界面 UI 控件集合（冷色武侠风）
size: "1536x1024"
resolution: "1k"
reference_images:
  - "game/art/ui/cold_wuxia/v2/ui_display_quest_bright.png"

prompt_template: |
  参考提供的设计稿风格。纯白背景，放置以下独立 UI 控件，互不重叠，留足间距。
  
  1. 生命条外框（约 400×22）：暗血红底，冷钢蓝边框，内部可填充。无文字。
  2. 内力条外框（约 400×16）：寒蓝底，冷钢蓝边框。无文字。
  3. 战斗命令按钮 5枚横排（各约 180×52）：normal=暗钢底冷蓝边 / hover=光晕提亮 / pressed=内凹暗色。全部无文字。
  4. 战斗日志框（约 800×200）：深墨蓝底，冷钢蓝边框，四角云纹角花，内部大面积留白。无文字。
  5. 玩家状态牌（约 280×120）：深墨蓝底，冷钢蓝边框，左侧留头像位置，右侧留名称和血条位置。无文字。
  6. 敌人状态牌（约 280×120）：深墨蓝底，暗红边框，右侧留头像位置，左侧留名称和血条位置。无文字。
  7. 回合提示标签（约 200×40）：深墨蓝细底，冷钢蓝边框，中间留空。无文字。

  风格：港漫厚涂冷色暗调，玄铁/霜蓝/暗血红。禁止文字数字水印。

variables: {}
