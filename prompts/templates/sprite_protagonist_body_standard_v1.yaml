id: sprite_protagonist_body_standard_v1
description: Single full-body proportion standard for Leng Guyun field sprites.
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/game/art/characters/protagonist_portrait.png"
  - "F:/Code/RPG_GAME/game/art/sprites/battle/lengguyun_attack_slash_south_f01.png"
require_reference_images: true

prompt_template: |
  Use both supplied images strictly as the identity and costume reference for Leng Guyun. Generate ONE single, isolated, full-body neutral standing character only. This is a body-proportion master for a 2D wuxia RPG sprite pipeline, not a sprite sheet.

  Composition: full body centered, facing the viewer in a calm natural A-pose with arms relaxed; feet flat and evenly spaced; leave generous empty white space on every side. Pure white studio background. No ground, shadow, scenery, border, grid, panel, labels, typography, watermark, duplicate person, cropped body, or action pose.

  Identity and costume must match the reference: young Chinese wuxia swordsman, black tied hair without headband, dark blue-grey cross-collar robe reaching mid-calf, pale inner collar, dark trousers and boots, a muted brown leather diagonal chest strap, sword worn at the waist, and exactly ONE small grey-green double-lobed wine gourd hanging at the left belt. Keep the face, hair, robe palette, sword, and gourd recognizably identical to the supplied references.

  Lock a practical game-sprite body standard: approximately seven heads tall, medium athletic build, natural shoulder width, compact torso, moderate leg length, neither thin and elongated nor short and stocky. The robe hem reaches mid-calf and both boots remain fully visible. Hong Kong wuxia comic game-art rendering with clean dark ink contours, restrained painted shading, readable at small scale.

  Avoid: text, infographic, compliance poster, Chinese document, UI, collage, multiple views, turnaround sheet, headscarf, forehead band, red hair tie, spider, web, demon, western armor, extra gourd, oversized weapon, exaggerated anatomy.

variables: {}
