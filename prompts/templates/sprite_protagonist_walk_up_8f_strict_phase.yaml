# 主角 Field 向上（背面朝镜头）行走 8 帧严格脚步相位 strip
# 目标：解决 balanced_from_4f 的“两脚相位不协调”，逐帧指定左右脚状态。

id: sprite_protagonist_walk_up_8f_strict_phase
description: Field 用向上行走 8 帧严格脚步相位 strip（背面，逐帧左右脚协调）
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_up_4f_balanced_slow.png"
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_right_8f_stable_from_4f.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图 1 是用户确认可接受的上走 4 帧 balanced，用于锁定角色外观、背面朝向、中轴和关键姿态。
  - 参考图 2 是已通过目视验收的右走 8 帧，用于学习 8 帧中 contact / passing / swing 的左右脚交替节奏。
  - 本次必须解决“两只脚不协调”：不要让同一只脚连续小幅抖动；必须清楚交替左脚、右脚。

  【输出目标】
  - 一张 **单行 8 格** 向上（背面朝镜头）行走 sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色居中。
  - 背景纯白 #FFFFFF；无文字、无色板、无网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，field sprite，不是大立绘。

  【总体运动原则】
  - 后脑中心、束发根部、背脊中心、腰带后侧中心固定在垂直中轴上；不要左右晃。
  - 脚底最低点保持同一基线；不要上下跳。
  - 袍摆只小幅开合；不要靠大袍摆制造动作。
  - 8 帧必须形成明确循环：左脚远踏 → 右脚经过中线 → 右脚远踏 → 左脚经过中线 → 回到左脚远踏。

  【最重要：逐帧脚步相位，不得混乱】
  - 玩家视角左侧脚 = 角色左脚；玩家视角右侧脚 = 角色右脚。
  - 第 1 格 / left contact：左脚向画面上方/远处踏出并着地；右脚留在画面下方/近处。
  - 第 2 格 / left support + right lift：左脚仍承重在远处，右脚从近处抬起，开始向身体中线移动。
  - 第 3 格 / right passing：右脚抬起经过身体正下方中线，膝盖微弯；左脚仍支撑但开始收回；这是窄轮廓 passing。
  - 第 4 格 / right swing：右脚越过中线向画面上方/远处摆出，但尚未完全落地；左脚退到近处。
  - 第 5 格 / right contact：右脚向画面上方/远处踏出并着地；左脚留在画面下方/近处。必须与第 1 格左右脚对调。
  - 第 6 格 / right support + left lift：右脚仍承重在远处，左脚从近处抬起，开始向身体中线移动。
  - 第 7 格 / left passing：左脚抬起经过身体正下方中线，膝盖微弯；右脚仍支撑但开始收回；这是窄轮廓 passing。
  - 第 8 格 / left swing：左脚越过中线向画面上方/远处摆出，即将回到第 1 格；右脚退到近处。
  - 第 8 格到第 1 格必须是小变化，不要突然换脚、不要两脚同时着地。

  【禁止的脚步错误】
  - 禁止同一只脚连续 3 帧都在远处。
  - 禁止第 2 / 3 格几乎一样，禁止第 6 / 7 格几乎一样。
  - 禁止两只脚一直贴在身体正下方，看起来像原地踏步。
  - 禁止 contact 帧两脚并拢；contact 帧必须有一远一近。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人：同一背影、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**；腰带近黑褐；酒葫芦青瓷灰绿；鞋深色短靴。
  - 禁止头巾、额带、红发带、头顶绑布；禁止画出正脸、五官或胸口。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止左右摇摆；禁止大袍摆甩动；禁止脚底上下跳；禁止画出正脸、侧脸或胸口。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
