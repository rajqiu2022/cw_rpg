id: ui_dialog_narration_frame_v1
description: Bottom dialog frame for narration and lines without a portrait.
quality: high
size: "1536x1024"

prompt_template: |
  Create one Chinese wuxia RPG narration dialog frame on a pure white background. The usable frame is a single wide bottom-panel asset, horizontally centered, sized about 1500 by 330 pixels, with all other canvas area remaining perfectly pure white for later cropping.

  Style: cold ink-blue blackened steel, double steel-blue outline, subtle muted gold cloud-corner ornaments, hand-painted Hong Kong wuxia comic UI, matching a premium in-game dialog frame. Unlike a character dialog frame, this design has no portrait window, no avatar border, no split panel, and no decorative empty block on the left. The entire inner area is one continuous dark readable text surface with wide safe padding. Include a small empty nameplate groove near the upper-left of the panel and a small unobtrusive empty continue-marker recess at the lower-right.

  No text, no letters, no numbers, no dialogue, no icon, no character, no watermark, no bright neon, no parchment, no UI outside the single dialog frame. Keep the inner text area clean and unornamented.
