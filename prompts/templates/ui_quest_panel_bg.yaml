id: ui_quest_panel_bg
description: 任务面板主底图—玄铁厚涂风格，参考背包/装备面板
model: gpt-image-2
size: "1536x1024"
quality: high
skip: false
priority: 1

identity_anchor: |
  《云影侠传》2.5D武侠AVG-RPG UI面板。寒山玄铁冷色风格。
  深墨蓝玄铁质感底、冷钢蓝边框、寒玉青高光、云纹角花装饰。
  港漫厚涂暗调，与游戏已有面板统一视觉。

reference_images:
  - "game/art/ui/inventory/panel_bg.png"
  - "game/art/ui/equipment/panel_bg.png"

prompt_template: |
  {{identity_anchor}}
  
  生成一张任务卷宗面板的完整底图。
  
  规格：
  - 深墨蓝玄铁底，质地细腻有微妙金属颗粒感
  - 四角有清晰精致的祥云纹角花装饰，角花大小适中不暄宾夺主
  - 冷钢蓝色粗边框（4-6px），边框内侧有细微高光线
  - 面板内部中央有浅淡的竖向分隔暗示（左侧列表区+右侧详情区），不要实线，用暗纹或微妙色差区分
  - 整体色调暗沉但层次分明，不能有大面积纯黑块
  - 风格必须与参考图(背包面板、装备面板)的色调/材质/质感完全一致
  - 纯白背景，面板居中放置
  - 不要任何文字、数字、水印、签名
  
  输出：一张横向宽面板底图，纯白底上居中显示。

variables: {}
