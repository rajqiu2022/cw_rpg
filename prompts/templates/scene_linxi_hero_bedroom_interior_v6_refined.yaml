id: scene_linxi_hero_bedroom_interior_v6_refined
description: Refined small room-stage without a doorway frame.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior presentation: a compact isometric cutaway bedroom centered in the middle of a pure black 1536x1024 canvas. The room takes up the central 65 percent of the image and every area outside it is solid pure black. No outdoor scenery, grass, path, exterior walls, vignette, UI, text, or watermark.

  At the lower center, the room's bottom wall has one simple unframed rectangular missing section opening directly into pure black. This is only a dark exit gap: absolutely no doorframe, no door posts, no lintel, no arch, no threshold beam, no railing, and no visible outside ground. The game will place its own arrow there.

  Strict miniature furniture scale for a 90-pixel-tall adult player sprite: a narrow single cot at the left is only 130 pixels wide and 185 pixels long; a tiny desk and narrow weapon rack are each smaller than the cot. The room is a humble one-person cottage. Leave clear floor through the center and right for the player and a separate small interactive chest. Do not draw a chest.

  Style: restrained warm hand-painted Hong Kong wuxia comic game art, crisp dark ink contours, wood floor and plaster walls, high three-quarter view, no people or animals. Avoid oversized furniture, mansion scale, doorway structure, and any object blocking the exit gap.
