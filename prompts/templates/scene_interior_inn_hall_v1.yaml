id: scene_interior_inn_hall_v1
description: Reusable roadside inn common room stage.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior: a small roadside inn common room as an isometric cutaway room centered on a pure black 1536x1024 canvas. The room takes about 72 percent of the canvas; everything outside is solid pure black. Warm but restrained hand-painted Hong Kong wuxia comic game art, crisp ink outlines, high three-quarter view. Include a long service counter at upper left, three small round tables with stools along the sides, a tea shelf, hanging paper lanterns and a stairway rising at upper right. Keep the central floor open for a 90-pixel-tall player and several runtime NPCs. At lower center create only a simple unframed black exit gap. No doorframe, posts, threshold, exterior scenery, people, animals, baked chest, UI, text or watermark.
