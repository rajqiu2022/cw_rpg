id: scene_module_atlas
description: 模块化 2D RPG 场景资产 atlas（透明背景，12-20 个独立元素，可切分复用拼装场景）
quality: high
size: "1536x1024"

identity_anchor: |
  2D 手绘港漫武侠风格 游戏场景元素 atlas，
  正交略俯视视角（~30°，像从空中斜下方看桌面），
  统一右上方暖光、阴影朝左下方投射，
  色调冷峻：深墨蓝、冷钢青、竹绿、雾灰为主，
  墨线粗重清晰、厚涂质感、高饱和但冷色主导，
  透明背景（alpha 通道），每个元素完整独立、无遮挡。
  不要人物、NPC、中文字、英文、编号、水印、签名。
  禁止暖金色、橙黄、棕褐、喜庆红色等暖色调。

reference_images: []

prompt_template: |
  {{identity_anchor}}

  生成一张"模块化游戏场景资产 atlas"，主题：{{kit_theme}}。
  这些资产会被切分成独立 PNG，在 Godot 中作为 Sprite2D 摆放拼装场景。
  这不是完整背景图，不是宣传插画，不是 loading 图，不是概念画。

  元素清单（12–20 个独立元素）：
  {{module_list}}

  规格：
  - 1536×1024 横版画布
  - 所有元素独立摆放，互不重叠，元素之间留足切分空白（≥40px）
  - 透明背景（RGBA 四角 alpha=0）
  - 每个元素完整无遮挡，轮廓清晰可单独裁切
  - 同一美术风格、同一透视、同一光源（右上暖光）
  - 元素可缩放、镜像、换色后组合成多个不同场景
  - 建筑类元素按左中右分块，可拼出任意宽度的房屋
  - 植物类元素包含前景遮挡用的枝叶

  禁止：完整场景背景、电影概念图、单张大插画、loading screen、人物、
  文字标签、UI 按钮、模糊边缘、低清像素风、3D CG 渲染感、照片质感、
  白底粘连、阴暗泥灰色、蜘蛛/蛛网意象、橙色暖金色调。{{negative}}

variables:
  kit_theme: "如：林西村建筑模块 / 竹尾村植物模块 / 地面道路模块 / 道具装饰模块"
  module_list: "列出 12–20 个元素，每行一条，含简要说明"
  negative: 可选的额外反向词
