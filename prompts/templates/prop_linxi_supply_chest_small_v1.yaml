id: prop_linxi_supply_chest_small_v1
description: Small practical wooden supply chest for the protagonist bedroom.
quality: high
size: "1536x1024"

prompt_template: |
  Create one small closed wooden supply chest as a production game prop for a 2.5D Chinese wuxia RPG. Use a high three-quarter view matching warm hand-painted Hong Kong wuxia comic game art, crisp ink contours, restrained practical craftsmanship, dark honey-brown wood, simple iron bands, and a small brass lock. The chest must look like a modest household storage box prepared by a martial arts master, not a giant treasure chest or a rare magical chest.

  Place exactly one chest centered with generous padding. The visible chest should occupy roughly 22 percent of the canvas width and 18 percent of the canvas height, with a flat readable foot base and no cast shadow.

  Use one perfectly flat solid #FF00FF chroma-key background only. No floor plane, gradient, text, labels, watermark, extra props, coins, gems, glow, open lid, or second chest.
