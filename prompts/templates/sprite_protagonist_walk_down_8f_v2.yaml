# 主角 Field 向下（正面朝镜头）行走 8 帧 strip（v2 统一版）
# 参考右走 v2 的外观，确保角色比例、颜色完全一致。

id: sprite_protagonist_walk_down_8f_v2
description: Field 用向下行走 8 帧 strip（v2 统一版，正面朝镜头）
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/sprite_lengguyun_walk_right_8f_v2.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图是刚生成的 **右走 8 帧 v2**，作为角色外观、身高比例、衣袍颜色、脸型、剑和酒葫芦的**唯一权威参考**。
  - 本次把视角从侧向改为**正面朝镜头**，但角色身体比例、大小、头部尺寸、衣袍颜色、剑和酒葫芦的样式和位置关系**必须与参考图完全一致**。
  - 不要重新设计角色；不要改变任何外观元素。
  - 角色在画布上的总体高度（脚到头顶）必须与参考图一至。

  【输出目标】
  - 一张 **单行 8 格** 向下行走 sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度与参考图完全一致（约 **72～96 px**），人物在画布上的大小比例必须与参考图相同。

  【视角】
  - 角色**正面朝向镜头**。能看到脸、胸口、白色中衣、腰带正面、剑柄和青瓷酒葫芦。
  - 双肩水平对称；身体中轴垂直不偏。
  - 禁止变成侧向或背向。

  【核心：稳定，禁止左右摇摆】
  - 头、胸、腰带中心必须完全稳定，水平漂移不超过 **2 px**。
  - 左右肩保持水平，不要一侧高一侧低，不要身体左右倾斜。
  - 躯干中轴在 8 帧中位置完全固定，只能有腿部以下的变化。
  - 腿、鞋尖、膝盖、袍子下缘有中等步幅变化；contact 帧下半身轮廓宽约 10～18 px，passing 帧较窄。

  【向下 8 帧循环，相位必须均匀】
  - 第 1 格 contact A：左脚向画面下方踏出，鞋尖清楚，右脚在身后略被袍遮；上半身正中。
  - 第 2 格 down A：左脚承重，右脚后跟离地；身体极轻微下沉；不要与第 1/3 重复。
  - 第 3 格 passing A：右脚经过身体正下方，双脚距离最小，膝盖微弯。
  - 第 4 格 up A：右脚向下方摆出但尚未落地，左脚开始蹬地；不要与第 3/5 重复。
  - 第 5 格 contact B：右脚在下方踏出落地，左脚在身后；与第 1 格左右腿对调。
  - 第 6 格 down B：右脚承重，左脚后跟离地；身体极轻微下沉；不要与第 5/7 重复。
  - 第 7 格 passing B：左脚经过身体正下方，双脚距离最小。
  - 第 8 格 up B：左脚向下方摆出，即将回到第 1 格；不要突然大跳。
  - 播放顺序 1→2→3→4→5→6→7→8→1。

  【对齐硬要求】
  - 8 格脚底最低点完全一致。
  - 8 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 3 px；腰带高度变化不超过 2 px。
  - 身体绝对不能左右摇晃；躯干垂直中轴在 8 格中位置完全固定。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人，与参考图完全一致的外观。
  - 外衣统一为 **中偏深冷灰粗布长袍**。
  - 内衬白色；腰带近黑褐；酒葫芦青瓷灰绿；鞋深色短靴。
  - 黑发束脑后，简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 简化到小人 sprite，轮廓线清楚。
  - 与参考图完全一致的风格、笔触、上色方式。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止左右摇摆；禁止大袍摆甩动。
  - 禁止变成侧向或背向。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
