id: luoyang_modular_v2_street_lamp
description: One complete realistic human-scale Luoyang street lantern post. Built-in only; NOT CC0.
backend: codex_builtin_imagegen
model: builtin
size: "1024x1024"
background: transparent
transparent_background: true
quality: high
reference_images:
  - game/art/maps/luoyang_modular_v1/source/inn_v1.png
require_reference_images: true
prompt_template: |
  Use case: historical-scene.
  Asset type: ONE isolated transparent RGBA street lamp for a realistic Chinese wuxia RPG city INTERIOR, not an icon or miniature.
  Input images: the existing Luoyang inn is a MATERIAL AND LIGHTING reference only, not an edit target. Match its believable timber, lantern cloth and weathered stone, without including any part of the inn.
  Primary request: one complete sturdy traditional Chinese street lantern post, a dark aged timber upright in a modest square weathered grey stone socket, an elegantly braced short horizontal wooden arm, and ONE modest dark-red cloth lantern suspended from a short iron hook. The lantern has believable slender timber ribs, softly wrinkled faded red fabric, a small dark protective cap and restrained short tassel. Show precise mortise joints, natural wood grain, worn corners, iron fastening and chipped stone. It is a craftsman's working daylight street fixture, not a simple T-shaped block or fantasy lamp.
  Composition/framing: fixed FRONT-FACING ORTHOGRAPHIC camera directly SOUTH looking NORTH, 30 degrees elevation above horizontal, parallel projection and no vanishing point. Full post, complete lantern and lowest front edge of the stone foot visible, with 10% true transparent margin on all sides. Tall narrow silhouette; intended logical game height about 180-205 pixels beside a 113.5-pixel adult. Real height about 3.1 metres; do not make the hanging lantern large enough for a person to stand inside.
  Lighting/mood: neutral clear upper-left/front daylight, soft cool ambient fill; lantern UNLIT, no bloom, magical glow or orange illumination painted over the background. Only a tiny contact shade immediately below the stone foot.
  Text: NONE. No characters, signs, symbols, tassel lettering or emblems.
  Constraints: photorealistic physically detailed pre-rendered 3D appearance matching realistic Chinese timber buildings; one object and one ground contact, sharp clean natural edges. Truly transparent alpha=0 outside the silhouette and in all gaps. No ground plane, paving patch, people, plants, second lamp, architectural backdrop, long baked shadow, fog, grey halo, checkerboard, colored backdrop, crop, comic outline, painting, anime, toy-like plastic, UI, logo or watermark.
