id: ui_field_hud_player_panel_pixelperfect
description: |
  角色信息面板（像素精确版 v3）。
  1024×1024 画布，面板精确占据 (12,12)→(1012,387) = 1000×375。
  裁切后 1000×375 均匀缩放 0.4x → 400×150 游戏分辨率。
  HP/MP 填充不由 AI 绘制，改用 Godot ColorRect + clip_contents。
quality: medium
size: "1024x1024"

identity_anchor: |
  《云影侠传》游戏 HUD 角色信息面板。
  冷色武侠风格：深墨蓝玄铁底框、冷钢蓝双层描边、手绘厚涂、
  寒玉扣角花、云纹暗刻、低饱和冷色金属质感。
  运行时 Godot 叠加动态文字、头像、ColorRect 血蓝条。

reference_images:
  - "assets/_style_bible/00_protagonist_portrait_ref.png"
  - "assets/raw/ui/field_hud/reference/hud_right_buttons_design_ref.png"

prompt_template: |
  {style_anchor}

  生成 1024×1024 游戏 HUD 面板底图。面板只在 (12,12)→(1012,387) = 1000×375 区域内绘制。
  区域外纯白 #FFFFFF。所有坐标从左上方 (0,0) 开始，x 右 y 下。

  必须绘制的元素（每个都要画出来，精确到像素）：

  1. 面板外框: (12,12)→(1012,387) 深墨蓝玄铁底板，圆角16px，冷钢蓝双层描边，四角云纹角花
  2. 名字铭牌: (232,36)→(568,84) 玄铁凹槽铭牌，四边暗刻边框，左侧小铆钉(244,60)，空白不写字
  3. 门派铭牌: (232,96)→(568,132) 玄铁凹槽铭牌，有竹叶暗纹，空白不写字
  4. 头像圆框: 圆心(120,120) 外半径84 内半径64，外环玄铁+寒光描边，内镂空纯黑#000000
  5. "气"字: (232,204)→(280,244) 港漫手写体，冷钢蓝墨色
  6. 血槽: (292,208)→(924,240) 深墨蓝空凹槽，圆角4px，凹陷阴影，不画红色填充
  7. "内"字: (232,260)→(280,300) 港漫手写体，霜蓝墨色
  8. 蓝槽: (292,264)→(924,296) 深墨蓝空凹槽，圆角4px，凹陷阴影，不画蓝色填充
  9. 铜钱图标: (48,332)→(84,368) 外圆内方孔古铜色
  10. 金币铭牌: (92,332)→(272,368) 凹槽铭牌，空白不写字
  11. 等级铭牌: (788,332)→(968,368) 凹槽铭牌，左侧写"等级"二字(港漫手写体，冷钢蓝)，右侧空白

  严格规则：
  - 血槽蓝槽都是深色空凹槽，不留任何填充色
  - 所有铭牌凹槽内不写随机文字
  - 面板外纯白，不画英文繁体水印签名
  - 不画暖金喜庆红色块

  反向：{negative}

variables: {}
