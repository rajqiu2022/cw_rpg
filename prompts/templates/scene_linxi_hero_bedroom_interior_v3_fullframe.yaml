prompt_template: |
  Create a production-ready full-frame 2.5D Chinese wuxia RPG background, viewed from a high three-quarter angle. Fill the entire 1536x1024 canvas edge to edge with the inside of a modest, compact one-person bamboo-village bedroom. No black border, no vignette, no empty exterior margin, no stage frame, and no unused canvas space.

  The scale must be consistent with a standing adult player sprite about 90 pixels tall: a simple single bed on the upper-left wall is about 160 pixels wide and 220 pixels long, a small writing desk is about the same human scale, and a narrow weapon stand is shorter than the bed. The room must be a humble cottage room, not a mansion or a great hall.

  Include the small bed, folded blue-grey robe, compact desk, bamboo window, woven mat, travel pack, and one narrow weapon rack. Leave clear walking floor across the central and right half. A clearly visible open doorway is at the lower center leading outside. Keep the right-middle floor empty for a separate small chest.

  Style: warm hand-painted Hong Kong wuxia comic game art, crisp ink contours, wood and plaster interior, believable compact-room perspective, no people, no animals, no text, no UI, no watermark. Do not draw any chest, oversized furniture, gate, foreground frame, or object blocking the doorway.
