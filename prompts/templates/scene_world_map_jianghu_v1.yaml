id: scene_world_map_jianghu_v1
description: Textless 2.5D Chinese wuxia RPG overworld map.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 hand-painted Chinese wuxia RPG overworld map for free walking travel. High top-down oblique view, rich Hong Kong comic ink outlines with painterly texture, late-summer green mountains, clear rivers, pale dirt roads, warm parchment edge only as a subtle painted border.

  Composition: broad mainland fills the canvas with a deep-blue eastern sea. Build an understandable connected road network between seven clearly different textless landmark areas: a small northwest mountain village, a central bamboo market town, a northern Taoist mountain, a western sword mountain with cliffs, a southern rugged mountain fortress, an eastern moonlit bamboo sect on a lake, and a large central-eastern walled river city. Add distant misty mountains in the far west, a foggy tea-estate mountain in the southwest, and one small offshore island in the southeast. Each location must be recognizable from its silhouette but contain NO readable signs or labels.

  The roads must be light, continuous, and visibly walkable with several junctions. Preserve broad open grassland and road shoulders for a small player marker and later runtime location icons. Base terrain only: no people, NPCs, monsters, chests, arrows, UI, text, fake lettering, banners with writing, watermark, grid, or board-game pieces.
