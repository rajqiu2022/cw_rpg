id: sticker_bunny_hongbao
description: 可爱小兔子收到红包动态表情，文字"谢谢老板"
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  生成一个可爱的卡通小兔子表情包/贴纸风格图片。

  主体：
  - 一只圆润可爱的白色小兔子，长耳朵，圆脸，大眼睛闪闪发光充满惊喜和开心
  - 兔子双手捧着/抱着一个大红包（中国传统红色信封，金色装饰/福字）
  - 兔子表情：眼睛弯成月牙形，笑得非常开心，脸颊有可爱的红晕
  - 周围有几个金色小元宝和红色爱心飘浮，表达喜庆氛围
  - 整体动态感强，像动画截图一样生动活泼

  文字：
  - 图片下方或兔子旁边，用可爱的手写风格中文写上"谢谢老板"
  - 文字清晰可读，简体中文
  - 字体风格：圆润可爱，像卡通对话框里的文字

  风格：
  - 可爱卡通贴纸风格，线条圆润流畅
  - 色彩鲜艳明快，粉嫩温暖的色调
  - 干净的白色/浅色背景（方便作为表情包使用）
  - 不要写成繁体、英文、水印、签名

  反向：{negative}

variables: {}
