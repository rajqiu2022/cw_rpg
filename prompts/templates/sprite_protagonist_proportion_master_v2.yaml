id: sprite_protagonist_proportion_master_v2
description: Equal-scale protagonist standing and walk proportion board.
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/game/art/characters/protagonist_portrait.png"
require_reference_images: true

prompt_template: |
  Use the supplied portrait for identity only. Same black tied hair, dark blue-grey cross-collar robe, leather chest strap, boots, sword, and one grey-green double-lobed wine gourd at the left belt.

  Create a 1024x1024 board with eight separate equal-size cells in a strict 2 by 4 grid, pure white background and no labels. Every one of the eight characters must have the exact same pixel height and head-to-body proportion: approximately seven heads tall, medium athletic build, neither tall-thin nor short-stocky. This equal scale rule is mandatory: bottom-row characters must not be larger, longer-legged, or more zoomed than top-row characters.

  Top: standing down, standing up, standing right, standing left. Bottom: right contact, right passing, left contact, left passing. Walking views keep the same torso, shoulder width, robe length, head size, boots and belt height as standing views; only legs and arms change. Hong Kong wuxia comic game sprite reference, clean ink lines, no crop, shadow, text, grid, duplicate, or exaggerated legs.
  Avoid: {negative}

variables: {}
