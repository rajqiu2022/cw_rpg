# 主角 idle 待机 6 帧 strip（v3 统一版）
# 参考右走 v3 的外观，与行走同一批次生成，确保角色一致。
# 角色静止站立，轻风吹动发带和衣袍。

id: sprite_protagonist_idle_6f_v3
description: Field 用 idle 待机 6 帧 strip，参考右走外观，轻风吹动
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/sprite_lengguyun_walk_right_8f_v3.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图是刚生成的右走 8 帧，作为角色外观、身高比例、衣袍颜色、脸型、剑和酒葫芦的**唯一权威参考**。
  - 本次做 idle 待机：角色静止站立，只有轻风吹动衣发。
  - 角色外观必须与参考图完全一致。

  【输出目标】
  - 一张 **单行 6 格** 待机 idle sprite strip，画布 **1536×1024**。
  - 隐形网格：6 列 × 1 行；每格约 256×1024。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、标题、色板、网格线、UI、水印。
  - 每个小人高度与参考图完全一致（约 72～96 px）。

  【视角】
  {{facing_desc}}

  【静止站立 · 脚不动】
  - 角色静止站立，双脚稳稳站在地上，6 帧中脚位完全固定。
  - 身体躯干、头、腰带保持绝对稳定，不左右摇不上下跳。
  - 手臂自然垂于身侧或轻扶剑柄。

  【风吹微动 · 可见但自然】
  - 山间持续轻风吹过。
  - 以下元素每帧有微小但可见的位移：
    - 脑后发带尾端左右摆动 5～10 px
    - 几缕散发拂动 3～6 px
    - 袍摆下缘随风轻扬 4～8 px
    - 袖口边缘轻拂 3～6 px
    - 腰带末端微晃 2～4 px

  【6 帧相位】
  第 1 格：风初起，发带微扬
  第 2 格：风稍强，发带半高，袍摆轻抬
  第 3 格：风最强，发带最高，袍摆最开
  第 4 格：风渐弱，发带回落
  第 5 格：风更弱，近静
  第 6 格：风最弱，与第 1 格衔接

  【角色外观硬锁】
  {identity_anchor}
  - 全部 6 格同一人，外观与参考图完全一致。
  - 外衣中偏深冷灰粗布长袍；内衬白色；腰带近黑褐；酒葫芦青瓷灰绿；鞋深色短靴。
  - **禁止头巾、额带、红发带、头顶绑布。**
  - **禁止衣服颜色变化。**

  【风格】港漫厚涂 2.5D 简化 sprite，轮廓线清楚。非战斗姿态。

  【禁忌】
  - 禁止蜘蛛蛛网、文字繁体字水印。
  - 禁止头巾额带红发带；禁止蓝衣红衣。
  - 禁止双脚移动迈步。
  - 禁止身体左右摇晃。
  - 禁止完全静止无任何动态。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
