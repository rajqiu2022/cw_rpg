# 主角 Field 行走四向 sprite sheet
# 目标：先得到真正可切帧的小人行走表，而不是单张立绘式大图。
# 参考图只用于动作节奏、格子排布与小人比例；角色身份以 character_anchors.lengguyun 为准。

id: sprite_protagonist_walk_4dir_sheet
description: Field 用四方向行走 sprite sheet（4方向×4帧，小人比例）
quality: medium
size: "1024x1024"

reference_images:
  - "C:/Users/rajqiu/.cursor/projects/f-Code-RPG-GAME/assets/c__Users_rajqiu_AppData_Roaming_Cursor_User_workspaceStorage_d8451740145b37dfe4633684e350af4b_images_image-de2e0dd6-c5f2-458b-a9f8-bc6409c5ad15.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  唯一权威角色设定：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图只用于理解：老式武侠 RPG 的 **小尺寸 sprite sheet**、行走帧节奏、四向排布、角色在格子中的比例。
  - 不要照抄参考图人物、蓝衣、文字标签、深色背景、落款、色板、边框或 UI；请生成本项目角色 **冷孤云** 的干净素材表。

  【输出目标】
  - 一张 **4 方向 × 4 帧** 行走 sprite sheet，共 16 个小人。
  - 画布 1024×1024，纯白背景 #FFFFFF；无文字、无标题、无色板、无格线、无 UI、无水印。
  - 按清晰隐形网格排布：4 行 × 4 列，行距列距均匀，每个小人居中在自己的格子内，方便后期裁切。
  - 每个小人高度约 **96～128 px**（不是大立绘，不要占满画布），头身比统一，线条清楚，适合游戏内缩放到 64～96 px 高。

  【四行方向】
  - 第 1 行：向下 / 面向镜头的正面行走，4 帧。
  - 第 2 行：向左的侧向行走，4 帧。
  - 第 3 行：向右的侧向行走，4 帧（与向左镜像一致，不要换装）。
  - 第 4 行：向上 / 背向镜头的背面行走，4 帧。

  【每行 4 帧行走节奏】
  - 第 1 帧：左脚向前踏地、右脚在后脚尖点地，手臂反向摆动。
  - 第 2 帧：双脚交叉过渡，一脚抬起经过身体下方，重心略升。
  - 第 3 帧：右脚向前踏地、左脚在后抬起或脚尖点地，必须与第 1 帧前后脚对调。
  - 第 4 帧：过渡回环，准备接回第 1 帧。
  - 重点：脚底位置必须明显变化；禁止四帧像待机站桩，禁止只晃上身不换脚。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 16 帧必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深的冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 头发：黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清晰，动作读得清楚。
  - 不要大立绘、不要半身肖像、不要电影海报感；这是游戏可切帧的小 sprite sheet。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止每格重画成不同角色。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
