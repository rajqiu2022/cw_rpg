id: sprite_protagonist_walk_right_alapi_safe_v1
description: ALAPI 兼容的主角右向四帧 field 行走条
quality: medium
size: "1024x1024"

prompt_template: |
  90年代港式武侠漫画风格，厚涂上色，清晰墨线，色彩明亮但以冷灰、白、深灰为主。

  一张游戏用横向四帧行走精灵条：同一个二十岁中国青年剑客冷孤云，完整全身，向画面右方正交侧向行走。黑色长发束在脑后，灰白交领旧布袍，白色内衬，深灰长裤和短靴，深色腰带，右腰长剑，左腰青灰酒葫芦。绝不戴头巾、额带或红色发带。

  画面是1024x1024纯白背景，无地面、无阴影、无文字、无水印、无格线。仅有一行四个等距小人，每个约180像素高，脚底严格位于同一水平线。动作依次为：左脚前踏、双脚交错、右脚前踏、回环过渡；头部、上身、腰剑和酒葫芦位置稳定，只让腿、手臂和衣摆有小幅可读的行走变化。四帧必须是同一个人、同一套服装和同一比例。

  禁止大立绘、半身像、电影构图、45度等距透视、蓝色侠客服、额外人物、蜘蛛、蛛网、文字、签名、水印。

  反向：{negative}

