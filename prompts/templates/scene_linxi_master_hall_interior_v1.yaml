id: scene_linxi_master_hall_interior_v1
description: Spacious interior for the Linxi village master house.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior background, viewed from a high three-quarter angle. This is the large timber hall of a retired martial arts master in a bamboo village: wide open wooden floor, practice weapon rack along one wall, low tea table, paper screens, a calligraphy desk, warm window light, and a clearly visible open doorway at the lower center leading outside.

  Style: warm hand-painted Hong Kong wuxia comic game art, crisp ink contours, believable floor perspective, readable empty walkable floor, no people, no animals, no text, no UI, no watermark.

  Keep the central floor and lower-center doorway uncluttered. Do not draw treasure chests, gates, foreground frames, or objects that block the doorway.
