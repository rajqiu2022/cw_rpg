id: ui_quest_panel_new_bg
resolution: "1k"
size: "1536x1024"
reference_images:
  - "game/art/ui/inventory/panel_bg.png"
  - "assets/raw/ui_dialog/ui_cold_wuxia_quest_screen_gpt_v1.png"

prompt_template: |
  参考两张图的风格——第一张是背包面板底框样式(有边框角花)，第二张是任务界面布局参考。
  纯白背景。生成一个游戏任务面板底框：
  - 深墨蓝玄铁底，冷钢蓝粗边框(4-6px)，四角有云纹角花装饰
  - 内部有竹影暗纹，微微可见
  - 整体尺寸约 1280×700，居中放置
  - 面板完整无裂痕，四边对称清晰
  - 边框有金属质感，角花精致但不喧宾夺主
  - 内部大面积留白（文字运行时叠加）
  - 港漫厚涂冷色暗调
  禁止文字数字水印签名。

variables: {}
