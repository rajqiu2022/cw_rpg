id: ui_main_menu_bright_green_blue_v1
description: |
  主菜单界面 — 明亮绿蓝色系武侠风格。
  基于 v5 构图但色调从深墨蓝改为明亮翠绿+天蓝。
size: "1536x1024"
quality: high
background: opaque

prompt: |
  《云影侠传》正式主菜单界面，美术风格参考武侠水墨国风 UI，
  主色为明亮翠绿、青碧、天蓝、湖蓝，
  辅以玉白、淡金、浅墨灰作点缀，
  港漫厚涂质感，墨线清晰，云纹暗刻、翠竹、青山晨雾。

  生成一张完整的 RPG 游戏主菜单界面，不是 UI 组件拆分图，也不是临时排版图。
  画面必须是原创设计，参考翠绿色玉石边框、青铜面板材质、云纹暗刻、翡翠装饰和整体武侠 UI 质感。

  必须出现的文字：
  - 顶部主标题：云影侠传
  - 三个主菜单按钮：新游戏、读取存档、离开

  色彩要求：
  - 主色为明亮绿蓝系：翠绿、碧绿、翡翠绿、天蓝、湖蓝、青碧色。
  - 整体画面明亮通透，不要暗沉压抑。
  - 背景绿意盎然，竹林苍翠，晨雾清新，远山如黛。
  - 按钮边框用翡翠绿+青铜色，内底用深碧绿或深湖蓝。
  - 标题牌匾用青玉/翡翠材质，带金色边线点缀。
  - 辅助色用淡金、玉白作高光和装饰。
  - 不要暗黑、不要全黑背景、不要深墨蓝主色。

  构图要求：
  - 1536×1024 横版完整主界面。
  - 顶部中央是庄重的翡翠牌匾，显示"云影侠传"。
  - 画面中央为三个竖向排列的大按钮，按钮文字依次为：新游戏、读取存档、离开。
  - 按钮采用翡翠玉石边框风格：青绿色边、深碧绿内底、翡翠扣、竹纹角花。
  - 背景是明亮武侠江湖：晨曦翠竹林、青山、清溪、薄雾朝露、阳光穿透竹叶。
  - 画面两侧可出现 2 名武侠角色作为氛围：主角冷峻不羁（左侧），侠女清冷坚毅（右侧）；角色不要挡住按钮文字。
  - 整体要像可发布游戏主界面，清新、雅致、有武侠江湖感。

  严格限制：
  - 除"云影侠传""新游戏""读取存档""离开"外，不要出现其他文字。
  - 中文必须是简体中文，文字清晰可读，不要繁体、乱码、错字。
  - 不要现代网页 UI，不要科幻霓虹，不要西幻魔法阵，不要暖金主色，不要喜庆大红。
  - 不要白底组件 atlas，不要把多个控件散放在白色背景上。
  - 不要暗黑风格，不要全黑背景。

  反向：英文文字，Latin letters，繁体字，乱码，错字，水印，签名，现代网页，扁平化商务 UI，赛博霓虹，西幻，魔法阵，白底组件图，临时 wireframe，低保真 mockup，橙黄色主色，喜庆红色，鲜艳大红，全黑背景，暗黑风格，深墨蓝主色。
