prompt_template: |
  Create a production-ready full-frame 2.5D Chinese wuxia RPG bedroom background, high three-quarter view, filling every pixel of a 1536x1024 canvas with no black border or empty exterior margin.

  This is a tiny one-person village bedroom. Lock the furniture scale: the single bed must occupy no more than one eighth of the image width, about 180 pixels wide, and must look only slightly wider than a standing adult character is tall. The bed is a small narrow cot, not a large double bed and not a platform bed. All other furniture must follow the same small human scale. Do not enlarge the room to make the furniture look grand.

  Show the small cot against the upper-left wall, a folded blue-grey robe, a tiny writing desk, a narrow weapon stand, a bamboo window, a woven mat, and a travel pack. Leave most of the center and right side as clear walking floor. Put a clear open doorway at the lower center. Leave the right-middle floor empty for a separate small supply chest.

  Style: warm hand-painted Hong Kong wuxia comic game art, crisp ink contours, compact humble cottage, consistent furniture scale, no people, no animals, no text, no UI, no watermark, no treasure chest, no oversized bed, no mansion, no gate, no foreground frame.
