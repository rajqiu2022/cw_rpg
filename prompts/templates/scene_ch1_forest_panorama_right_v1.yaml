id: scene_ch1_forest_panorama_right_v1
description: Right panel continuation of the first chapter bamboo forest map.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 right-hand continuation panel for a scrollable Chinese wuxia RPG bamboo forest map. Use a hand-painted comic 2.5D environment, crisp ink contours, the same cool overcast afternoon, deep bamboo greens, mossy gray stone, damp pale dirt and a high three-quarter camera. The panel must be coherent gameplay scenery rather than a splash illustration.

  At the far left edge, continue a shaded bamboo-and-rock transition with a broad dirt trail. The trail remains a clear 210-pixel-wide walkable route through the center, opens into a larger uneven battle clearing in the middle-right, then bends toward a secluded stone terrace and a broken courtyard gate at the far-right edge. Use bamboo walls, mossy low stonework and fallen timber to frame the route, but keep all obstruction at the path edges. Leave an empty shoulder near the stone terrace for separately placed altar and enemy interaction props.

  Base layer only: no people, NPCs, enemies, animals, corpses, chests, tablets, altars, torches, signs, writing, readable text, UI, arrows, watermark, loose props, or roof covering the route. No excessive fog, no black voids, no tile grid, no collage.
