id: ui_field_hud_scene_name_panel
description: 场景名牌面板（右上角），显示当前场景+章节信息
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  生成一个中国武侠RPG游戏右上角的场景信息名牌。

  布局（横向长方形）：
  - 左侧一个菱形或六角形暗纹徽标
  - 中部横向凹槽铭牌，可容纳6-8个字（空白不写字）
  - 右侧小标签可容纳章节信息（空白不写字）
  - 深墨蓝玄铁底色，冷钢蓝边框，寒玉青高光线
  - 港漫厚涂金属质感，墨线分明

  要求：
  - 纯白背景 #FFFFFF
  - 整体比例约 8:1 横向长条
  - 不写任何文字内容，只保留空白铭牌凹槽
  - 不画英文繁体水印签名

  反向：{negative}

variables: {}
