prompt_template: |
  Create ONE native 1536x1024 Chinese wuxia RPG exploration background for Chapter 2: a secluded bamboo forest ambush clearing. High three-quarter 2.5D camera, hand-painted Hong Kong comic ink outlines, cold blue-green dusk, rain-dark stone, wet leaf litter, dense bamboo and a tense readable atmosphere.

  A 220-pixel-wide mountain path enters from the lower-left, opens into a large central combat clearing, then exits through a narrow but fully visible stone pass at the upper-right. Use mossy ruined walls and bamboo around the edges only. Leave the center clean for a later enemy party and leave a clear side shoulder for a separate evidence/chest overlay. The pathway must remain fully navigable and bright enough to read.

  Base scenery only: no people, NPCs, enemies, animals, corpses, chests, tablets, blood, readable text, signs, UI, arrows, watermark, or loose interactive props.
