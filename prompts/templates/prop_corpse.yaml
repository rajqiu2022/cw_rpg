id: prop_corpse
description: 尸体道具，剧情任务用，倒在地上
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  游戏场景道具：一具倒卧在地上的尸体。

  要求：
  - 中国武侠风格，身着粗布衣物
  - 侧卧或仰卧姿势，自然倒地姿态
  - 衣物有破损和少量暗红血迹
  - 身旁地上散落少量物品（碎银/布片）
  - 1024×1024，纯白背景 #FFFFFF
  - 尸体居中，水平方向占画布 60%~70%

  反向：{negative}
  - 禁止站立姿势
  - 禁止僵尸/恐怖造型
  - 禁止大量血迹和断肢
  - 禁止繁体中文/水印

variables: {}
