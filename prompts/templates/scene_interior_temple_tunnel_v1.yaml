id: scene_interior_temple_tunnel_v1
description: Reusable ancient temple underground passage stage.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG exploration interior: an ancient temple underground passage as a cutaway chamber centered on a pure black 1536x1024 canvas. The stone chamber takes about 70 percent of the canvas; everything outside is solid pure black. Hand-painted Hong Kong wuxia comic game art, crisp dark ink, muted blue-grey stone and a few warm oil lamps. Include cracked flagstone floor, weathered stone pillars, a half-broken stone relief without readable writing, a dry side channel, loose rubble and a sealed side alcove for future puzzle props. Leave a broad central route for a 90-pixel-tall player and runtime enemies. At lower center leave a single plain black tunnel opening without any doorframe, gate, posts, exterior scenery, people, animals, baked chest, UI, readable text or watermark.
