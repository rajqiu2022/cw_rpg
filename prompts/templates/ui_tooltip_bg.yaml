id: ui_tooltip_bg
description: 装备槽位 hover tips 半透明底框（冷色武侠风）
size: "1024x1024"
resolution: "1k"
reference_images:
  - "game/art/ui/cold_wuxia/v2/ui_display_quest_bright.png"

prompt_template: |
  生成一个半透明的小型提示框底图，用于游戏装备界面鼠标悬停显示属性。
  
  要求：
  - 暗色半透明底（深墨蓝，透明度约 70%），让背景能透过来
  - 冷钢蓝细边框，四角有微小的云纹角花
  - 内部大面积留白（文字由游戏运行时叠加）
  - 尺寸适合显示 8 行文字（名称 + 7 项属性）
  - 港漫厚涂冷色暗调，玄铁/霜蓝风格
  - 纯白或纯黑背景（后期抠除）
  - 无任何文字、数字、水印

variables: {}
