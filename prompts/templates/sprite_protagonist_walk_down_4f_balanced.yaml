# 主角 Field 向下（正面朝镜头）行走 4 帧平衡版 strip
# 目标：吸收左右成功经验，在“锁中轴”和“步幅可读”之间取平衡；禁止左右摇，也禁止站桩。

id: sprite_protagonist_walk_down_4f_balanced
description: Field 用向下行走 4 帧平衡版 strip（正面，锁中轴 + 中等步幅 + 慢速审片）
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_right_8f_stable_from_4f.png"
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_down_8f_play.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图 1 是已通过目视验收的右走 8 帧：学习它的稳定头部 / 腰线 / 上半身，以及 contact 与 passing 的节奏差。
  - 参考图 2 只用于正面朝镜头的方向感；不要复制旧图的脚下阴影、比例偏大或站桩问题。
  - 不要参考失败版：不要大袍摆左右摇，也不要四帧几乎同宽。

  【输出目标】
  - 一张 **单行 4 格** 向下（角色正面朝向镜头、相对玩家向下走）sprite strip，画布 **1024×1024**。
  - 隐形网格：4 列 × 1 行；每格约 256×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：平衡，不要走向两个失败极端】
  - 不要像 `strong_keypose` 那样用身体和大袍摆左右摇制造动作。
  - 不要像 `locked_axis` 那样四帧腿部和轮廓几乎一样。
  - 正确做法：头、胸、腰带中心稳定；腿、鞋尖、膝盖、袖口和袍子下缘有中等变化。
  - contact 帧比 passing 帧下半身轮廓宽 **约 10～18 px**；不是 0～4 px，也不是 40+ px。

  【中轴与基线硬要求】
  - 头顶高度、眼睛高度、胸口白衣中心、腰带扣中心必须稳定；水平漂移不超过 2 px。
  - 左右肩不要摇摆，肩线只能有极小上下呼吸感；不要身体左右倾斜。
  - 四帧脚底最低点必须压在同一条不可见水平线；禁止一帧明显变高或变矮。
  - 鞋底可以前后错位和部分遮挡，但最低点不要上下跳。
  - 袍摆只允许小幅开合，不允许像披风一样向一侧大甩。

  【向下 4 帧循环】
  - 角色视角：正面朝向镜头。能看到脸、胸口、白色中衣、腰带、剑柄和青瓷酒葫芦。
  - 第 1 格 / contact A：左脚向画面下方/前方踏出，鞋尖更清楚，右脚在身后略被袍摆遮住；上半身保持正中。
  - 第 2 格 / passing A：双脚接近身体正下方，右脚经过中线，膝盖微弯；下半身轮廓收窄，上半身仍正中。
  - 第 3 格 / contact B：右脚向画面下方/前方踏出，左脚在身后；与第 1 格左右腿对调，上半身仍正中。
  - 第 4 格 / passing B：双脚接近身体正下方，左脚经过中线，膝盖微弯；下半身轮廓收窄，与第 2 格相似但腿脚反向。
  - 播放顺序为 1 → 2 → 3 → 4 → 1。按 160-180ms/帧播放应自然。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 4 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止左右摇摆；禁止大袍摆甩动；禁止脚底上下跳。
  - 禁止变成侧向或背向；本图必须是正面朝镜头。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
