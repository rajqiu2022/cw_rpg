prompt_template: |
  Create a production-ready, directly playable 2.5D Chinese wuxia RPG interior map, not a concept-art illustration and not a loading screen.
  Use the reference only to retain the centered room-stage silhouette, the black outer canvas, and the small lower-center exit. Rebuild the actual room with much stronger gameplay depth.

  Camera and geometry: classic 1990s pre-rendered RPG camera, high three-quarter view looking into a real room. Every wall must have visible thickness, recessed window frames, deep eaves, side faces and cast shadows. The timber floor must have receding plank perspective, height transitions and clear contact shadows under every table leg, rack and forge. Show a credible walkable navigation plane, not a flat painting.
  Composition: 1536x1024. A compact master blacksmith's training hall occupies the centered middle 68 percent of the canvas; every outside pixel is perfectly solid black. The playable floor is open in the middle and visually distinct from furniture footprints. Put a low weapon rack along the left wall, a compact forge workbench at the rear-left, a desk at the rear-right, and a tea table with two stools at the lower-right. Furniture must be small relative to a runtime 90-pixel adult sprite.
  Runtime layering: arrange the front edge and tall side objects so a separately rendered character can pass in front of or behind them. Keep all furniture off the middle route. At lower center create only a small unframed black doorway gap in the floor edge; no gate, posts, lintel, exterior landscape, grass, courtyard or steps.
  Materials: restrained hand-painted Hong Kong wuxia comic textures over pre-rendered 3D volume, cold grey plaster, dark wood and controlled warm lamplight. Include clear ambient occlusion and directional shadows without making the room dark. No people, animals, chest, UI, text, signage, watermark, icon, flat orthographic concept sheet, matte-painting look or loading-screen composition.
