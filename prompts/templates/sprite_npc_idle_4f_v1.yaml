id: sprite_npc_idle_4f_v1
description: NPC 4帧站立idle精灵图，单方向，4帧连贯微动
quality: high
size: "1024x256"

identity_anchor: |
  {{character_name}}，金庸武侠风格。{{character_appearance}}。

prompt_template: |
  {style_anchor}

  生成一个游戏NPC的4帧站立idle精灵图。严格按照以下要求：

  【角色】{identity_anchor}
  该角色朝向画幅{{direction_label}}。4帧中角色的长相、发型、服装完全一致。

  【动作】
  4帧为一个站立idle循环。双脚始终站立不动。
  仅衣服下摆和头发有轻微飘动（幅度极小，自然微风感）。
  上半身和头部完全稳定，不晃动。
  第4帧结束后可无缝回到第1帧。

  【布局】
  画布横向宽幅，4个等宽竖条从左到右水平排列。
  每个竖条宽度固定为256px，总画布宽度1024px，高度256px。
  从左到右依次为第1至第4帧。
  竖条之间无分隔线。

  【每帧内角色】
  角色头顶到脚底的高度占画布高度的60%（约154px）。
  角色宽度约50-55px，人体宽高比约1:3。
  角色水平居中于本竖条内，即角色中心x坐标 = 竖条中心x坐标。
  4帧角色脚底严格落在相同的y坐标上（画布底部上移20px处）。

  【背景颜色】
  整个画布底色为纯品红色（#FF00FF），平整单一颜色，无渐变。
  每帧严格限制在各自的256px竖条内，不跨越边界。

  【禁止】
  角色变形、位置偏移、脚底不齐。
  残影、白色像素、水印、编号、文字标记。
  不同帧之间角色外观不一致。
  行走动作、大幅度移动。
  角色颜色与背景品红色（#FF00FF）混淆。

variables:
  character_name: "必填"
  character_appearance: "必填"
  direction_label: "右/左/下/上"
