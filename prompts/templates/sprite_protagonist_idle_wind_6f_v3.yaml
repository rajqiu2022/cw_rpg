# 主角 idle 待机 6 帧 strip（v3 强风动版）
# 双脚不动，但发带、袍摆、袖口、散发必须有大幅度肉眼可见的飘动。
# 角色外观必须与参考图（右走 v2）完全一致。

id: sprite_protagonist_idle_wind_6f_v3
description: Field 用 idle 待机 6 帧 strip，双脚不动，大幅风动，外观严格匹配参考图
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/sprite_lengguyun_walk_right_8f_v2.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途 · 最高优先级】
  - 参考图是已通过的 **右走 8 帧 v2**，是角色外观的**唯一绝对权威**。
  - **本次只改变姿势（从行走到站立），角色的所有外观元素必须与参考图 100% 一致：**
    - 脸型、五官、肤色必须完全相同
    - 发型、发带颜色和系法、刘海位置和形状必须完全相同
    - 冷灰布袍的颜色（同一灰度、同一冷色调）、褶皱风格必须完全相同
    - 白色中衣的领口形状和露出面积必须相同
    - 青瓷酒葫芦的大小、形状、颜色、腰带悬挂位置必须完全相同
    - 长剑的剑柄形状、剑鞘颜色、悬挂角度必须完全相同
    - 深色短靴的靴型靴色必须完全相同
    - 角色的身高、头身比、胖瘦体格必须完全相同
  - **把参考图中的角色直接"复制粘贴"成站立姿势，不要重新设计或改变任何外观细节。**
  - 角色在画布上的总体高度（脚到头顶的像素数）必须与参考图一至。

  【输出目标】
  - 一张 **单行 6 格** 待机 idle sprite strip，画布 **1024×1024**。
  - 隐形网格：6 列 × 1 行；每格约 170×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、标题、色板、网格线、UI、水印。
  - 每个小人高度与参考图完全一致（约 72～96 px）。

  【视角】
  {{facing_desc}}

  【核心 1：双脚完全不动】
  - 双脚死死钉在地上，6 帧中脚位、鞋尖朝向、鞋底位置**完全固定，一个像素都不动**。
  - 双腿直立，膝盖不弯，不迈步不换脚不移重心。
  - 身体躯干、头、腰带保持绝对稳定：水平漂移 ≤ 1 px，垂直漂移 ≤ 1 px。

  【核心 2：风动必须大幅明显，不能微弱】
  - 风吹的方向是从画面左侧持续吹向右侧的**劲风**（侧向时）/ 从远处向镜头方向吹（正面时）。
  - 以下元素必须在 6 帧中有**大幅位移**，肉眼一眼可见：
    - **脑后发带**：尾端左右飘摆 **15～30 px**，是画面中最显眼的动态元素。发带要飘起来，不能只是微颤。
    - **几缕散发**：在脸颊或颈侧来回拂动，位移 **8～15 px**。
    - **袍摆下缘**：前摆和后摆交替被风掀起，衣角上扬幅度 **10～20 px**，要能看到袍子下摆明显改变形状。
    - **袖口**：宽大的袍袖边缘飘拂，位移 **8～15 px**。
    - **腰带末端**：左右晃动摇摆，位移 **5～10 px**。
    - **衣袍褶纹**：袍子上的衣褶随风位移 **3～6 px**，不是静止的。
  - 风动要像"山间劲风吹过侠客站立处"，不是"室内微风"。

  【待机 6 帧风动相位】
  - 第 1 格：风初起，发带开始向右上方扬起，袍摆开始轻抬。
  - 第 2 格：风增强，发带扬到半高，袍摆明显上翻，散发飘开。
  - 第 3 格：风最强，发带扬至最高点（最大位移），袍摆抬至最高，袖口完全张开，散发飘开最远。
  - 第 4 格：风开始减弱，发带从最高点回落，袍摆开始下沉。
  - 第 5 格：风继续减弱，发带回落到半低，袍摆接近原位但仍有小幅上扬。
  - 第 6 格：风最弱，发带近垂近静，袍摆近原位，散发回收。与第 1 格衔接自然。
  - 播放 1→2→3→4→5→6→1 形成连续劲风循环。

  【对齐硬要求】
  - 6 格脚底位置完全一致，身体中轴位置完全一致。
  - 头顶高度变化不超过 2 px；腰带高度变化不超过 1 px。
  - 每格都能单独裁切。

  【角色一致性硬锁 · 逐项对照参考图】
  {identity_anchor}
  - 脸型、五官、肤色 → **与参考图完全相同**
  - 发型、发带、刘海 → **与参考图完全相同**
  - 冷灰布袍颜色灰度色调 → **与参考图完全相同**，禁止偏蓝偏紫偏棕偏浅
  - 白色中衣 → **与参考图完全相同**
  - 青瓷酒葫芦大小形状颜色位置 → **与参考图完全相同**
  - 长剑形状悬挂 → **与参考图完全相同**
  - 深色短靴 → **与参考图完全相同**
  - 身高头身比体格 → **与参考图完全相同**
  - 黑发束脑后，简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 简化到小人 sprite，轮廓线清楚。
  - 整体气质沉静从容但风中屹立，不是战斗姿态。
  - 与参考图完全一致的风格、笔触、上色方式、墨线粗细。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止红色侠客服。
  - **禁止双脚移动、迈步、换脚、滑步、任何腿部位置变化。**
  - **禁止身体左右摇晃、上下跳动、躯干倾斜。**
  - **禁止风动太弱、发带静止、袍摆不动——必须大幅可见。**

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
