# 主角 Field 向上（背面朝镜头）行走 4 帧锁中轴 strip
# 目标：参考左右成功经验，稳定后脑/背脊/腰带中轴，用脚步深度而不是左右摇摆读出走路。

id: sprite_protagonist_walk_up_4f_locked_axis
description: Field 用向上行走 4 帧锁中轴 strip（背面，少左右晃，慢速审片）
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_right_8f_stable_from_4f.png"
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_up_8f_play.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图 1 是已通过目视验收的右走 8 帧，用于学习：头、躯干、腰带稳定，只让腿部和少量手臂读出步态。
  - 参考图 2 只用于学习背面朝镜头的方向感；不要复制旧图的比例偏差或弱步幅。
  - 不要参考失败版的大袍摆左右摇。本次目标是 **锁住背部中轴**，让脚步深度读出走路。

  【输出目标】
  - 一张 **单行 4 格** 向上（角色背面朝向镜头、相对玩家向上走）sprite strip，画布 **1024×1024**。
  - 隐形网格：4 列 × 1 行；每格约 256×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，四格保持同一脚底基线；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：像左右成功版一样稳定中轴】
  - 后脑中心、束发根部、背脊中心、腰带后侧中心必须在 4 格同一条垂直中线上。
  - 腰带中心水平漂移不超过 2 px；肩线左右摆动不超过 2 px；头发主体不左右甩。
  - 酒葫芦挂点、剑柄根部位置稳定，只允许极小随步伐摆动。
  - 袍摆只能小幅开合，不要大面积向左/右甩成披风；禁止靠袍摆左右摆制造步幅。
  - contact / passing 的差异主要来自脚掌前后深度、膝盖弯曲、脚尖露出和小幅手臂摆动。

  【对齐硬要求】
  - 4 格脚底基线一致：支撑脚鞋底压在同一条不可见水平线。
  - 4 格角色身体中心在各自格子的水平中心；头顶高度变化不超过 4 px。
  - 每格都能单独裁切；剑、衣摆、头发不要跨进相邻格。

  【向上 4 帧循环，相位清楚但不左右摇】
  - 角色视角：背面朝向镜头。只能看到后脑、束发、背部、腰带后侧、剑和青瓷酒葫芦；不要画正脸、侧脸或胸口。
  - 第 1 格 / contact A：左脚向画面上方/远处踏出，右脚留在画面下方/近处。背脊保持正中，袍摆只小幅打开。
  - 第 2 格 / passing A：双脚接近身体正下方，一只脚抬起经过中线；轮廓稍窄，但后脑、背脊、腰带中心完全不动。
  - 第 3 格 / contact B：右脚向画面上方/远处踏出，左脚留在画面下方/近处。与第 1 格左右腿对调。背部仍保持正中，不要把上身摆向另一侧。
  - 第 4 格 / passing B：双脚接近身体正下方，另一只脚抬起经过中线；可有反向脚部细节，但不要变成左右晃动。
  - 播放顺序为 1 → 2 → 3 → 4 → 1。按 160-180ms/帧播放应自然。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 4 格必须是同一人：同一背影、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止左右摇摆；禁止大袍摆甩动。
  - 禁止画出正脸、五官或胸口；本图必须是背面朝镜头。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
