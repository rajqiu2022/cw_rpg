id: scene_zhuwei_west_terrain_v1
description: West terrain base for Zhuwei Village expandable map.
quality: high
size: "1536x1024"
prompt_template: |
  Create ONE native 1536x1024 terrain-only western panel for a playable Chinese wuxia RPG village, with the same elevated three-quarter 2.5D camera, warm late-morning light, pale irregular stone paving and earthy grass detail as a matching terrain connector panel.

  A broad pale stone road begins at the lower-left and reaches the full right edge through the middle, 420 to 520 pixels wide at the right edge. The full rightmost 300 pixels are only continuous road, compacted dirt, low grass and soft bamboo-leaf shadow: no buildings, stairs, trees, fences, posts, water, gates, doors, props or landmarks. The central route remains clear. Around the top and left edges use only low terrain details, shallow weed clusters and small rocks. No people, NPCs, animals, chests, text, UI, arrows, logo or watermark.

  This is a terrain base for later separate building and foreground props, never a poster or tilemap. Ground must have premium pre-rendered 2.5D volume, readable material, gentle contact shading and no large empty paper-like plaza.
variables: {}
