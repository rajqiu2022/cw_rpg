id: ui_field_hud_quest_panel
description: 任务追踪面板（右下角），显示当前任务列表
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  生成一个中国武侠RPG游戏右下角的任务追踪面板。

  布局（纵向长方形）：
  - 顶部小标题区：左侧菱形徽标+"任务"二字（港漫手写体，冷钢蓝墨色）
  - 中部大面积空白列表区：3-4行横向浅凹槽，每行可容纳一段任务文字（空白不写字）
  - 底部细线分隔
  - 深墨蓝玄铁底色，冷钢蓝边框，四角云纹角花
  - 港漫厚涂金属质感，墨线分明

  要求：
  - 纯白背景 #FFFFFF
  - 整体比例约 2:1 纵向
  - 除了小标题"任务"二字，其他区域不写文字
  - 不画英文繁体水印签名

  反向：{negative}

variables: {}
