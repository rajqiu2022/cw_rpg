prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior background, viewed from a high three-quarter angle. This is a compact young martial artist's bedroom in a bamboo village: simple wooden bed at upper left, folded blue-grey robe, small writing desk, travel pack, bamboo window, weapon stand, woven rug, and a clearly visible open doorway at the lower center leading outside.

  Style: warm hand-painted Hong Kong wuxia comic game art, crisp ink contours, believable floor perspective, readable empty walkable floor, no people, no animals, no text, no UI, no watermark.

  Leave clear floor space at the right side for a separate interactive treasure chest prop. Do not draw any chest, gate, foreground frame, or object that blocks the lower-center doorway.
