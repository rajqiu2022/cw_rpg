id: scene_zhuwei_mainstreet_east_panel_v1
description: Native right-hand continuation panel for Zhuwei Village's scrollable main street.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 right-hand continuation panel for a playable Chinese wuxia RPG village. This is a pre-rendered 2.5D game level, never concept art or a loading illustration.

  Camera and seam contract: fixed elevated three-quarter isometric camera, clear warm late-morning sunlight, natural hand-painted 3D volume. The entire leftmost 26 percent must be a continuous pale stone-paved street, with the same height, light direction, paving scale and road width as an adjacent village plaza panel. That road enters from the middle-left, stays open through the middle, and exits at the lower-right. It must not be blocked by a gate, arch, gate posts, fence, hanging banner, wall, building, tree, or market stall.

  Scene content: put a welcoming open-front village inn in the upper-left beyond the road shoulder, with a blank wooden signboard, thick roof tiles, visible timber posts and a clearly readable doorway. Place two modest village cottages on the upper-right and far-right edges, each with a small dark readable doorway, stone steps and courtyard details. A narrow stream and bamboo may frame only the far upper/right edge. Leave several clear side pockets beside the road for independently placed NPCs. No characters, NPCs, animals, chests, text, UI, arrows, labels, watermark, logo or baked interactive objects.

  Material and depth target: solid buildings with vertical wall faces, roof thickness, deep eaves, contact shadows, raised thresholds, weathered stone, dirt between slabs, subtle weeds, pottery and cloth. The ground must be a legible walkable navigation plane. Avoid flat poster composition, overhead tile map, collage, or a wide empty plaza.

variables: {}
