id: ui_common_title_atlas
description: 武侠 RPG 常用界面标题字图集
quality: high
size: "1536x1024"

prompt_template: |
  {style_anchor}

  生成一张正式武侠 RPG 界面标题字图集，不是完整界面，不要按钮，不要底框。
  画布严格分成 2 列 × 3 行的六个等大格子，每格只放一组居中的中文标题字，
  六个格子从左到右、从上到下严格对应：
  第一行：胜利、失败
  第二行：战斗结算、章节完成
  第三行：任务卷宗、武学

  文字要求：
  - 简体中文必须准确，六组文字不能互换、不能缺字、不能出现英文或乱码
  - 古风武侠金属刻字风格，浅冰蓝主字，金色细边和很轻的冷光
  - 每组文字单独成组，四周留足透明/纯深色空白，方便后续切图
  - 六个格子之间用细金线明确分隔，不能让文字跨格
  - 不要人物、不要场景、不要装饰图案、不要 UI 面板、不要水印
  - 背景为完全均匀的纯黑色 #000000，方便切图和抠除

  反向：{negative}
