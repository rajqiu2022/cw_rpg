id: scene_linxi_modular_props_v1
description: Review sheet for the first set of independently placeable Linxi tutorial map props.
quality: high
size: "1536x1024"

prompt_template: |
  Create a 1536x1024 production review sheet containing exactly six separated, full-color 2.5D wuxia RPG environment props for Linxi Village. Use a high three-quarter view matching a hand-painted ink-outline Chinese martial-arts village: gray tile, warm weathered wood, muted green bamboo, cool stone, warm forge ember; crisp comic ink contours; light from upper right and shadows down-left.

  Arrange the six props in a clean 3 by 2 grid with at least 120 pixels of empty space between every silhouette: (1) a small closed wooden treasure chest, (2) the same chest opened and empty, (3) a short blank weathered stone tablet with no carved writing, (4) a dense bamboo and rock foreground cluster to hide a panorama seam, (5) a short low wooden fence segment, and (6) a compact open brazier forge with a soft ember glow. Each prop must be complete, fully visible, isolated, and have its feet/base clearly readable for later collision placement.

  Use a perfectly flat solid #FF00FF chroma-key background only: no floor plane, cast shadow, gradient, vignette, labels, dividers, UI frames, people, animals, words, symbols, readable writing, signs, watermark, or extra objects. This is a source sheet for manual review and later separation, not a final in-game composite.
