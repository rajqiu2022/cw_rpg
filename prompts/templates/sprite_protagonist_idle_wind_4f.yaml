# 主角 idle 待机 4 帧 strip（风吹微动）
# 双脚不动，仅有衣服下摆、发丝、袍袖被风吹动的细微变化。

id: sprite_protagonist_idle_wind_4f
description: Field 用 idle 待机 4 帧 strip，双脚不动，仅风动衣发
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/game/art/characters/lengguyun_walk_right_8f.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图是已通过目视验收的右走 8 帧 polish 版：只学习它的角色外观、衣袍颜色、头身比例、剑和酒葫芦位置。
  - 本次做的是 **idle 待机动作**，与行走完全不同。
  - 不要重新设计角色；不要改变衣服颜色、发型、剑、酒葫芦、脸型或身高比例。

  【输出目标】
  - 一张 **单行 4 格** 待机 idle sprite strip，画布 **1024×1024**。
  - 隐形网格：4 列 × 1 行；每格约 256×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心：idle 待机，风吹微动】
  - 角色朝向：{{facing_desc}}
  - **双脚完全不动**，稳稳站在地上，不要迈步、不要换脚、不要移动脚位。
  - 身体躯干、头、腰带保持高度稳定，水平漂移不超过 2 px。
  - 唯一的变化来自"微风吹过"的效果：
    - 脑后发带尾端和几缕散发小幅飘动（2～6 px 位移）
    - 袍摆下缘小幅波动，像被轻风吹起再落下
    - 袖口边缘小幅拂动
    - 腰带末端小幅晃动
  - 4 帧变化量必须**小**：不能变成大幅飘动或披风甩动；是微风轻拂感，不是大风。
  - 4 帧播放后要能无缝循环回第 1 帧（风动相位均匀分布）。

  【待机 4 帧风动相位】
  - 第 1 格：微风初起，发带微扬，袍摆开始轻抬。
  - 第 2 格：风稍强，发带扬到最高点，袍摆抬至最高，袖口微张。
  - 第 3 格：风渐弱，发带开始回落，袍摆开始下沉。
  - 第 4 格：风最弱，发带近垂，袍摆近静止，接近第 1 格但方向相反。
  - 播放顺序 1 → 2 → 3 → 4 → 1，形成连续微风循环。

  【对齐硬要求】
  - 4 格脚底位置完全一致：两只脚都在同一水平线，格间完全不动。
  - 4 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 2 px；腰带高度变化不超过 2 px。
  - 每格都能单独裁切，角色不跨格。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 4 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚。
  - 整体气质沉静从容，不是战斗姿态。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止双脚移动、迈步、换脚。
  - 禁止大幅飘动、披风甩动；禁止身体左右摇晃；禁止上下跳动。
  - 禁止变成行走姿势；本图必须是静止站立。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
