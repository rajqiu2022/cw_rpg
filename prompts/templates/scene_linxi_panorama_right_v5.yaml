prompt_template: |
  Use the supplied image as the strict visual and seam-continuity reference only. Create ONE native 1536x1024 RIGHT-HAND continuation panel for the same hand-painted Chinese wuxia 2.5D RPG village, warm late-morning daylight, high three-quarter camera, clean dark ink outlines, gray tile roofs, weathered wood, pale dirt and stone.

  The entire LEFT 28 percent must be a flat, broad, unobstructed continuation of the same pale dirt road at the same mid-to-lower height as the supplied panel's right edge. There must be NO bamboo wall, cliff, roof, fence, building, or large rock at that seam. The clear road must continue smoothly through the center to a small open village gate at the far lower-right edge.

  Put one compact open-front blacksmith workshop only in the UPPER-RIGHT quadrant: gray tile roof, stone footings, visible forge bay with a small orange fire, anvil and tools near the wall. Keep its full front, entrance, and the road in front of it unobstructed. Add only low grass, small rocks and sparse fences along outer edges. Leave a small clear plaza near the smithy for an NPC and a stone tablet.

  This is a base scenery layer for a walkable game map. No people, NPCs, animals, characters, readable writing, signs, UI, portal arrows, watermark, chest, stone tablet, marker, corpse, cart, or large foreground roof. Do not create a collage. Do not crop the path at either horizontal edge.
