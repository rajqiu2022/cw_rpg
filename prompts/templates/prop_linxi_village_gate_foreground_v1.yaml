id: prop_linxi_village_gate_foreground_v1
description: Transparent foreground gate frame for the Linxi tutorial exit.
quality: high
size: "1024x1024"

prompt_template: |
  Create one production-ready standalone foreground prop for a 2.5D Chinese wuxia RPG: an open wooden village gate frame seen in high three-quarter view. It must match a sunlit bamboo village with warm weathered wood, dark gray curved tile roof, hand-painted comic ink outlines, and light from upper right. The structure has two thick timber posts, a shallow dark tiled roof, and both wooden doors fully open toward the viewer, leaving a clean walkable opening in the middle. The full gate, roof, posts, and doors must be visible with generous padding.

  This asset will be rendered in front of the player at a map exit, so use a clear readable silhouette, no people, no animals, no signs, no text, no symbols, no fence segment, no ground plane, no cast shadow, no scenery, no watermark, and no extra props.

  Use a perfectly flat solid #FF00FF chroma-key background only, with no gradient, texture, lighting variation, floor, or reflection. Keep all visible gate pixels separate from the background for clean alpha extraction.
