id: sprite_strip_walk_right_25d
description: 主角右向行走精灵条（2.5D厚涂体积感），8帧横排一图生成
quality: high
size: "1024x1024"

identity_anchor: |
  {{character_name}}，{{character_appearance}}，
  与参考图完全一致的脸型、五官、发型、服装。

reference_images:
  - "assets/_style_bible/00_protagonist_portrait_ref.png"

prompt_template: |
  {style_anchor}

  游戏 2.5D 精灵条（sprite strip），单张图内包含完整的 8 帧右向行走循环。

  角色：{identity_anchor}

  【核心要求 — 2.5D 体积感（最关键）】
  - 这不是平面 2D 动画，必须通过**强烈明暗对比**塑造立体体块感
  - 光源：右上角顶光 + 侧逆光，头肩顶有明显高光 rim light
  - 服装褶皱有**环境光遮蔽（AO）**深度阴影，非简单平涂
  - 披风/腰带/剑鞘有**厚度感**——亮面、暗面、反光三层调子
  - 脸部和手部有立体明暗，非平面填充
  - 整体效果类似**手办/action figure**的立体感，2D 绘制但视觉上是 3D 的

  【精灵条布局】
  - 画布 1024×1024 均分为 4 列 × 2 行 = 8 格
  - 每格 256×512，包含一个行走帧
  - 第 1 行（从左到右）：帧 1、2、3、4
  - 第 2 行（从左到右）：帧 5、6、7、8
  - 各格之间有 2px 灰色分隔线便于后期裁切
  - 格子背景纯白 #FFFFFF

  【角色比例（每格内）】
  - 角色高度约占格子高度的 50%（约 256px），不要占满格子
  - 水平居中，双脚在同一水平线上
  - 所有 8 帧的角色比例、体型、服装细节完全一致

  【行走姿态 — 8 帧循环，面向右侧】
  - 帧 1：左脚抬起迈步，右脚着地，身体微起伏
  - 帧 2：左脚前伸过度，右脚支撑
  - 帧 3：双脚交错过渡，重心居中
  - 帧 4：右脚抬起迈步，左脚着地
  - 帧 5：右脚前伸过度，左脚支撑
  - 帧 6：双脚交错过渡
  - 帧 7：左脚再次抬起，步幅稍大
  - 帧 8：右脚再次落地，回到帧 1 姿态
  - 手臂自然摆动，衣摆和披风随步伐飘动
  - 武侠轻快步伐，非普通走路

  项目禁忌：禁止蜘蛛/蛛丝/蛛网；禁止繁体中文/水印/签名

  反向：{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
