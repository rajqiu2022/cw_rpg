id: scene_interior_bandit_cave_v1
description: Reusable bandit cave hideout stage.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG exploration interior: a natural bandit cave hideout as a cutaway room centered on a pure black 1536x1024 canvas. The cave chamber takes about 70 percent of the canvas; everything outside is solid pure black. Moody but readable hand-painted Hong Kong wuxia comic art, ink contours, cool stone with warm torchlight. Include uneven stone walls, a small fire pit along the back, rough bedrolls at the left edge, stacked wooden crates and a faded banner at the right edge, and a narrow raised ledge. Keep the center floor clear for a 90-pixel-tall player, enemies and independent loot props. At lower center leave an unframed black cave opening as the exit, with no wooden gate, posts, exterior view, people, animals, baked chest, UI, text or watermark.
