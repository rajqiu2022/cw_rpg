id: ui_dialog_frame_v7
description: 对话框外框 v7（底部横向长条），寒山玄铁雾蓝风格，左侧立绘框+右侧文字区域
quality: high
size: "1536x1024"

prompt_template: |
  {style_anchor}

  生成一个中国武侠RPG游戏底部对话框外框。纯白色背景。

  整体风格：寒山玄铁 · 雾蓝侠影 —— 深墨蓝玄铁底色，冷钢蓝双层描边，霜蓝高光，
  港漫厚涂金属质感，墨线分明。

  布局（横向长条，宽高比约 5:1，位于画面下半部分居中）：
  - 左侧方形立绘框区域：深墨蓝玄铁边框，内侧留空黑色（程序放置角色立绘），四角铆钉装饰
  - 右侧大面积文字区域：深墨蓝凹槽底板，可容纳2-3行对话文字（空白不写字，保持纯色暗区）
  - 右上角小标签位置用于显示说话人名字（空白不写字）
  - 底部右侧小三角/箭头继续提示符
  - 四角云纹铆钉金属装饰
  - 边框双层：外层冷钢蓝细线，内层深墨蓝粗线

  画面要求：
  - 纯白背景 #FFFFFF
  - 整体横向，文字区域占大部分（约 75% 宽度）
  - 立绘框区域占约 25% 宽度
  - 不写任何文字、名字、对话内容
  - 不画英文、繁体、水印、签名
  - 对话框外框本身居中靠下

  反向：{negative}

variables: {}
