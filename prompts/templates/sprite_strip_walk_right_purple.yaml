id: sprite_strip_walk_right_purple
description: 右走8帧精灵条，黑色底便于检测
quality: high
size: "1024x1024"

reference_images:
  - "assets/processed/characters/protagonist_portrait_full.png"

prompt_template: |
  {style_anchor}

  画一个武侠 RPG 游戏角色的 8 帧行走动画序列图。角色必须与参考图完全一致。

  8 个独立角色从左到右排成一行，构成连贯的右向行走循环。

  每个角色高度约 300~400 像素，正常人体比例。所有角色脚底在同一水平线上。角色之间有明显的间隔。

  背景必须是纯黑色 #000000。

variables: {}
