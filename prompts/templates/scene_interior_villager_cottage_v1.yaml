id: scene_interior_villager_cottage_v1
description: Compact reusable village cottage room stage.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior: a modest villager cottage as an isometric cutaway room centered on a pure black 1536x1024 canvas. The room occupies about 65 percent of the canvas; everything outside is solid pure black. Warm hand-painted Hong Kong wuxia comic style, crisp dark ink contours, high three-quarter view. Include a small clay stove at back left, a low square dining table with two stools, shelves with bowls, folded blankets, and a compact wall shrine. Leave clear wooden floor in the center and right for a 90-pixel-tall player sprite and independent quest props. At lower center leave one plain unframed black exit gap: no door, posts, lintel, threshold, railing, exterior ground, grass, path, people, animals, chest, UI, text, watermark.
