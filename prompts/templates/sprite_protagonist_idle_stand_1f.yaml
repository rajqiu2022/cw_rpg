# 主角 idle 站立单帧（无风动），只改姿势不改外观。
# 用右走 v2 passing 帧做参考图，唯一任务：把行走改成双脚并拢站立。
# 其他一切与参考图完全相同。

id: sprite_protagonist_idle_stand_1f
description: 用参考图生成站立单帧，只改腿姿，不改外观
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/ref_walk_right_v2_frame2.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。

prompt_template: |
  {style_anchor}

  【参考图 · 绝对权威】
  - 参考图是你需要画的角色的精确外观参考。
  - **你唯一要改的：角色的腿从行走姿势变成静止站立姿势（双脚并拢或微微分开，稳稳站在地上）。**
  - **除此之外，不准改变这个角色的任何东西。**

  【必须与参考图完全相同的项目（逐项检查）】
  - 脸型、五官、肤色、表情 → 与参考图相同
  - 发型、发带颜色和系法、刘海形状 → 与参考图相同
  - 冷灰布袍的准确颜色（同一灰度和冷色调，不偏蓝不偏紫不偏棕不偏浅）→ 与参考图相同
  - 白色中衣的领口形状 → 与参考图相同
  - 青瓷酒葫芦的大小、形状、颜色、位置 → 与参考图相同
  - 长剑的剑柄、剑鞘、悬挂角度 → 与参考图相同
  - 深色短靴 → 与参考图相同
  - 身高体型头身比 → 与参考图相同
  - 画布上脚到头顶的像素高度 → 与参考图相同

  【唯一改动：腿部姿势】
  - 角色从行走改为**静止站立**，双脚并拢或微微分开（间距 2～6 px 即可）。
  - 双腿直立放松，稳稳站在地上。
  - 手臂自然垂于身侧，或一手轻扶剑柄。

  【输出格式】
  - **单张图**，只有一个角色，画布 **1024×1024**。
  - 角色位于画布中下部，背景纯白 #FFFFFF。
  - 无文字、无标题、无网格、无 UI、无水印。

  【视角】
  {{facing_desc}}

  【禁忌】
  - 禁止改变衣服颜色、脸型、发型、酒葫芦、剑。
  - 禁止头巾、额带、红发带、头顶绑布。
  - 禁止蜘蛛蛛网、文字、水印。
  - 禁止行走姿势、禁止迈步。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
