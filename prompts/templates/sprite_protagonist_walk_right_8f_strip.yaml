# 主角 Field 向右行走 8 帧 strip
# 目标：先把单方向走路做顺，再扩展四方向。

id: sprite_protagonist_walk_right_8f_strip
description: Field 用向右行走 8 帧 sprite strip（单行 8 格，小人比例）
quality: medium
size: "1536x512"

reference_images:
  - "C:/Users/rajqiu/.cursor/projects/f-Code-RPG-GAME/assets/c__Users_rajqiu_AppData_Roaming_Cursor_User_workspaceStorage_d8451740145b37dfe4633684e350af4b_images_image-de2e0dd6-c5f2-458b-a9f8-bc6409c5ad15.png"

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图只用于理解传统武侠 RPG sprite 的 **小人比例、行走节奏、帧表排布**。
  - 不要照抄参考图人物、蓝衣、文字标签、深色背景、色板、边框或 UI。

  【输出目标】
  - 一张 **单行 8 帧** 向右行走 sprite strip，画布 **1536×512**。
  - 隐形网格：8 列 × 1 行；每格 192×512；每帧小人居中在自己的格子内。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **110～140 px**，是游戏可用小 sprite，不是大立绘、不是半身肖像。

  【对齐硬要求】
  - 8 帧角色 **脚底基线完全一致**：支撑脚鞋底都压在同一条不可见水平线（约画面下方 75% 高度）。
  - 8 帧角色 **身体中心在各自格子的水平中心**，不要在格内左右乱漂；允许为步态做极小身体起伏，但头顶高度变化不超过 8 px。
  - 裁切后播放时不能跳：人物大小、头部位置、剑和酒葫芦位置关系要稳定。

  【向右 8 帧步态，相位必须平均拆分】
  - 第 1 帧 contact A：左脚在前方（画面右侧）脚跟着地，右脚在后方脚尖点地；双腿最大步幅。
  - 第 2 帧 down A：身体略下沉，左脚全掌承重，右脚后跟抬起准备离地。
  - 第 3 帧 passing A：右脚抬起经过身体正下方，膝盖弯曲；左脚支撑，双脚间距最小。
  - 第 4 帧 up A：右脚向前摆到画面右侧但尚未落地，身体略升；左脚开始蹬地。
  - 第 5 帧 contact B：右脚在前方脚跟着地，左脚在后方脚尖点地；与第 1 帧左右腿对调。
  - 第 6 帧 down B：身体略下沉，右脚全掌承重，左脚后跟抬起准备离地。
  - 第 7 帧 passing B：左脚抬起经过身体正下方，膝盖弯曲；右脚支撑，双脚间距最小。
  - 第 8 帧 up B：左脚向前摆到画面右侧但尚未落地，身体略升；右脚开始蹬地，能自然接回第 1 帧。
  - 重点：8 帧必须出现 **最大步幅 → 下沉 → 经过 → 抬起 → 反向最大步幅 → 下沉 → 经过 → 抬起**，禁止大部分帧都是跨开腿。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 帧必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩行走；禁止 8 帧脚底基线不一致。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
