prompt_template: |
  Use case: stylized-concept
  Asset type: ONE transparent RGBA architectural module atlas for a fixed-camera realistic Chinese wuxia RPG. This is one atlas asset with exactly THREE isolated components, not three alternative images and not an entire courtyard scene.

  Reference roles: Image 1 is the approved wall MATERIAL AND CONSTRUCTION reference. Match its aged charcoal-grey barrel/pan tiles, modest tile-end caps, weathered off-white lime plaster, coursed grey-brick base, surface-detail density and restrained upper-left/front daylight. Its frontal wall silhouette is NOT the direction for the new longitudinal modules. Image 2 is ONLY the camera, gate-relative scale and traditional construction reference; do NOT copy its diagonal baked side walls or generate its wooden gate, roofed gatehouse or doorway. Neither reference is an edit target.

  Camera for EVERY component: orthographic parallel, directly south looking north, exactly 30 degrees elevation, yaw ZERO. North runs straight upward on the image. A north-south wall recedes vertically on screen without vanishing-point convergence. Its broad east/west plaster side faces are EDGE-ON, not diagonal visible facades. Show the narrow tiled coping roof, ridge, credible wall thickness and south-facing masonry end only where exposed. Do not turn the camera to make the side wall more visible. East-west brick courses and eaves stay horizontal.

  Scale contract: all three components use IDENTICAL pixels per metre and the same wall cross-section as Image 1. At game scale, east-west length projects to 64 logical pixels per metre, north-south ground depth projects to 32 logical pixels per metre. One 5-metre longitudinal run therefore has 160 logical pixels of ground-depth projection, separately from approximately 200 logical pixels of ridge-to-brick-foot visual height. The approximately 216-logical-pixel source carrier height includes transparent breathing room; it is NOT the longitudinal run length. Do not shrink the upright wall height to 160 pixels. Prefer about two native image pixels per logical pixel, with roughly 2304 by 1024 native atlas framing if available; returned resolution and all anchors will be measured rather than assumed or upscaled.

  Component A, placed in the LEFT atlas area: one straight north-south courtyard-wall module with a continuous 5-metre-long roof run, approximately 0.40-metre masonry thickness and modest coping overhang. The roof ridge is vertical on screen. Its SOUTH end has a plain believable narrow masonry end face with the same plaster and brick base as Image 1, not a pillar, wide front wall or doorway. The uninterrupted interior roof region must contain several metres of complete articulated tiles, with no repeated transverse end caps, posts or decorative interrupts. This long interior region will be selected by GPU UV geometry for adjoining runs; the south end face is used only at an exposed end. Keep the far north end construction simple, without a tall ornament or silhouette blocking an adjoining run.

  Component B, placed in the MIDDLE atlas area: a complete SOUTHWEST L-corner, with a 5-metre horizontal arm extending EAST to image-right and a 5-metre longitudinal arm extending NORTH straight upward. Component C, placed in the RIGHT atlas area: a complete SOUTHEAST L-corner, with a 5-metre horizontal arm extending WEST to image-left and a 5-metre longitudinal arm extending NORTH straight upward. Both have the SAME cross-section, ridge height, brick-foot level and tile scale as A and Image 1. Their horizontal arms must be long, straight, detailed wall runs suitable for selecting an interior planar join with the approved front wall, NOT tiny corner ornaments or short stubs. The two corner roofs genuinely turn and meet with credible ridge/hip termination, tile overlap, eave thickness and masonry corner bond; do not simply overlap two roof strips. Render B and C separately under the SAME upper-left/front light. C is not a mirror-flipped lighting copy of B. No extra return, branch, T-junction or diagonal arm.

  Materials and style: crisp physically detailed pre-rendered 2.5D architecture matching Image 1, not a seamless PBR scan. Restrained granular old lime plaster and irregular sparse lower-edge wear exposing grey bricks; continuous matching brick plinth and coherent mortar-course height. Preserve readable tile edges and joint shadows. No corrugated-metal waves, blurry microtexture, evenly spaced zigzag cracks, added noise treatment or colour redesign. Do not redesign the approved front wall.

  Framing and transparency: exactly three separated complete silhouettes, side by side at identical authored scale, with generous genuinely transparent margins and transparent gaps so each module can be measured independently. All end faces and eaves must remain fully inside the canvas. No labels, letters, diagrams, scale bars, ground, paving, cast ground shadow, background, scenery, people, props, gate, main hall, wooden posts, freestanding decorative pillars or watermark. No black backdrop or checkerboard pixels. Use true transparent alpha and deliver only this single module atlas.
