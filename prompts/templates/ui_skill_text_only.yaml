id: ui_skill_text_only
description: 寒山玄铁武学界面固定中文文字图层
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  Use case: game UI text layer.
  Asset type: a single isolated raster Chinese game UI wordmark for compositing over an existing wuxia RPG panel.
  Primary request: render exactly one fixed Chinese text string: "{control_text}".
  Composition: the text only, centered, large, horizontal, with generous empty space around it on a perfectly flat solid magenta #ff00ff chroma-key background. The text must not touch the image edges.
  Text: exactly "{control_text}", rendered in pale jade-white forged metal lettering with subtle cold steel highlight and a restrained dark shadow for readability. Keep the lettering perfectly horizontal and centered.
  Absolutely no plaque, no border, no frame, no button, no panel, no background decoration, no icon, no ornament, no seal, no additional text, no numbers, no fake writing, no logo, no watermark.
  The magenta background must be one uniform flat color with no gradient, texture, shadow, lighting variation, or reflection. Do not use magenta in the lettering.
