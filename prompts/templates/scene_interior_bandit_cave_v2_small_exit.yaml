id: scene_interior_bandit_cave_v2_small_exit
description: Bandit cave with a house-like small floor exit.
quality: high
size: "1536x1024"
prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior: a bandit cave hideout as a compact cutaway room centered on a pure black 1536x1024 canvas. Keep the same dark blue-grey rock, warm torchlight and readable hand-painted Hong Kong wuxia comic style. Include a campfire at the rear, two bedrolls on the left, crates and a faded banner at the right, with a broad clear center floor for a 90-pixel-tall player and enemies.
  Critical exit design: at the lower center use a small shallow rectangular missing floor/wall section, visually matching the modest unframed house-room exits. It must be only about 12 percent of room width and 7 percent of room height, with flat dark interior black behind it. It must not be a huge chasm, pit, ravine, cliff, staircase, drop-off or cave mouth. No giant hole, no dramatic foreground rock split, no wooden doorframe, posts, lintel, threshold beam, outdoor scenery, people, animals, chest, UI, text or watermark. The game supplies the animated arrow.
