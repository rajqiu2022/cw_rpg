prompt_template: |
  Create exactly one square 4 by 4 sprite atlas for Xing Fantian, Leng Guyun's martial master. He is a tall, lean but strong Chinese martial artist in his early fifties, with a composed stern face, narrow eyes, black hair tied neatly with only slight grey at the temples. He wears a charcoal-blue long cross-collar martial robe with a muted teal inner layer, simple wide sash, dark fitted trousers and low dark boots. A modest sheathed straight sword hangs at his left waist. He is dignified and mature, never a youth, never a hooded wanderer, never purple-robed, never chibi, never short or stocky.

  Rendering must harmonize with the protagonist: premium 2.5D Chinese wuxia comic field sprite, restrained dark ink contours, blue-grey cloth, warm upper-left light, cool fill, clean readable volume at 160 pixels tall.

  Flat #ff00ff chroma-key background only. Row 1 is front/down, row 2 is back/up, row 3 is right, row 4 is left. Columns 1-4 are a calm planted stance, gentle breath, slight robe flutter, return to planted stance. Every full body has both boots complete and on an identical foot baseline. No grid, text, UI, scene, floor, cast shadow, border, crop, extra limb, duplicate person, action pose or weapon held in hand.

