prompt_template: |
  Use case: historical-scene.
  Asset type: ONE isolated realistic RGBA architectural module for a Chinese wuxia RPG city INTERIOR.
  Input images: the existing Luoyang building is a MATERIAL, CAMERA AND LIGHTING reference only, not an edit target, not to be pasted into this asset.
  Primary request: Three adjoining but distinct two-storey Chinese street houses forming ONE coherent continuous frontage. Ground level has three deep open shop doorways with separate solid timber jambs, a restrained cloth awning on one bay, timber shutters on another, and one short stone step at each doorway. Upper floors have individually weathered lattice windows, modest asymmetry, grey tiled roofs at slightly different heights, and plausible shared party walls. No detached loose props. Frontage is about 14 metres wide and 7 metres tall; doorway clear heights about 2.4 metres. This is adult-scale city architecture, NOT a miniature entire town.
  Style/medium: crisp photorealistic physically detailed pre-rendered game architecture. Individual roof tiles, mortise-and-tenon joinery, subtle worn edges and real material variation, not cartoon, anime, watercolor, flat-color boxes or a plastic toy.
  Camera: FRONT-FACING ORTHOGRAPHIC parallel view, directly SOUTH looking NORTH, exactly 30 degrees elevation above the horizontal. Front facades horizontal, verticals vertical, no vanishing point, no isometric diagonal facade. Match the reference viewpoint precisely.
  Composition: complete building, all roof corners, lowest stone shoes and steps inside the image. Leave generous genuinely transparent margins around the ENTIRE silhouette, including underneath. No cropping. Human-scale doorway approximately 150-165 logical pixels tall when the final image is scaled to its intended width; ordinary adult game sprites are 113.5 logical pixels tall.
  Lighting: neutral slightly warm daylight from upper-left/front with restrained cool ambient fill. Dark aged timber, warm weathered grey stone and charcoal roof tiles matching the reference. Short contact shade directly at solid feet only; no broad baked ground shadow.
  Text: NONE. No Chinese characters, Latin letters, sign text, seals, labels, decorative pseudo-writing, logos or watermark. Functional signs will be runtime layers.
  Transparency/constraints: truly transparent alpha=0 background and all open door/window apertures where no internal solid surface is visible. Preserve believable internal shade in recessed interiors, do not fill the open entry with black backdrop. No ground plane, paving patch, terrain, sky, trees, people, background buildings, fog, grey halo, checkerboard pixels, rectangular platform or extra disconnected accessories. Do not render a complete scene. Navigation and street ground are constructed separately.

