id: ui_dialog_frame_v8
description: 对话框外框 v8（超宽底部横条 6:1），寒山玄铁雾蓝风格，匹配1800x300
quality: high
size: "1536x1024"

prompt_template: |
  {style_anchor}

  生成一个中国武侠RPG游戏底部对话框外框UI元素。纯白色背景 #FFFFFF 占画面绝大部分。

  关键约束：对话框必须是画面底部一条非常扁平的横向长条，高度严格不超过画面总高度的 17%（约170px）。对话框上面 83% 都是纯白背景。

  整体风格：寒山玄铁 · 雾蓝侠影 —— 深墨蓝玄铁底色，冷钢蓝双层描边，霜蓝高光，
  港漫厚涂金属质感，墨线分明。

  对话框布局（超扁平横条，宽高比约 6:1）：
  - 对话框紧贴画面最底部边缘，从左到右几乎撑满画面
  - 左侧立绘框区域（约占1/4宽度）：深墨蓝玄铁边框，内侧黑色留空，四角铆钉
  - 右侧文字区域（约占3/4宽度）：深墨蓝凹槽底板，空白不写任何字
  - 右上角小标签位（空白）
  - 底部右下角小三角继续提示符
  - 四角云纹铆钉金属装饰
  - 边框双层：外层冷钢蓝细线，内层深墨蓝粗线

  严格要求：
  - 对话框总高度不可超过画面 17%，要极其扁平
  - 对话框上方大面积纯白，不要画任何东西
  - 不写任何文字、名字、对话内容
  - 不画英文、繁体、水印、签名

  反向：{negative}

variables: {}
