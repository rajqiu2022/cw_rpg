id: ui_quest_small_controls
description: 任务面板小控件（按钮三态、列表行、标签）+ 参考设计稿
size: "1536x1024"
resolution: "1k"
reference_images:
  - "game/art/ui/cold_wuxia/v2/ui_display_quest_bright.png"

prompt_template: |
  参考设计稿风格。纯白背景，放置以下独立小控件，横排纵排排列，互不重叠，留足间距。
  
  关闭按钮 三态竖排（各约 50×50）：normal=暗钢底冷蓝边 / hover=光晕 / pressed=内凹。无文字。
  追踪按钮 三态竖排（各约 190×48）：normal=深竹绿底钢蓝边 / hover=青绿光晕 / pressed=暗绿内凹。无文字。
  任务列表行 两态竖排（各约 440×100）：normal=暗墨蓝底细钢蓝边 / selected=霜蓝边框微光。无文字。
  筛选标签 四态横排（各约 100×40）：normal=深墨蓝底细边 / selected=霜蓝高亮 / hover=加亮 / pressed=内凹。无文字。
  
  港漫厚涂冷色暗调。禁止文字数字字母水印签名。

variables: {}
