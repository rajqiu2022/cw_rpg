id: ui_field_portal_marker_v1
description: 场景出口引导图标，小型玉质下箭头，无文字透明素材
quality: high
size: "1024x1024"

prompt_template: |
  Use case: game UI sprite asset.
  Asset type: one isolated map-exit arrow for a hand-painted wuxia RPG.
  Primary request: draw exactly one small broad downward-pointing arrow made from subdued celadon jade, with a narrow antique bronze rim and a tiny ornamental cloud knot at its top. This is a simple directional marker only, not a signpost, not a board, not a circle, not an orb, not a medallion, not a button, and not a blank shape.
  Style: Chinese wuxia game interface decoration, painted ink-brush texture, muted celadon jade, restrained antique bronze highlights, very soft warm edge glow. Front-facing, symmetrical, centered, readable at 64 pixels.
  Composition: one complete arrow only, centered, generous empty padding around it, no frame, no wooden structure, no ground plane.
  Text: no letters, no Chinese characters, no numbers, no symbols, no fake writing.
  Background: perfectly flat solid magenta #ff00ff chroma-key background. The background must be one uniform color with no shadow, gradient, texture, lighting variation, reflection, or floor.
  Constraints: do not use magenta in the marker; show the jade arrow silhouette and bronze rim clearly; crisp silhouette; no watermark; no logo; no people; no scenery; no blue sci-fi glow; no bright cyan; no UI debug chevrons; no circles, no discs, no blank white objects.
