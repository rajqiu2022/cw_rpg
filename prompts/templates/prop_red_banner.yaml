id: prop_red_banner
description: 红色酒旗/幌子（港漫风格），悬挂于竹竿
quality: medium
size: "1024x1024"

prompt_template: |
  {style_anchor}

  一面中国传统酒旗/幌子，用于游戏场景道具。

  构成：
  - 一根细长竹竿垂直悬挂
  - 竿顶系一面红色布质酒旗，长方形竖幅
  - 旗面边缘有深红褐色包边
  - 旗面中央可用暗金色写一个「酒」字（简体中文，非繁体）
  - 旗布有自然褶皱和风吹微摆的纹理
  - 竹竿底部削尖，可直接插入地面

  构图：
  - 1024×1024 画布
  - 纯白背景 #FFFFFF
  - 旗竿居中，旗面从顶部约 10% 处垂至约 80% 处
  - 港漫厚涂风格，墨线分明，色彩饱和

  项目禁忌：禁止繁体中文/水印/签名

  反向：{negative}

variables: {}
