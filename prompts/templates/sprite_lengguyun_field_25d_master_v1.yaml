prompt_template: |
  Create one full-body 2.5D game-character visual master for Leng Guyun, intended as the style reference for a top-down Chinese wuxia RPG field sprite. One person only, centered, standing naturally with feet visible, shown at a high three-quarter camera angle and facing slightly toward the viewer. Use a perfectly flat #00ff00 chroma-key background, with no floor plane, cast shadow, scenery, border, UI, text, watermark, duplicate figure or cropped body.

  Character: young Chinese wuxia swordsman, black tied hair with no headband, medium athletic seven-head build, dark blue-grey cross-collar robe to mid-calf, pale inner collar, dark trousers and short boots, muted brown diagonal leather strap, sheathed sword at waist, exactly one small grey-green wine gourd at his left belt. Keep his expression calm and resolute.

  Rendering: premium 2.5D hand-painted game sprite, with subtle sculpted volume, physically coherent warm upper-left key light, cool ambient fill from the right, soft occlusion within folds and under the belt, matte cloth and leather materials, crisp ink contour lines, restrained Hong Kong wuxia comic palette. The figure must feel naturally lit inside a warm wooden room or torch-lit stone cave, never like a bright studio cutout. Keep the silhouette clean and readable at 160 pixels tall.

  Avoid: photorealism, anime chibi proportions, flat white highlights, glossy plastic, harsh rim glow, long thin legs, oversized weapon, headscarf, forehead band, red hair tie, extra gourd, western armor, text, document or infographic.
