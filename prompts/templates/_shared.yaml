# 全局共享配置：所有模板都隐式合并这些字段
# gen_assets.py 会先加载本文件，再用具体模板覆盖

# 风格锚点：所有资产共用，确保整个游戏视觉统一
# 注意：不要直接提及具体艺术家/IP（"马荣成"/"风云"等）会触发 Azure moderation；
#       用风格特征描述代替。
#
# 整体基调（v0.2 用户拍板，2026-04-27）：
#   - 默认明亮通透、色彩鲜艳饱和、光影对比鲜明、阳光感强
#   - 仅特定阴暗场景（洞穴 / 密林深处 / 墓地 / 夜战 / 地下密窟）允许使用暗调
#   - 严禁整体灰暗、压抑、低饱和、雾蒙蒙的色彩倾向
style_anchor: |
  90 年代中国港式武侠漫画美术风格，2.5D 漫画质感，
  墨线分明清晰，厚涂上色、色彩饱和鲜艳明亮，
  人物五官立体，衣袂飘动有动势，
  整体明亮通透、光影对比鲜明、阳光感强、色彩活力充沛，
  保持暖色调与冷色调的鲜明对比，避免整体灰暗压抑。

# 通用反向词：避免常见翻车
# 注 1：GPT Image 倾向输出繁体中文，必须显式禁止；详见 docs/dmxapi-setup.md 经验记录
# 注 2：DMXAPI 后端是 Azure OpenAI，对涉及肢体/暴力的反向词（畸形手指、多余四肢等）
#       会被审核误判触发 moderation_blocked。这里只保留风格类反向词，肢体细节交给
#       prompt 主体的画面要求约束。
negative: |
  现代服装，3D CG 渲染感，照片级写实，
  网络红人脸，二次元萌系，迪士尼风，
  水印，签名，文字乱码，
  繁体中文，繁体字，traditional chinese characters，
  错字，简化字写错，
  整体灰暗，雾蒙蒙，低饱和，沉郁压抑，黯淡无光，灰蒙蒙的色调

# 默认参数（具体模板可覆盖）
defaults:
  size: "1024x1024"
  quality: "medium"
  background: "opaque"   # GPT Image 2 不支持 transparent
  output_format: "png"
