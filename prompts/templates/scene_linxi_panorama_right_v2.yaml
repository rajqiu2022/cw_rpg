prompt_template: |
  Use the supplied image as the strict style and adjoining-left-panel reference. Create ONE native 1536x1024 right-hand continuation panel for the same Linxi Village scrollable RPG map. Match its high three-quarter camera, inked hand-painted wuxia treatment, warm morning light, gray tile roofs, bamboo, dirt color, stonework, and route scale.

  At the far left edge, begin with the same dense bamboo, rocky slope, fence, and bright dirt road transition from the reference's right edge. Do not recreate the master courtyard. Continue the road naturally into a broad central village lane. Place a compact open-front blacksmith workshop in the upper-right, with gray tile roof, stone foundation, clear door-level frontage, and forge bay. Reserve clean ground at the lane shoulder for a separately placed chest and stone tablet. The broad road continues diagonally toward a visible lower-right village gate and exits the image there.

  This is gameplay scenery: broad continuous walking ground, no characters, NPCs, animals, text, readable signs, UI, watermark, baked chest, baked tablet, stone stele, upright marker, signpost, oversized foreground roof, or roof covering the adjacent walkable lane. The result must be one standalone right panel, not a collage and not a duplicate of the reference.
