prompt_template: |
  Use the supplied image as the strict identity, costume, body-proportion, contour and lighting reference for Leng Guyun. Create ONE horizontal four-cell game sprite strip for a Chinese wuxia 2.5D RPG. All four equal cells show the same complete character walking away from the viewer: contact, passing, opposite contact, passing back to the loop. Rear-facing orthogonal gameplay view, not isometric.
  Keep the same tied black hair, blue-grey robe, pale inner garment, brown diagonal strap glimpsed at the shoulder, waist sword, exactly one grey-green left-belt gourd visible in rear three-quarter silhouette, medium athletic seven-head body and full boots. Lock head, shoulders, belt and foot baseline across cells; only legs, arms and robe hem move. Preserve warm upper-left key light, cool right fill, matte cloth volume and crisp ink contours from the reference.
  Use a flat #00ff00 chroma-key background, no ground, shadow, scenery, grid, text, watermark, duplicate figure, cropped body, headband, red hair tie or extra gourd. Each frame must be fully separated with generous even green spacing.
