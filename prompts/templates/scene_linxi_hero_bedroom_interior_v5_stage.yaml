prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior presentation in the style of a classic Chinese single-player RPG: one compact, isometric cutaway bedroom shown as a self-contained room stage in the middle of a pure black canvas.

  Composition: the entire room occupies only the centered middle 70 percent of the 1536x1024 frame. Surrounding area is solid pure black with no vignette, decoration, landscape, grass, exterior path, outer wall continuation, or visible outdoor scenery. At the lower center of the room, leave a simple open interior doorway as a dark black opening. The exit arrow will be added by the game, so do not draw an arrow, sign, text, or portal effect.

  Room scale: a runtime adult player sprite is about 90 pixels tall. Use a genuinely small single cot about 160 pixels wide and 210 pixels long along the left wall. Add a small writing desk, a narrow weapon rack, a woven mat, and a travel pack, all at plausible human scale. Keep clear walking space in the center and on the right for a separately placed chest. Do not bake a chest into the room.

  Style: restrained warm hand-painted Hong Kong wuxia comic game art, crisp dark ink contours, wooden floor and plaster walls, high three-quarter view, no people, no animals, no UI, no text, no watermark. Avoid huge furniture, mansion scale, exterior landscape, visible grass through the doorway, glow, black frame around the room, and any item blocking the doorway.
