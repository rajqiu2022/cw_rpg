id: scene_interior_bandit_cave_v3_shallow_exit
description: Bandit cave room with a very small house-like exit slit.
quality: high
size: "1536x1024"
prompt_template: |
  Create a production-ready 2.5D Chinese wuxia RPG interior room, a compact bandit cave hideout on a pure black 1536x1024 canvas. Keep a dark blue-grey hand-painted rock palette, warm torchlight, a campfire at the rear, two small bedrolls on the left, crates and a faded cloth banner on the right, and a broad continuous stone floor in the foreground.
  The lower center must read as a normal small room exit like a modest house interior: a narrow horizontal dark doorway slit in the back edge of the floor, only 8 percent of the room width and 3 percent of the room height. The stone floor must continue uninterrupted around it and stop at a thin shallow edge. The exit is not a hole in the foreground.
  Absolutely no deep opening, chasm, pit, ravine, cliff, staircase, descending tunnel, broken floor, large black void, foreground rock split, cave mouth, doorway frame, posts, lintel, threshold beam, outdoor scenery, characters, animals, chest, UI, text or watermark. The game supplies the animated arrow.
