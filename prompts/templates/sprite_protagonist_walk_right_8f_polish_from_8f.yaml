# 主角 Field 向右行走 8 帧 polish strip
# 基于已通过的 8 帧稳定版做细节优化：减少重复中立帧、增强腿部过渡可读性。

id: sprite_protagonist_walk_right_8f_polish_from_8f
description: Field 用向右行走 8 帧 polish strip（以 8 帧稳定版为参考微调过渡帧）
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_right_8f_stable_from_4f.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图是当前最接近可用的 **右走 8 帧稳定版**，必须作为角色外观、尺寸、脚底基线、剑和酒葫芦位置的权威参考。
  - 本次只做 polish：保持角色和构图不变，优化腿部过渡帧，让动作更连续。
  - 不要重新设计角色；不要改变衣服颜色、发型、剑、酒葫芦、脸型或身高比例。

  【输出目标】
  - 一张 **单行 8 格** 向右行走 sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，八格保持同一脚底基线；上方留白可以很多，但不要画额外内容。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【polish 目标】
  - 当前参考图的问题：第 2/3 帧、第 6/7 帧有些接近，容易产生轻微停顿。
  - 本次要让 8 帧相位更均匀：每一帧腿部姿态都比前一帧推进一点点。
  - 第 2、4、6、8 帧必须是清楚的“中间过渡帧”，不要复制第 1/3/5/7 帧。
  - 保持头部、脸型、发束、上半身、腰带、剑、酒葫芦位置高度稳定。
  - 只让腿部、脚尖、手臂小幅变化；衣摆和头发只做轻微随动，不能大幅换形。

  【对齐硬要求】
  - 8 格脚底基线完全一致：支撑脚鞋底都压在同一条不可见水平线。
  - 8 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 4 px；腰带高度变化不超过 3 px。
  - 剑、衣摆、头发不要跨进相邻格；每格都能单独裁切。

  【向右 8 帧循环，相位必须均匀】
  - 第 1 格 contact A：左脚在前方（画面右侧）落地，右脚在后方；步幅适中。
  - 第 2 格 down A：左脚承重，右脚后跟抬起，身体极轻微下沉；不要与第 1 或第 3 重复。
  - 第 3 格 passing A：右脚经过身体正下方，双脚距离最小；身体回到中位。
  - 第 4 格 up A：右脚向画面右侧摆出但尚未落地，左脚开始蹬地；不要与第 3 或第 5 重复。
  - 第 5 格 contact B：右脚在前方（画面右侧）落地，左脚在后方；与第 1 左右腿对调。
  - 第 6 格 down B：右脚承重，左脚后跟抬起，身体极轻微下沉；不要与第 5 或第 7 重复。
  - 第 7 格 passing B：左脚经过身体正下方，双脚距离最小；身体回到中位。
  - 第 8 格 up B：左脚向画面右侧摆出，即将回到第 1 格的左脚前踏；不要突然大跳。
  - 播放顺序为 1 → 2 → 3 → 4 → 5 → 6 → 7 → 8 → 1。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。
  - 剑和青瓷酒葫芦在所有帧中位置稳定，不要忽然换边、消失或变色。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止每帧衣服/头发/剑大幅漂移。
  - 禁止 45° 等距地砖透视；本图是正交侧向 field sprite。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
