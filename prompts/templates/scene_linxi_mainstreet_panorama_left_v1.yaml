id: scene_linxi_mainstreet_panorama_left_v1
description: Left panel for Linxi Village's scrollable main street exploration map.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 left-hand panel for a scrollable Chinese wuxia RPG village main street. Use an inviting hand-painted comic 2.5D environment with crisp ink outlines, high three-quarter camera, warm morning light, gray tile roofs, weathered timber, pale stone, faded red lanterns without characters or writing, and soft bamboo-green surroundings.

  Composition: a broad 220-pixel-wide stone-and-dirt lane enters from the lower-left and travels through the center toward the right edge. On the upper-left place the static building mass of a modest martial hall with a covered practice courtyard, but leave its frontage and the central lane open. On the upper-right place a tea-house or general-store facade with blank wooden signboard and no visible goods or people. Keep two empty lane shoulders deliberately clear for separately placed NPCs, chest, lantern and shop interaction props. The rightmost 12 percent should transition into bamboo, low walls and a continuing lane for a later seam.

  Base scenery only: no people, NPCs, animals, carts, chest, stone tablet, loose props, readable writing, signage text, UI, arrows, watermark, or roof blocking the lane. No crowded market; this must be a legible RPG route with clear feet-level collision landmarks.
