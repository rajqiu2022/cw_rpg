id: scene_zhuwei_connector_terrain_v1
description: Low-information terrain connector for Zhuwei Village panel composition.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 seamlessable terrain-only connector panel for a Chinese wuxia RPG village, seen from the same fixed elevated three-quarter 2.5D camera as a pre-rendered game level. This is a playable navigation surface, not an illustration or poster.

  Composition is deliberately low-information: a broad pale stone street enters from the full left edge at mid-height and leaves through the full right edge at the same height. The road is 420 to 520 pixels wide through the middle and has continuous irregular pale paving, compacted dirt between stones, shallow weeds and soft warm morning shadows. Keep the complete leftmost and rightmost 280 pixels free of buildings, stairs, tall trees, fences, bamboo trunks, walls, water, gates, arches, doorframes and props so these edges can overlap adjacent panels safely.

Only at the far top and bottom edges use low grass, small rocks and sparse bamboo leaf shadows; never create a landmark, house, person, NPC, chest, sign, text, UI, arrow, watermark or logo. Preserve a clear open road suitable for placing independent transparent houses, trees and NPCs later. Match a premium hand-painted 2.5D Chinese village game level: realistic stone depth, contact shading, soft occlusion and readable material, no flat tilemap, no empty paper-like plaza, no collage.

variables: {}
