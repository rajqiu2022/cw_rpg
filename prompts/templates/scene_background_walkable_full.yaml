id: scene_background_walkable_full
description: 可行走探索场景整图背景（视觉整图，碰撞由 Tiled 隐形层控制）
quality: high
size: "1536x1024"

identity_anchor: |
  90 年代港漫风武侠 RPG 可行走场景，斜向 45° 等距视角俯视。

reference_images: []

prompt_template: |
  {style_anchor}

  生成一张完整的 RPG 可行走地图背景图，不是素材拼图，不是 tileset，不是分层素材。
  视觉目标是“2.5D 预渲染 3D 场景 + 手绘武侠贴图”，不是平面原画。

  场景：{{scene_name}}
  描述：{{scene_desc}}
  时辰：{{time_of_day}}
  天气：{{weather}}
  关键元素：{{key_elements}}

  构图与玩法要求：
  - 1536×1024 横版，但主要可玩内容必须放在画面中央 16:9 安全区内，方便后续裁切成 1920×1080。
  - 严格 45° 等距视角，村路、房屋、植物都遵循同一视角，不要透视混乱。
  - 画面下半部必须有一条清晰、连续、宽阔的黄土可行走主路，从左下进入，经过中央空地，通向右侧出口。
  - 主路边界要肉眼清楚，路面上不能堆满杂物；至少保留 35% 画面作为可行走区域。
  - 左上放一栋完整木结构小酒馆，右上放一栋完整铁匠铺，中上放一栋较小民居；建筑必须完整、统一、不破碎。
  - 竹林和灌木只做边缘框景，不要切碎散落，不要遮挡主路。
  - 中央空地可有一个石坛或路牌作为互动点，但不要挡住行走路线。
  - 画面中绝对不要任何人物、NPC、玩家、动物；运行时由游戏引擎叠加角色。
  - 不要文字、不要招牌中文字、不要 UI、不要图标、不要水印。
  - 整体是一张自然完整的场景插画，不能像多个 PNG 图块拼接。

  美术要求：
  - 预渲染 3D 场景体块感：建筑有明确的厚度、屋檐深度、侧墙、台阶高度、墙根投影和接地阴影。
  - 使用手绘武侠贴图和港漫色彩，不要照片级真实，也不要低多边形卡通。
  - 地面、台阶、石坛、围栏和建筑底座要有空间层次，像可行走游戏场景，不像单张平面概念原画。
  - 厚涂港漫质感，墨线清晰，色彩鲜艳明亮，阳光通透。
  - 建筑、植物、道路的尺度统一，阴影方向一致。
  - 画面可读性优先，避免过度复杂、碎片化、密集装饰。

  反向：{negative}，人物，NPC，角色，动物，tileset，atlas，sprite sheet，素材分块，拼图痕迹，破碎建筑，零散植物，密集杂物，文字招牌，纯平面原画，概念设定图，照片级 3D，低多边形卡通

variables:
  scene_name: "林西村新手关完整场景"
  scene_desc: "1-2 句描述可行走新手关场景"
  time_of_day: "morning | noon"
  weather: "clear"
  key_elements: "黄土主路、完整建筑、边缘竹林、互动石坛/路牌"
