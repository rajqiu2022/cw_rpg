id: ui_dialog_frame_v6
description: 对话框外框（底部横向长条），含立绘区域+文字区域
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  生成一个中国武侠RPG游戏底部对话框外框。

  布局（横向长条，比例约 6:1）：
  - 左侧方形立绘框区域：深墨蓝玄铁边框，内侧留空黑色（用于程序放置角色立绘）
  - 右侧大面积文字区域：深墨蓝凹槽底板，可容纳2-3行对话文字（空白不写字）
  - 右上角小标签显示说话人名字（空白不写字）
  - 底部右侧小三角继续提示符
  - 深墨蓝玄铁底色，冷钢蓝双层描边，四角云纹铆钉
  - 港漫厚涂金属质感，墨线分明

  要求：
  - 纯白背景 #FFFFFF
  - 整体横向，文字区域占大部分
  - 不写任何对话内容
  - 不画英文繁体水印签名

  反向：{negative}

variables: {}
