id: ui_skill_text_control
description: 带固定中文标题的寒山玄铁武学界面控件
quality: high
size: "1024x1024"

prompt_template: |
  {style_anchor}

  Use case: ui-mockup.
  Asset type: one isolated 2D wuxia RPG interface control for Godot.
  Primary request: a single centered formal forged-iron control plaque containing exactly one fixed Chinese text label: "{control_text}".
  Composition: one wide horizontal plaque only, front-facing, symmetrical, with generous empty padding around the plaque and a transparent-looking uniform near-black background for easy cropping. The plaque must have a crisp complete border, readable interior, and no overlap with the image edges.
  Text: render exactly "{control_text}" in large centered traditional Chinese calligraphy-inspired game UI lettering, high contrast pale jade and cold silver, perfectly horizontally and vertically centered. Do not render any other text, characters, numbers, symbols, or fake writing.
  Materials: matte blue-black forged iron, cold steel trim, restrained jade inlay, subtle dark crimson accent, matching the existing formal skill panel assets.
  Constraints: only one plaque and the exact requested Chinese text; no characters, icons, item pictures, scenery, watermark, logo, additional controls, or decorative objects.
  Avoid: warm gold dominance, orange, purple neon, modern web dashboard, parchment, photorealism, illegible text, misspelled Chinese, extra words, fake writing, cropped edges, tilted perspective.
