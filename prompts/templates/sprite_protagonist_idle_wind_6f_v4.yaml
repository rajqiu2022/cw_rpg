# 主角 idle 待机 6 帧 strip（v4 单帧参考版）
# 用右走 v2 的 passing 帧作为角色外观直接参考，确保外观 100% 一致。
# 双脚不动，发带/袍摆/袖口大幅风动。

id: sprite_protagonist_idle_wind_6f_v4
description: Field 用 idle 待机 6 帧 strip，单帧参考确保外观一致，大幅风动
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/ref_walk_right_v2_frame2.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途 · 绝对权威】
  - 参考图是从已完成并通过验收的 **右走 sprite strip 中截取的单帧**，展示了角色的准确外观。
  - **你的任务：把参考图中的这个角色，从行走姿势改成静止站立姿势，并加入风吹动效果。**
  - 除此之外，**不改变这个角色的任何东西**。

  【外观复制清单 · 必须逐项与参考图相同】
  - 脸型和五官：与参考图中的角色完全相同
  - 发型和发带：黑色长发束在脑后，简素深色发带，刘海形状与参考图一致
  - 冷灰布袍：颜色、灰度、冷色调与参考图中的布袍完全相同，不准偏蓝/偏紫/偏棕/偏浅灰
  - 白色中衣：领口形状和露出面积与参考图一致
  - 青瓷酒葫芦：大小、形状、灰绿色调、挂在腰侧的位置与参考图完全一致
  - 长剑：剑柄形状、剑鞘颜色、悬挂角度与参考图完全一致
  - 深色短靴：靴型和颜色与参考图一致
  - 身高体型：角色的总高度（脚到头顶在画布上的像素数）、头身比、胖瘦与参考图一致
  - **这个角色长什么样、穿什么、有多高，全部由参考图说了算。**

  【输出目标】
  - 一张 **单行 6 格** 待机 idle sprite strip，画布 **1024×1024**。
  - 隐形网格：6 列 × 1 行；每格约 170×1024。
  - 角色只占画布中下部区域；背景纯白 #FFFFFF。
  - 无任何文字、标题、色板、网格线、UI、水印。
  - 角色在画布上的总高度必须与参考图中的角色高度一致。

  【视角】
  {{facing_desc}}

  【核心 1：静止站立，脚钉死】
  - 角色从行走姿势改为**完全静止的站立姿势**。
  - 双脚死死钉在地上，6 帧中脚的位置、鞋尖朝向、鞋底高度**一个像素都不准变**。
  - 双腿直立但放松，膝盖不弯，不迈步不换脚不移动重心。
  - 身体躯干、头部、腰带在 6 帧中绝对稳定：水平漂移 ≤ 1 px，垂直漂移 ≤ 1 px。

  【核心 2：必须有大风动效果，不能微弱】
  - 假设角色站在山间，**持续的劲风从侧面吹过**。
  - 以下元素必须在 6 帧中有 **大幅位移**，要一眼能看出在动：
    - **脑后发带**：尾端大幅左右/上下飘摆，位移 **20～35 px**（这是画面中最显眼的动态元素）
    - **几缕散发**：在脸颊或颈侧来回拂动，位移 **10～18 px**
    - **袍摆下缘**：前摆和后摆交替被风掀起又落下，衣角上扬 **12～25 px**，袍子下摆形状每帧明显不同
    - **袖口边缘**：宽大袍袖的袖口飘拂，位移 **10～18 px**
    - **腰带末端**：明显晃动摇摆，位移 **8～12 px**
    - **衣袍褶纹**：衣褶随风有 2～3 处可见的位置变化
  - 风的强度参考：不是微风，是山口的阵风，能把发带吹得横飘起来的那种。

  【6 帧风动相位】
  - 第 1 格：风初起，发带开始扬起，袍摆轻抬。
  - 第 2 格：风增强，发带扬到半高，袍摆明显上翻，散发飘开。
  - 第 3 格：风到最强，发带扬至最高最远，袍摆抬至最高，袖口完全张开。
  - 第 4 格：风维持强但开始转弱，发带从最高点微回落，袍摆仍较高。
  - 第 5 格：风继续减弱，发带回落到半低，袍摆接近原位。
  - 第 6 格：风最弱，发带近垂，袍摆近原位。与第 1 格无缝衔接。
  - 循环 1→2→3→4→5→6→1。

  【对齐硬要求】
  - 6 格脚底同一水平线，身体中轴同一垂直线。
  - 头顶高度变化不超过 2 px；腰带高度变化不超过 2 px。
  - 每格可独立裁切，角色不跨格。

  【角色外观硬锁】
  {identity_anchor}
  - 脸与参考图完全相同。发型与参考图完全相同。布袍颜色灰度与参考图完全相同。
  - 酒葫芦与参考图完全相同。长剑与参考图完全相同。靴子与参考图完全相同。
  - **禁止头巾、额带、红发带、红头绳、发箍、头顶任何布条或饰物。**

  【风格】
  - 港漫厚涂 2.5D 简化到小人 sprite，轮廓线清楚。
  - 与参考图完全一致的笔触、上色方式、墨线粗细风格。
  - 气质沉静从容但风中屹立，非战斗姿势。

  【禁忌】
  - 禁止蜘蛛、蛛网、文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带/红发带；禁止蓝色或红色侠客服。
  - **禁止双脚移动、迈步、换脚、滑步——脚位一个像素都不准变。**
  - **禁止身体左右摇晃、上下跳动、躯干倾斜。**
  - **禁止风动微弱、发带静止、袍摆不动——必须大幅可见。**

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
