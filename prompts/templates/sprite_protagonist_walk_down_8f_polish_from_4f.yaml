# 主角 Field 向下（正面朝镜头）行走 8 帧 polish strip
# 以 4 帧 balanced_slow 为角色参考，按 polish 级别相位纪律生成 8 帧。

id: sprite_protagonist_walk_down_8f_polish_from_4f
description: Field 用向下行走 8 帧 polish strip（正面朝镜头，8 帧均匀相位）
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/library/sprite_sheet/sprite_lengguyun_walk_down_4f_balanced_slow.png"
  - "F:/Code/RPG_GAME/game/art/characters/lengguyun_walk_right_8f.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图 1 是已通过目视验收的 **向下行走 4 帧 balanced 版**：学习它的正面朝镜头方向感、角色正面外观（脸、胸口白衣、腰带正面、剑柄和酒葫芦的正面位置）。
  - 参考图 2 是已通过目视验收的 **右走 8 帧 polish 版**：学习它的角色外观一致性、衣袍颜色、头身比例、稳定性和 polish 级品质。
  - 本次做 polish 升级：保持角色外观与参考图一致，把 4 帧扩展为 8 帧，让腿部过渡更均匀自然。
  - 不要重新设计角色；不要改变衣服颜色、发型、剑、酒葫芦、脸型或身高比例。

  【输出目标】
  - 一张 **单行 8 格** 向下行走 sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，八格保持同一脚底基线；上方留白可以很多，但不要画额外内容。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：8 帧均匀自然】
  - 角色视角：正面朝向镜头。能看到脸、胸口、白色中衣、腰带、剑柄和青瓷酒葫芦。
  - 头、胸、腰带中心稳定，水平漂移不超过 3 px。
  - 左右肩不要摇摆，肩线只能有极小上下呼吸感。
  - 腿、鞋尖、膝盖、袖口和袍子下缘有中等变化，不要站桩不动的死板感。
  - contact 帧下半身轮廓比 passing 帧宽约 10～18 px。

  【向下 8 帧循环，相位必须均匀】
  - 第 1 格 contact A：左脚向画面下方/前方踏出，鞋尖清楚，右脚在身后略被袍遮；上半身正中。
  - 第 2 格 down A：左脚承重，右脚后跟离地；身体极轻微下沉；不要与第 1 或第 3 重复。
  - 第 3 格 passing A：右脚经过身体正下方，双脚距离最小，膝盖微弯；下半身轮廓收窄。
  - 第 4 格 up A：右脚向画面下方摆出但尚未落地，左脚开始蹬地；不要与第 3 或第 5 重复。
  - 第 5 格 contact B：右脚在下方踏出落地，左脚在身后；与第 1 格左右腿对调，上半身正中。
  - 第 6 格 down B：右脚承重，左脚后跟离地；身体极轻微下沉；不要与第 5 或第 7 重复。
  - 第 7 格 passing B：左脚经过身体正下方，双脚距离最小，膝盖微弯；下半身轮廓收窄。
  - 第 8 格 up B：左脚向画面下方摆出，即将回到第 1 格；不要突然大跳。
  - 播放顺序为 1 → 2 → 3 → 4 → 5 → 6 → 7 → 8 → 1。

  【对齐硬要求】
  - 8 格脚底最低点完全一致：支撑脚鞋底都压在同一条不可见水平线。
  - 8 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 4 px；腰带高度变化不超过 3 px。
  - 剑、衣摆、头发不要跨进相邻格；每格都能单独裁切。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。
  - 剑和青瓷酒葫芦在所有帧中位置稳定，不要忽然换边、消失或变色。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止左右摇摆；禁止大袍摆甩动；禁止脚底上下跳。
  - 禁止变成侧向或背向；本图必须是正面朝镜头。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
