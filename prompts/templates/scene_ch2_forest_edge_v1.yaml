prompt_template: |
  Create ONE native 1536x1024 Chinese wuxia RPG exploration background for Chapter 2: the outer edge of a bamboo forest near Zhuwei Village. High three-quarter 2.5D camera, hand-painted Hong Kong comic ink outlines, late-afternoon light, green bamboo, pale dirt road, damp gray rocks, distant foothills and a calm but uneasy mood.

  A broad continuous 220-pixel-wide dirt road enters at the lower-left, reaches an open roadside rest clearing in the center, then curves toward an upper-right forest pass. Frame it with low bamboo, broken stone walls and a small abandoned roadside pavilion far from the route. Leave clear shoulders for later NPC, chest, medicine-herb and encounter overlays. No roof, cliff, or vegetation may obscure the walking lane.

  Base scenery only: no people, NPCs, animals, enemies, corpses, chests, tablets, mechanisms, readable text, signs, UI, arrows, watermark, or loose interactive props.
