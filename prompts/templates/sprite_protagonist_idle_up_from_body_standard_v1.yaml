id: sprite_protagonist_idle_up_from_body_standard_v1
description: Four-frame up idle locked to the approved Leng Guyun body standard.
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/field-rework/body-standard/sprite_lengguyun_body_standard_v1_a.png"
  - "F:/Code/RPG_GAME/game/art/characters/protagonist_portrait.png"
require_reference_images: true

prompt_template: |
  Use the supplied full-body body-standard image as the exact body proportion and costume authority for Leng Guyun. Use the portrait only for identity. Do not redesign him.

  Create ONE 1536x1024 horizontal sprite strip containing EXACTLY FOUR isolated, equal-width cells arranged left to right. Pure white background and wide white gaps. Each cell shows one complete full-body orthographic BACK view sprite facing away from the viewer in a calm idle stance. The back and rear hair tie are visible, not the face. No grid, border, label, text, scenery, shadow, additional person, crop, or 45-degree view.

  Preserve the exact approved seven-head medium athletic build, black tied hair, dark blue-grey cross-collar robe, brown diagonal leather chest strap, waist sword, and exactly ONE grey-green double-lobed wine gourd at the left belt. No headband, no red ribbon, no second gourd, no costume or body change.

  All figures are about 150px tall, centered in their own cell, with one shared invisible shoe baseline. Head, shoulder, belt and boots stay at the same height. The four frames are a subtle breathing loop 1 -> 2 -> 3 -> 4 -> 1: only a very small robe hem, chest breathing, hair-tip and sleeve movement. Feet do not step, weapon and gourd stay fixed. No large flutter or pose change.

  Hong Kong wuxia comic game-sprite style, crisp dark ink contours and restrained painted shading. Prioritize exact identity and stable silhouette.

  Avoid: text, watermark, infographic, document, UI, grid, front-facing pose, side-facing pose, walking pose, action pose, extra limbs, tall thin anatomy, short stocky anatomy, headscarf, forehead band, red ribbon, spider, web, demon, western armor.

variables: {}
