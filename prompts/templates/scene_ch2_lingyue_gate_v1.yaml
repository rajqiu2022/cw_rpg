prompt_template: |
  Create ONE native 1536x1024 Chinese wuxia RPG exploration background for Chapter 2: the approach to Lingyue Sect's mountain gate. High three-quarter 2.5D camera, hand-painted Hong Kong comic ink outlines, cool moonlit blue palette with subtle silver highlights, pale stone steps, bamboo, cliffside pines and graceful restrained architecture.

  A broad 200-pixel-wide stone path enters from the lower-left and climbs gently to a fully visible open mountain gate at the upper-right. Keep the gate's foot-level entrance unobstructed, with low railings and lantern pedestals only at the edges. Leave the foreground and side shoulders clear for later female sect guard NPCs, a quest marker, and an optional chest. The route must be plainly readable and never covered by roof or mist.

  Base scenery only: no people, NPCs, animals, chests, tablets, banners with writing, readable text, signs, UI, arrows, watermark, or loose interactive props.
