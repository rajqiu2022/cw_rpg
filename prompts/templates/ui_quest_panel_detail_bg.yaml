id: ui_quest_panel_detail_bg
description: 任务详情区域背景—玄铁厚涂
model: gpt-image-2
size: "1024x1024"
quality: high
skip: false
priority: 1

identity_anchor: |
  《云影侠传》UI详情面板。寒山玄铁冷色风格。
  深墨蓝底、钢蓝边框、冷钢高光。
  港漫厚涂暗调，与面板底图完全一致。

reference_images:
  - "game/art/ui/equipment/panel_bg.png"

prompt_template: |
  {{identity_anchor}}
  
  生成一个任务详情区域的面板装饰。
  
  规格：
  - 竖向矩形面板，深墨蓝玄铁底
  - 钢蓝色细边框（2-3px）
  - 内部有 3-4 条极淡的水平分隔线（暗墨线，不是亮线），暗示文本分区
  - 色调与参考图底图一致，暗沉但有层次
  - 不要任何文字、数字、符号
  - 纯白背景，面板居中放置
  
  输出：竖向详情面板装饰。

variables: {}
