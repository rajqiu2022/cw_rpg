id: sprite_npc_walk_idle_13f_v1
description: NPC 13帧精灵图（9帧行走+4帧站立idle），单方向
quality: high
size: "3328x256"

identity_anchor: |
  {{character_name}}，金庸武侠风格。{{character_appearance}}。

prompt_template: |
  {style_anchor}

  生成一个游戏角色的13帧精灵图。严格按照以下要求：

  【角色】{identity_anchor}
  该角色朝向画幅{{direction_label}}。所有13帧中角色的长相、发型、服装、配饰完全一致。

  【帧序列】
  第1至第9帧：行走动作（{{direction_label}}方向迈步行走）
  第10至第13帧：站立idle动作（双脚站立不动，衣服和头发有轻微飘动）
  13帧为一个完整循环，第13帧结束后可无缝回到第1帧。

  【布局】
  画布横向宽幅，13个等宽竖条从左到右水平排列。
  每个竖条宽度固定为256px，总画布宽度3328px，高度256px。
  从左到右依次为第1至第13帧。
  竖条之间无分隔线。

  【每帧内角色】
  角色头顶到脚底的高度占画布高度的60%（约154px）。
  角色宽度约50-55px，人体宽高比约1:3。
  角色水平居中于本竖条内，即角色中心x坐标 = 竖条中心x坐标。
  所有13帧角色脚底严格落在相同的y坐标上（画布底部上移20px处）。

  【动作连贯】
  仅腿部手臂随帧变化，上半身和头部位置完全稳定不偏移。
  每帧角色中心x坐标完全一致，合成GIF后无横向抖动。
  行走帧脚底不滑动，步幅均匀。

  【背景颜色】
  整个画布底色为纯品红色（#FF00FF），平整单一颜色，无渐变。
  每帧严格限制在各自的256px竖条内，不跨越边界。

  【禁止】
  角色变形、细长条填满格子、位置偏移、脚底不齐。
  残影、白色像素、水印、编号、文字标记。
  不同帧之间角色外观不一致。
  角色颜色与背景品红色（#FF00FF）混淆。

variables:
  character_name: "必填"
  character_appearance: "必填"
  direction_label: "右/左/上/下"
