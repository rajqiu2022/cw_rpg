# 主角 Field 向下（正面朝镜头）行走 4 帧强关键姿态 strip
# 目标：先做清楚 4 个关键姿态，不追求 8 帧插补；正面方向必须读出前后脚步幅。

id: sprite_protagonist_walk_down_4f_strong_keypose
description: Field 用向下行走 4 帧强关键姿态 strip（正面，强调脚步前后深度和衣摆节奏）
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_right_8f_stable_from_4f.png"
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_down_8f_play.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 参考图 1 是当前通过目视验收的右走 8 帧，用于学习“接触帧 / 中立帧轮廓差明显”的行走节奏和角色一致性。
  - 参考图 2 是旧下走 8 帧，用于学习正面朝镜头的方向感，但不要复制它的放大比例、脚下阴影或任何多余线条。
  - 本次不是把旧下走 8 帧压缩，也不是从弱 4 帧插补；本次要重新画 **4 个更清楚的正面行走关键姿态**。

  【输出目标】
  - 一张 **单行 4 格** 向下（角色正面朝向镜头、相对玩家向下走）sprite strip，画布 **1024×1024**。
  - 隐形网格：4 列 × 1 行；每格约 256×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，四格保持同一脚底基线；背景纯白 #FFFFFF。
  - 无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：强 key pose，不要过度稳定】
  - 这次宁可动作读得清，也不要做成 4 格几乎一样的站桩。
  - contact 帧和 passing 帧必须有明显轮廓差：脚、袍摆、手臂、剑/酒葫芦的相对位置要能读出节奏。
  - 头部、脸型、发束、腰带高度和整体大小保持稳定；但腿部、袍摆、手臂允许有清楚的步态变化。
  - 禁止把四帧画得几乎同宽、几乎同姿态；避免“原地抖脚”。

  【对齐硬要求】
  - 4 格脚底基线一致：支撑脚鞋底压在同一条不可见水平线。
  - 4 格角色身体中心在各自格子的水平中心；头顶高度变化不超过 4 px。
  - 剑、衣摆、头发不要跨进相邻格；每格都能单独裁切。

  【向下 4 帧循环，相位必须清楚】
  - 角色视角：正面朝向镜头。能看到脸、胸口、白色中衣、腰带、剑柄和青瓷酒葫芦。
  - 第 1 格 / contact A：左脚向画面下方明显踏出，鞋尖更靠近观众；右脚在身体后方、部分被袍摆遮住。右臂略向前，左臂略向后，袍摆向玩家视角右侧打开。
  - 第 2 格 / passing A：双脚接近身体正下方，一只脚抬起经过中线；身体直立，轮廓比 contact 帧更窄。
  - 第 3 格 / contact B：右脚向画面下方明显踏出，鞋尖更靠近观众；左脚在身体后方。与第 1 格左右腿对调，手臂反向摆动，袍摆向玩家视角左侧打开。
  - 第 4 格 / passing B：双脚接近身体正下方，另一只脚抬起经过中线；轮廓接近第 2 格但不要完全复制，可有反向衣摆细节。
  - 播放顺序为 1 → 2 → 3 → 4 → 1。第 4 格必须自然接回第 1 格。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 4 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。
  - 剑和青瓷酒葫芦在所有帧中位置稳定，可轻微摆动，但不要忽然换边、消失或变色。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止四帧几乎一样。
  - 禁止变成侧向或背向；本图必须是正面朝镜头。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
