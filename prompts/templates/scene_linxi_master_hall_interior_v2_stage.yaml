identity_anchor: |
  90年代港漫风武侠 RPG 的 2.5D 预渲染室内场景，手绘厚涂、清晰墨线、冷灰石墙与深色木材，比例真实统一。

prompt_template: |
  {style_anchor}

  生成一张《云影侠传》正式可玩场景背景：林西村打铁师傅的正式室内大厅。
  参考图只用于继承“中间小型房屋舞台、四周纯黑留白、家具比例和无框出口”的构图规范，不能复制主角卧室家具。

  画布：1536x1024 横版。房屋室内主体只占画面中央约 68% 宽、62% 高，四周保留干净纯黑留白；不是满屏背景，不要把房间放大填满窗口。
  房间：比主角卧室更大、更正式的师傅教学与锻造大厅，木梁、冷灰石墙、深色木地板，中央留出连续可行走空地。
  左侧：小型武器架，陈列两三把朴素兵器；后侧：简洁锻造工作台和冷却铁盆，但不要火焰遮住道路。
  右侧：茶桌与两张小凳、书案和几卷秘籍；墙边可有少量挂具。所有家具小巧，和主角精灵的 140px 有效身高匹配，不要巨大家具。
  底部中央只留一个小型无框出口缺口，用连续地板自然过渡；不要门框、门柱、横梁、大门、台阶、庭院、草地、房屋外部或外部天光。
  不要人物、NPC、立绘、头像、文字、招牌、UI、图标、水印、拼接痕迹。房间要像一张完整自然的游戏背景，不是素材图集。
  光线柔和明亮，保留冷灰与木色层次，避免过暗、过饱和、橙色主导；边缘黑底必须平整干净。

  反向约束：{negative}

