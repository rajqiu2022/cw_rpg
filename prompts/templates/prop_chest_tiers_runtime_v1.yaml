id: prop_chest_tiers_runtime_v1
description: Three independently sliceable RPG chest tiers for field interactions.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production source sheet containing exactly three separate closed treasure chests for a Chinese wuxia 2.5D RPG. Use hand-painted Hong Kong comic game rendering, crisp dark ink contours, a high three-quarter view, warm upper-right light, and consistent camera scale. Every chest must be fully visible with a flat, readable foot base.

  Arrange exactly one chest in each of three equal vertical columns, centered with generous empty space between silhouettes. Left: a normal chest, aged dark elm wood, simple black iron straps, modest and practical. Center: an advanced chest, deep red-brown lacquered wood, worn bronze fittings, a subtle engraved metal lock, refined but not glowing. Right: a rare chest, dark indigo lacquer and jade-green inset panels, gold filigree corner guards, a very restrained cool cyan seam glow, valuable but still grounded in wuxia craft.

  Use one perfectly flat solid #FF00FF chroma-key background only. No floor plane, cast shadow, reflections, words, labels, rarity text, UI frames, people, animals, weapons, coins, open lids, extra props, watermark, or borders. This is a source sheet to be sliced into three transparent runtime PNGs.
