# 主角 idle 待机 6 帧 strip（v5 参考图锁定外观版）
# 用右走 v2 的 passing 帧作为外观基准，ALAPI 会把参考图 base64 传进 generations。
# 目标：角色外观与参考图一致，仅改站姿 + 加风动。

id: sprite_protagonist_idle_wind_6f_v5
description: Field 用 idle 待机 6 帧 strip，参考图锁定外观，仅改站姿加风动
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/raw/sprite/v3/ref_walk_right_v2_frame2.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图最高优先】
  - 参考图是你需要画的角色的**精确外观参考**。
  - **角色外观（脸型、五官、发型、发带、刘海、布袍颜色灰度、白色中衣、青瓷酒葫芦、长剑、深色短靴、身高体型）必须与参考图完全相同。**
  - 你只需要做两件事：①把行走姿势改成静止站立、②加入风吹衣发的微动。
  - **不要重新设计角色外观。不要改变衣服颜色。不要改变发型。不要改变酒葫芦或剑的形状位置。**

  【输出格式】
  - 一张 **单行 6 格** idle sprite strip，画布 **1024×1024**。
  - 6 列 × 1 行；每格约 170×1024。
  - 背景纯白 #FFFFFF。无文字无标题无网格无 UI 无水印。
  - 角色在画布上的总高度（脚到头顶像素数）必须与参考图一致。

  【视角】
  {{facing_desc}}

  【静止站立】
  - 角色从行走改为**完全静止站立**，双脚并拢或微微分开，稳稳站在地上。
  - 6 帧中脚位完全固定、不迈步、不换脚、不移动。
  - 身体躯干、头部、腰带在 6 帧中绝对稳定，不左右晃不上下跳。
  - 手臂自然垂于身侧或轻扶剑柄，保持同一姿势。

  【风吹微动（可见但自然）】
  - 轻风吹过，以下元素有微小但**肉眼可辨**的位移：
    - 脑后发带尾端左右轻摆 6～12 px
    - 几缕散发微微拂动 4～8 px
    - 袍摆下缘随微风上下轻扬 4～8 px
    - 袖口边缘轻拂 3～6 px
    - 腰带末端微晃 2～5 px
  - 不是大风猛吹，是山间轻风，自然不做作。
  - 6 帧风动相位均匀分布，形成无缝循环。

  【6 帧循环】
  第 1 格：风初起，发带微扬
  第 2 格：风稍强，发带扬到半高，袍摆轻抬
  第 3 格：风最强，发带最高，袍摆最开
  第 4 格：风渐弱，发带回落
  第 5 格：风更弱，发带近垂，袍摆近静
  第 6 格：风最弱，接近第 1 格初始状态，无缝衔接

  【角色外观硬锁】
  {identity_anchor}
  - 全部 6 格同一人：脸、发型、布袍灰度冷色调、酒葫芦、剑与参考图完全一致。
  - 外衣中偏深冷灰粗布长袍；内衬白色；腰带近黑褐；酒葫芦青瓷灰绿；鞋深色短靴。
  - **禁止头巾、额带、红发带、头顶绑布。**
  - **禁止某帧衣服颜色变浅、变蓝、变紫、变棕。**

  【风格】港漫厚涂 2.5D 简化 sprite，轮廓线清楚。非战斗姿态。

  【禁忌】
  - 禁止蜘蛛蛛网；禁止文字繁体字标签签名水印。
  - 禁止头巾额带红发带；禁止蓝衣红衣。
  - 禁止双脚移动迈步换脚。
  - 禁止身体左右摇晃上下跳动。
  - 禁止完全静止无风动。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  facing_desc: "必填：视角方向描述"
