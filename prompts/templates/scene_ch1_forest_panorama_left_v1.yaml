id: scene_ch1_forest_panorama_left_v1
description: Left panel of the first chapter's scrollable bamboo forest map.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 left-hand panel for a scrollable Chinese wuxia RPG bamboo forest. It is a hand-painted comic 2.5D gameplay map in high three-quarter view, with precise ink outlines, dense deep-green bamboo, mossy gray stone, pale dirt, damp leaf litter, and a calm overcast afternoon. The aesthetic must be readable for RPG navigation, not a cinematic splash image.

  Composition: an open trail enters from the lower-left, becomes a broad continuous 210-pixel-wide dirt-and-stone path through the center, passes a small empty clearing suitable for a future battle, and heads to the right edge through bamboo and broken stone walls. The upper-left may show a partial distant abandoned courtyard wall, but no roof can obscure the path. Create a shaded bamboo-and-rock seam zone across the rightmost 12 percent that will join a second panel. Keep low grass and stones at the path edge, with clear feet-level collision landmarks.

  Base scenery only: no people, NPCs, animals, enemies, corpses, chests, tablets, torches, signs, writing, readable text, UI, arrows, watermark, statues, or loose props. No excessive fog, no dark unreadable route, no blocked path, no tile grid, no collage.
