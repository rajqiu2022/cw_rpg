# 主角 Field 向右行走 4 帧稳定循环 strip
# 目标不是追求复杂 8 帧，而是先得到游戏可用、少抖动的经典 RPG 4 帧循环。

id: sprite_protagonist_walk_right_4f_stable_strip
description: Field 用向右行走 4 帧稳定循环 strip（左脚前 / 中立 / 右脚前 / 中立）
quality: medium
size: "1024x1024"

reference_images:
  - "C:/Users/rajqiu/.cursor/projects/f-Code-RPG-GAME/assets/c__Users_rajqiu_AppData_Roaming_Cursor_User_workspaceStorage_d8451740145b37dfe4633684e350af4b_images_image-de2e0dd6-c5f2-458b-a9f8-bc6409c5ad15.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图只用于理解传统武侠 RPG sprite 的小人比例、行走节奏、帧表排布。
  - 不要照抄参考图人物、蓝衣、文字标签、深色背景、色板、边框或 UI。

  【输出目标】
  - 一张 **单行 4 格** 向右行走 sprite strip，画布 **1024×1024**。
  - 隐形网格：4 列 × 1 行；每格约 256×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，四格保持同一脚底基线；上方留白可以很多，但不要画额外内容。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：宁可简单，也要稳定】
  - 这是经典 RPG 4 帧循环，不是电影级 8 帧动画。
  - 4 帧必须像同一个角色的连续动作，不能像 4 张重新绘制的插画。
  - 头部、脸型、发束、上半身、腰带、剑、酒葫芦的位置必须高度稳定。
  - 只允许腿部前后切换、手臂轻微摆动、衣摆少量跟随；不要每帧大幅重画衣摆、头发或武器。
  - 腰线和头顶高度几乎不变；角色身体中心不左右漂移。

  【对齐硬要求】
  - 4 格脚底基线完全一致：支撑脚鞋底都压在同一条不可见水平线。
  - 4 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 4 px；腰带高度变化不超过 3 px。
  - 剑、衣摆、头发不要跨进相邻格；每格都能单独裁切。

  【向右 4 帧循环，相位必须简单清楚】
  - 第 1 格 / 帧1 left step：左脚在前方（画面右侧）踏出，右脚在后方；步幅适中，不要夸张大跨步。
  - 第 2 格 / 帧2 neutral passing：双脚接近身体正下方，身体直立，中立过渡姿态；这是第 1 到第 3 的中间帧。
  - 第 3 格 / 帧3 right step：右脚在前方（画面右侧）踏出，左脚在后方；与第 1 格左右腿对调。
  - 第 4 格 / 帧4 neutral passing：双脚接近身体正下方，姿态接近第 2 格，可有极小衣摆差异；这是第 3 回到第 1 的中间帧。
  - 播放顺序为 1 → 2 → 3 → 4 → 1。第 4 格必须自然接回第 1 格，不要突然跳成大跨步。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 4 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。
  - 剑和青瓷酒葫芦在所有帧中位置稳定，不要忽然换边、消失或变色。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止每帧衣服/头发/剑大幅漂移。
  - 禁止 45° 等距地砖透视；本图是正交侧向 field sprite。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
