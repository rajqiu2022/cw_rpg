id: scene_battle_arena
description: 回合制战斗舞台背景
quality: high
size: "1536x1024"

prompt_template: |
  {style_anchor}

  生成一张用于 2.5D 回合制武侠 RPG 的战斗舞台背景图。
  场景：竹林边缘的开阔黄土战场。
  构图：横版 16:9，镜头略微俯视，中央和下方是宽阔平整的空地，
  左下与右上分别留出清晰、无遮挡的角色站位区域，形成对角线对峙空间；
  背景远处有稀疏翠竹、低矮山岭和明亮天空，边缘景物用于烘托空间，不要挤入中央战场。

  画面要求：
  - 1536×1024 横版，适合游戏背景完整铺满屏幕
  - 90 年代港式武侠漫画 2.5D 厚涂质感，墨线清楚，色彩明亮通透
  - 中央战场必须平整、空旷、没有建筑、石碑、旗帜或大型道具
  - 只画环境，不出现任何人物、NPC、敌兵、动物或角色剪影
  - 不要文字、招牌、UI、按钮、边框、标记、水印、英文
  - 不要强烈闪电、烟雾遮挡、过暗夜景或海报式主体构图

  反向：{negative}

variables:
  unused: ""
