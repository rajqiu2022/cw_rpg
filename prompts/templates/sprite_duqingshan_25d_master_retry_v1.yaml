prompt_template: |
  Create exactly one square sprite atlas for Du Qingshan, the game's blacksmith. He is one Chinese man in his late thirties: broad square face, sun-browned skin, thick eyebrows, black hair tied in a short work topknot, sturdy muscular arms and a friendly confident expression. He wears an open dark-teal sleeveless work vest over a faded grey shirt, a blue-purple cloth over one shoulder, leather smithing apron, wide work belt and heavy dark boots. A compact blacksmith hammer hangs at his belt. He has no sword, no shield, no armor, no cape, no red assassin robe, no chibi proportions.

  Render as a premium 2.5D Chinese wuxia RPG field sprite: medium adult body proportions matching a 160-pixel-tall protagonist, warm upper-left light, cool ambient fill, subtle painted volume, matte cloth/leather, clean comic ink contour.

  The delivered image must contain only a 4 by 4 atlas on a flat #ff00ff chroma-key background: row 1 front/down, row 2 back/up, row 3 right, row 4 left; columns 1-4 are neutral planted stance, left step, passing stance, right step. Every full body must be complete, equally sized, centered in its own cell with matching feet baseline and blank lower margin. No grid, text, labels, UI, document, character sheet, scenery, floor, cast shadow, border, duplicate weapons, extra limbs, cropped figures or overlap between cells.
