prompt_template: |
  Use the supplied image as the strict adjoining-left-panel reference. Create ONE native 1536x1024 right-hand continuation panel for the same sunlit bamboo mountain road map. Match its high three-quarter camera, painted inked wuxia RPG style, warm upper-right light, ochre rock, bamboo density, road color, and scale.

  At the far left edge, continue the road entering from the reference's upper-right route through a bamboo-and-rock transition. The road then opens into a broad, flat, empty ambush clearing in the middle, with clear ground for visible enemies and battle trigger placement. Continue the route diagonally toward the upper-right into a distant bamboo village gate and the exit to Zhuwei Village. Use cliffs, bamboo groves, fences, and rocks only at the walkable lane edges.

  This is gameplay scenery: no characters, NPCs, corpses, stone tablets, chests, text, readable signs, UI, watermark, arrows, or oversized roof/rock covering the path. Keep a continuously walkable 220-pixel-wide route from the left seam through the clearing to the upper-right exit.
