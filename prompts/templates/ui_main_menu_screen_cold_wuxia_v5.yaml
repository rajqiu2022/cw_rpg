id: ui_main_menu_screen_cold_wuxia_v5
description: 冷色玄铁武侠主菜单完整界面，加入深竹绿与暗酒红点缀
quality: high
size: "1536x1024"

identity_anchor: |
  《云影侠传》正式主菜单界面，美术风格参考冷色玄铁武侠 UI atlas，
  主色为深墨蓝、玄铁黑、冷钢蓝、霜蓝高光，
  辅以深竹绿、墨玉绿、暗酒红、旧血红作小面积点缀，
  港漫厚涂质感，墨线清晰，云纹暗刻、竹影、山雨寒雾。

reference_images:
  - "assets/raw/ui/cold_wuxia/v1/ui_cold_wuxia_battle_hud_v1.png"
  - "assets/raw/character/v2/portrait_lengguyun_neutral.png"
  - "assets/raw/character/v2/portrait_yuewuxing_meeting.png"

prompt_template: |
  {{identity_anchor}}

  生成一张完整的 RPG 游戏主菜单界面，不是 UI 组件拆分图，也不是临时排版图。
  画面必须是原创设计，只参考冷色玄铁边框、面板材质、云纹暗刻、寒玉装饰和整体武侠 UI 质感，不能照抄参考图布局。

  必须出现的文字：
  - 顶部主标题：{{game_title}}
  - 三个主菜单按钮：新游戏、读取存档、离开

  色彩要求：
  - 整体亮度比当前 v5 方向提高约 20%，保留冷色玄铁质感但避免过暗。
  - 主色仍为冷色玄铁：深墨蓝、冷钢蓝、霜蓝高光。
  - 加入小面积深绿色：竹影、墨玉扣、青绿色内光、按钮边缘冷绿反光。

  - 加入小面积深红色：暗酒红布纹、旧血红状态光、牌匾边角红玉扣。
  - 深绿和深红只做层次点缀，不要变成喜庆红金，也不要变成鲜艳霓虹。
  - 整体仍需庄重、冷峻、有江湖气。

  构图要求：
  - 1536×1024 横版完整主界面。
  - 顶部中央是庄重的玄铁牌匾，显示“{{game_title}}”。
  - 画面中央偏左或中央下方为三个竖向排列的大按钮，按钮文字依次为：新游戏、读取存档、离开。
  - 按钮采用参考图中的玄铁边框风格：冷钢蓝边、深墨蓝内底、寒玉扣、云纹角花；按钮 hover 感可用深竹绿冷光，危险/离开按钮可用暗酒红边缘点缀。
  - 背景是冷色武侠江湖：夜色竹林、山雨薄雾、远山、石阶、寒光，竹叶可带深绿色层次。
  - 画面可出现 2 名武侠角色作为氛围剪影或半身视觉：主角冷峻不羁，侠女清冷坚毅；角色不要挡住按钮文字。
  - 整体要像可发布游戏主界面，庄重、冷峻、有江湖感。

  严格限制：
  - 除“{{game_title}}”“新游戏”“读取存档”“离开”外，不要出现其他文字。
  - 中文必须是简体中文，文字清晰可读，不要繁体、乱码、错字。
  - 不要现代网页 UI，不要科幻霓虹，不要西幻魔法阵，不要暖金主色，不要喜庆大红。
  - 不要白底组件 atlas，不要把多个控件散放在白色背景上。

  反向：英文文字，Latin letters，繁体字，乱码，错字，水印，签名，现代网页，扁平化商务 UI，赛博霓虹，西幻，魔法阵，白底组件图，临时 wireframe，低保真 mockup，橙黄色主色，喜庆红色，鲜艳大红，亮绿色霓虹。

variables:
  game_title: "云影侠传"
