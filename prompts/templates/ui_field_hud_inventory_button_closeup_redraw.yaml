id: ui_field_hud_inventory_button_closeup_redraw
description: 严格参考近景背包按钮，重绘同款 HUD 按钮候选
quality: high
size: "1024x1024"

identity_anchor: |
  《云影侠传》游戏主界面右侧 HUD 背包按钮重绘。
  唯一视觉目标是参考图 `hud_inventory_button_closeup_ref.png`：
  手绘厚涂质感、蓝灰玄铁底框、柔边双层描边、左侧白布袋图标、右侧米白书法字“背包”。

reference_images:
  - "assets/raw/ui/field_hud/reference/hud_inventory_button_closeup_ref.png"

prompt_template: |
  {{identity_anchor}}

  请基于参考图重新绘制一枚同款“背包”按钮。必须是重新绘制，不是直接裁切参考图。

  必须严格贴近参考图：
  - 单枚横向按钮，居中摆放，宽高比例接近参考图。
  - 蓝灰色低饱和底框，厚涂手绘质感，边框有柔和磨损和暗部渐变。
  - 外轮廓：左侧斜切与小装饰角，右侧尖角牌形，双层描边，不要简化成硬边矢量图。
  - 左侧图标：白色布袋，圆润，有上方束口和黑褐色绳结，不能太简陋。
  - 右侧文字：只允许简体中文“背包”，米白色书法/毛笔感，带深色柔影；不要金色字，不要现代字体。
  - 整体清晰度、质感、边框厚度、图标体积、文字位置都要尽量和参考图一致。
  - 背景可以是纯黑、纯白或透明感单色背景，方便后处理抠透明；不能出现场景背景、其他按钮、红点。

  严格禁止：
  - 禁止首界面按钮风格，禁止金色大字，禁止宝石金属主菜单边框。
  - 禁止硬边矢量图、扁平网页按钮、科幻发光按钮。
  - 禁止英文、拉丁字母、乱码、错字、繁体字、水印、签名。
  - 禁止把“背包”写成其他字。

  反向：{negative}

variables:
  variant: "候选编号"
