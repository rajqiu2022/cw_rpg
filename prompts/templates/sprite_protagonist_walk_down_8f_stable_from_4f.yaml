# 主角 Field 向下（正面朝镜头）行走 8 帧稳定循环 strip
# 基于已通过的下走 4 帧候选扩展：保留关键姿态，只补中间过渡帧。

id: sprite_protagonist_walk_down_8f_stable_from_4f
description: Field 用向下行走 8 帧稳定循环 strip（以 4 帧正面候选为参考插补过渡帧）
quality: medium
size: "1536x1024"

reference_images:
  - "F:/Code/RPG_GAME/assets/processed/sprite/sprite_lengguyun_walk_down_4f_sheet_play.png"
require_reference_images: true

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  角色唯一权威：冷灰布袍、白色中衣、腰侧青瓷酒葫芦、腰间长剑、黑发束在脑后。
  禁止头巾、额带、红头绳、发箍、头顶布条；只能有脑后简素深色发带。

prompt_template: |
  {style_anchor}

  【参考图用途】
  - 上传参考图是已验收的 **下走 4 帧正面候选**，必须作为角色外观、体块、脚底基线、剑和酒葫芦位置的权威参考。
  - 本次任务是把这套 4 帧扩展成 8 帧：保留关键姿态，在它们之间插入过渡帧。
  - 不要重新设计角色；不要改变衣服颜色、发型、剑、酒葫芦、脸型或身高比例。

  【输出目标】
  - 一张 **单行 8 格** 向下（角色正面朝向镜头、相对玩家向下走）sprite strip，画布 **1536×1024**。
  - 隐形网格：8 列 × 1 行；每格约 192×1024；每帧角色位于格子水平中心。
  - 角色只占画布中下部区域，八格保持同一脚底基线；上方留白可以很多，但不要画额外内容。
  - 背景纯白 #FFFFFF；无文字、无标题、无色板、无可见网格线、无 UI、无水印。
  - 每个小人高度约 **72～96 px**，是游戏 field sprite，不是大立绘。

  【核心目标：从 4 帧正面候选插补，不要重新重画】
  - 参考图中的第 1 / 2 / 3 / 4 个姿态分别对应本图的第 1 / 3 / 5 / 7 帧。
  - 第 2 / 4 / 6 / 8 帧是中间过渡帧，只做小幅腿部和手臂变化。
  - 头部、脸型、发束、上半身、腰带、剑、酒葫芦的位置必须高度稳定。
  - 只允许腿部前后切换、手臂轻微摆动、衣摆少量跟随；不要每帧大幅重画衣摆、头发或武器。
  - 腰线和头顶高度几乎不变；角色身体中心不左右漂移。

  【对齐硬要求】
  - 8 格脚底基线完全一致：支撑脚鞋底都压在同一条不可见水平线。
  - 8 格角色身体中心在各自格子的水平中心；角色大小一致。
  - 头顶高度变化不超过 4 px；腰带高度变化不超过 3 px。
  - 剑、衣摆、头发不要跨进相邻格；每格都能单独裁切。

  【向下 8 帧循环，相位必须均匀】
  - 角色视角：正面朝向镜头。脸、胸口、白色中衣、腰带、酒葫芦、剑柄都朝向画面外。
  - 第 1 格：左脚向画面下方/前方踏出，右脚在身后；与参考图第 1 格基本一致。
  - 第 2 格：第 1 到第 3 的过渡；左脚承重，右脚开始抬起，身体仍稳定。
  - 第 3 格：中立 passing，双脚接近身体正下方；与参考图第 2 格基本一致。
  - 第 4 格：第 3 到第 5 的过渡；右脚向画面下方/前方摆出，左脚开始后移。
  - 第 5 格：右脚向画面下方/前方踏出，左脚在身后；与参考图第 3 格基本一致。
  - 第 6 格：第 5 到第 7 的过渡；右脚承重，左脚开始抬起，身体仍稳定。
  - 第 7 格：中立 passing，双脚接近身体正下方；与参考图第 4 格基本一致。
  - 第 8 格：第 7 回到第 1 的过渡；左脚向画面下方/前方摆出，即将回到第 1 格。
  - 播放顺序为 1 → 2 → 3 → 4 → 5 → 6 → 7 → 8 → 1。

  【角色一致性硬锁】
  {identity_anchor}
  - 全部 8 格必须是同一人：同一脸型、同一发型、同一衣袍颜色、同一酒葫芦与剑的位置关系。
  - 外衣统一为 **中偏深冷灰粗布长袍**，禁止某帧变浅灰、蓝衣、紫灰、棕袍或黑袍。
  - 内衬统一为白色；腰带近黑褐；酒葫芦统一为青瓷灰绿；鞋统一为深色短靴。
  - 黑发束脑后，只有简素深色发带；**禁止头巾、额带、红发带、头顶绑布**。
  - 剑和青瓷酒葫芦在所有帧中位置稳定，不要忽然换边、消失或变色。

  【风格】
  - 港漫厚涂 2.5D 但简化到小人 sprite，轮廓线清楚，腿部动作读得清。
  - 不要大立绘、不要电影海报感、不要每格重画成不同角色。

  【禁忌】
  - 禁止蜘蛛、蛛网；禁止文字、繁体字、标签、签名、水印。
  - 禁止头巾/额带；禁止蓝色侠客服；禁止站桩不动；禁止每帧衣服/头发/剑大幅漂移。
  - 禁止变成侧向或背向；本图必须是正面朝镜头。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
