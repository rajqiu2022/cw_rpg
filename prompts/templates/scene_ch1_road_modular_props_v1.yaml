id: scene_ch1_road_modular_props_v1
description: Review sheet for independently placeable first chapter mountain road props.
quality: high
size: "1536x1024"

prompt_template: |
  Create a 1536x1024 production review sheet containing exactly six separated, full-color 2.5D wuxia RPG environment props for a bamboo mountain road. Use a high three-quarter view, hand-painted comic rendering, crisp ink outlines, sunlit pale dirt, gray stone, aged timber and muted green bamboo, with warm daylight from upper right.

  Arrange six complete isolated props in a clean 3 by 2 grid, leaving at least 120 pixels of flat empty background between each silhouette: (1) a short blank weathered roadside stone tablet with no carved writing, (2) a low broken wooden barricade, (3) a small scatter of abandoned broken spear shafts and sheathed weapons, (4) a closed travel supply chest, (5) a dense bamboo-and-rock seam occluder cluster, and (6) a low milestone rock with no symbols. Every object must have a clear, readable base for independent foot collision or interaction placement.

  Use a perfectly flat solid #FF00FF chroma-key background only: no ground plane, cast shadows, gradients, labels, dividers, UI frames, people, animals, enemies, corpses, words, symbols, readable writing, watermark, or extra objects. This is a source sheet for manual review and later separation, not a finished scene.
