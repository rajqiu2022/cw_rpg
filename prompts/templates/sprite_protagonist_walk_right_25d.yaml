id: sprite_protagonist_walk_right_25d
description: 主角右向行走动画帧，8帧循环，高品
quality: high
size: "1024x1024"

identity_anchor: |
  {{character_name}}，{{character_appearance}}，
  与参考图保持完全一致的脸型、五官、发型、服装、武器、酒葫芦。

reference_images:
  - "assets/_style_bible/00_protagonist_portrait_ref.png"

prompt_template: |
  {style_anchor}

  游戏角色行走动画帧（walk frame），用于 2D RPG 精灵图。

  角色：{identity_anchor}

  姿态：朝右行走，第 {{frame_index}} 帧（共 8 帧循环）
  - {{leg_phase}}
  - 武侠轻快步伐，手臂自然摆动，左手扶剑鞘
  - 衣摆和披风随步伐轻微飘动

  构图：
  - 1024×1024，角色高度占画布 50%~55%，水平居中
  - 朝画幅右侧，纯白背景 #FFFFFF
  - 双脚在画布底部约 10% 处

  反向：{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  frame_index: "1|2|3|4|5|6|7|8"
  leg_phase: "必填"
