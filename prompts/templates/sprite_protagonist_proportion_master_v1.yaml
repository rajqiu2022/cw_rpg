id: sprite_protagonist_proportion_master_v1
description: Unified full-body protagonist proportion and directional reference board.
quality: medium
size: "1024x1024"

reference_images:
  - "F:/Code/RPG_GAME/game/art/characters/protagonist_portrait.png"
require_reference_images: true

prompt_template: |
  Use the supplied portrait only for identity: same face, black tied hair, dark blue-grey cross-collar robe, leather chest strap, dark boots, sword, and a single small grey-green double-lobed wine gourd at the left belt.

  Create one clean 1024x1024 RPG character proportion reference board with eight isolated full-body views in a 2 by 4 layout, pure white background, no text or labels. Top row: calm standing down, standing up, standing right, standing left. Bottom row: right-facing walk contact, right-facing passing, left-facing walk contact, left-facing passing.

  The character must use exactly the same balanced body standard in all eight views: approximately seven heads tall, medium athletic build, moderate shoulder width, neither thin and tall nor short and stocky. Robe hem falls to mid-calf, boots are compact, head size is consistent, and the wine gourd remains visible. Game sprite proportions, not portrait anatomy. Hong Kong wuxia comic ink style. No crop, shadow, grid, duplicate, motion trail, exaggerated heroic legs, or chibi body.
  Avoid: {negative}

variables: {}
