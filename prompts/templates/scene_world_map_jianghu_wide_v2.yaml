id: scene_world_map_jianghu_wide_v2
description: High-resolution capability test and candidate for the world travel map.
quality: high
size: "2048x1152"

prompt_template: |
  Create one complete high-resolution world travel map for a Chinese wuxia single-player RPG, viewed from a high three-quarter illustrated atlas perspective. This is a strategic overworld, not a local town scene: broad readable dirt roads connect separate landmark regions and leave clear road corridors for a small walking player.

  Composition: an inland bamboo village in the southwest, a large walled river city in the east-central plain, a high northern mountain sect, a distant western sword mountain, a misty southern mountain range, a moonlit lake settlement in the northeast, and a blue eastern coastline with a small island. Rivers, bridges, mountain ridges, bamboo groves, farmland and roads must connect naturally. Keep settlements and landmarks separated by open traversable terrain. The top and bottom edges must contain playable terrain rather than a parchment border.

  Style: refined hand-painted 2.5D Chinese martial-arts game map, dark controlled ink contours, restrained jade green, stone gray, earth ochre and river blue, clear sunny daylight, coherent scale, professional game production art.

  No people, NPCs, animals, text, labels, UI, arrows, markers, readable signs, parchment border, compass, watermark, duplicate landmarks, collage panels, or cut-off roads.
