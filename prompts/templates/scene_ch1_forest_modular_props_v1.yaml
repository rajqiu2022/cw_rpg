id: scene_ch1_forest_modular_props_v1
description: Review sheet for independently placeable first chapter bamboo forest props.
quality: high
size: "1536x1024"

prompt_template: |
  Create a 1536x1024 production review sheet containing exactly six separated, full-color 2.5D wuxia RPG props for a dark bamboo forest. Use a high three-quarter view, hand-painted comic rendering, crisp ink outlines, cool mossy stone, aged wood, damp dark-green bamboo, and overcast forest lighting from upper right.

  Arrange six complete isolated props in a clean 3 by 2 grid, leaving at least 120 pixels of flat empty background between each silhouette: (1) a low circular mossy stone altar with no markings, (2) a closed weathered wooden chest, (3) the same chest opened and empty, (4) a broken stone courtyard wall corner, (5) a dense bamboo-and-rock foreground occluder cluster, and (6) a fallen mossy tree trunk lying diagonally. Each object must have clearly readable feet/base suitable for a separate collision footprint.

  Use a perfectly flat solid #FF00FF chroma-key background only: no ground plane, cast shadows, gradients, labels, dividers, UI frames, people, animals, enemies, corpses, words, symbols, readable writing, watermark, or extra objects. This is a source sheet for manual review and later separation, not a finished scene.
