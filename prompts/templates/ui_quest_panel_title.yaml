id: ui_quest_panel_title
description: 任务面板标题匾额—玄铁厚涂，匹配底图风格
model: gpt-image-2
size: "1024x1024"
quality: high
skip: false
priority: 1

identity_anchor: |
  《云影侠传》UI标题匾额。寒山玄铁冷色风格。
  深墨蓝+玄铁底、冷钢蓝边框、祥云纹角花。
  港漫厚涂暗调，与面板底图完全一致。

reference_images:
  - "game/art/ui/equipment/panel_bg.png"

prompt_template: |
  {{identity_anchor}}
  
  生成一个任务面板的横向标题匾额装饰。
  
  规格：
  - 横向宽幅匾额，长宽比约 4:1 到 5:1
  - 深墨蓝玄铁底，与参考图底图材质一致
  - 冷钢蓝色边框，边框两端或四角有小型云纹/卷轴纹装饰
  - 中央大面积留空（后续叠加文字）
  - 不要任何文字、数字、符号
  - 纯白背景，匾额居中偏上放置
  
  输出：横向匾额装饰，独立控件。

variables: {}
