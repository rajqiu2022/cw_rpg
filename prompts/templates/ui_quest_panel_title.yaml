id: ui_quest_panel_title
description: 任务面板标题匾额，匹配装备面板冷钢厚涂风格
model: gpt-image-2
size: "1024x1024"
quality: high
skip: false
priority: 1

identity_anchor: |
  《云影侠传》任务卷宗标题匾额，2.5D武侠AVG-RPG，寒山玄铁冷色风格。
  风格必须与装备面板（game/art/ui/equipment/panel_bg.png）完全一致。

reference_images:
  - "game/art/ui/equipment/panel_bg.png"

prompt_template: |
  {{identity_anchor}}

  生成一个任务卷宗面板的标题匾额装饰。

  设计要求：
  - 横向匾额形态，比例约 4:1
  - 深墨蓝+玄铁底、冷钢蓝边框、两边有祥云纹或卷轴纹装饰
  - 中央留空区域放置标题文字（不要在画面上生成任何文字！）
  - 与装备面板背景保持一致的色调和材质质感
  - 单独一个匾额装饰，不要放在面板里

  输出：一个独立的横向匾额装饰，居中摆放，透明底或纯色底都可以。

variables: {}
