id: ui_field_hud_skill_frame_textless
description: 以已确认武学按钮为标本，重绘无图标无文字的 HUD 右侧按钮底框
quality: high
size: "1024x1024"

identity_anchor: |
  《云影侠传》游戏主界面右侧 HUD 功能按钮底框。
  这是按钮生产管线的可复用“底图层”，后续图标和中文文字会单独叠加。

reference_images:
  - "game/art/ui/field_hud/v1/hud_btn_skill_normal.png"

prompt_template: |
  {{identity_anchor}}

  请严格参考给定“武学”按钮，只重绘一枚同样轮廓、同样比例、同样材质的空白按钮底框。

  必须做到：
  - 只保留按钮底框、内板、边框、磨损、暗部渐变和厚涂材质。
  - 外轮廓必须和参考武学按钮一致：左侧斜切装饰、右侧尖角牌形、蓝灰玄铁双层描边。
  - 不要任何左侧图标，不要书本，不要齿轮，不要卷轴，不要袋子。
  - 不要任何文字，不要中文，不要英文，不要假字，不要水印。
  - 中间内板要干净，可用于后续叠加图标和文字，但仍保留自然手绘纹理。
  - 单枚横向按钮居中摆放，背景用纯黑、纯白或透明感单色背景，方便后处理抠透明。

  严格禁止：
  - 禁止改变按钮比例和外轮廓。
  - 禁止科幻硬边、网页按钮、金色主菜单按钮风格。
  - 禁止出现任何文字、图标、场景背景、签名、水印。

  反向：{negative}

variables:
  variant: "A"
