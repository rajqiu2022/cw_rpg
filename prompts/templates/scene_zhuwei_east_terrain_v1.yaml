id: scene_zhuwei_east_terrain_v1
description: East terrain base for Zhuwei Village expandable map.
quality: high
size: "1536x1024"
prompt_template: |
  Create ONE native 1536x1024 terrain-only eastern panel for a playable Chinese wuxia RPG village, with the same elevated three-quarter 2.5D camera, warm late-morning light, pale irregular stone paving and earthy grass detail as a matching terrain connector panel.

  A broad pale stone road enters at the full left edge through the middle, stays 420 to 520 pixels wide across the panel, then curves gently toward a clear lower-right continuation. The full leftmost 300 pixels are only continuous road, compacted dirt, low grass and soft bamboo-leaf shadow: no buildings, stairs, trees, fences, posts, water, gates, doors, props or landmarks. The central route remains clear. Only around the top and far right edges use sparse low terrain details, shallow weed clusters and small rocks. No people, NPCs, animals, chests, text, UI, arrows, logo or watermark.

  This is a terrain base for later separate building and foreground props, never a poster or tilemap. Ground must have premium pre-rendered 2.5D volume, readable material, gentle contact shading and no large empty paper-like plaza.
variables: {}
