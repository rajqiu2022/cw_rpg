# 主角 / 同锚点 · 行走循环第 1 帧（纯文，无参考图）
# 第 2～4 帧请改用 sprite_protagonist_walk_ref，以本帧输出为参考做 edits，减少换装漂移。

id: sprite_protagonist_walk
description: Field 侧向行走循环第 1 帧（正交略俯视，非地砖等距），白底
quality: medium
size: "896x896"

identity_anchor: |
  {{character_name}}，{{character_appearance}}
  以上外貌为唯一权威。

prompt_template: |
  {style_anchor}

  【序列一致性】
  - 本张为「行走循环」第 **{{frame_index}} / {{frame_total}}** 帧，朝向 **{{facing}}**。
  - 本模板用于 **第 1 帧** 时：须一次性画准全身装束，供后续帧参考；除行走相位外禁止自发改款。

  【外观硬锁定（全序列必须与下列描述一致，禁止帧间「换一套衣」）】
  - 外衣：单一 **深灰偏冷** 粗布长袍（非炭黑、非棕灰、非藏青），衣襟交叠宽度与下摆长度固定。
  - **外衣明度锁定**：整体为 **中～偏深灰**，禁止画成浅灰、银灰、雾灰、发白的冷灰；勿因「想象侧光」把整袍提亮一档；本帧即后续 walk 参考锚，明度宁略暗勿浅。
  - 内衬：**纯白** 中衣，领口与袖口露出面积、褶皱纹路形态固定。
  - 腰带：**深色布带**（近黑褐），宽度与结法固定；**长剑** 佩带位置与剑鞘朝向整段不变（深褐木纹鞘、黯哑铜色护手）。
  - 酒葫芦：**青瓷灰绿釉** 小葫芦，系绳 **深褐**，葫芦大小与挂点固定，仅允许随身体微晃。
  - 下装：袍下若露裤脚，须与外衣 **同色系深灰**，禁止突然变成浅色或棕色绑腿。
  - 鞋：**深色布质短靴**（快靴），靴筒高度与鞋头圆钝形状固定。
  - 肤色：**浅暖黄调** 东亚男青年，脸、颈、手背一致，禁止忽白忽棕。
  - 发：黑发束脑后 **深色发带**，刘海分区与发束外轮廓固定。

  【镜头与游戏用途 — Field Sprite】
  - 与 `Sprite2D.flip_h` 配套：**侧向全身**、身体主轴 **朝画幅左侧**，略俯视看清头肩；**禁止**斜 45° **等距地砖**行走图、禁止角色朝向画框右下趋势。
  - 地面为**水平地平面**（仅一条隐含的脚线）：双脚须有**明显前后错步与承重切换**，像真在走路；**禁止**四帧脚底几乎落在同一对位置像待机站桩。

  【行走 — 下肢必须可读】
  - 本序列为 **4 帧走路循环**，观众须能看出 **哪只脚在前、哪只在后、哪只承重、哪只抬起**；每帧至少一脚 **离地或仅脚尖点地**，膝胯角度随步幅变化。
  - 侧向时两腿前后水平间距建议约为 **肩宽的 0.9～1.4 倍**（随帧变化），禁止整段只有上身幌动、脚踝以下不动。

  【整体要求】
  - 全身入镜（头到脚），角色高度约占画面 **58%～68%**，水平居中。
  - 仅一名角色；纯白背景 #FFFFFF；港漫厚涂 2.5D、墨线清晰、饱和明亮。

  【角色身份】
  {identity_anchor}

  【本帧动作相位 — 须落实于脚与膝】
  {{leg_phase}}
  {{frame_pose_hint}}

  【画面】
  - 896×896；无灰底、无脚边脏阴影条；单帧静态，无动态模糊。

  【禁忌】蜘蛛与蛛网意象；繁体中文；水印。

  【反向】{negative}

variables:
  character_name: "必填"
  character_appearance: "必填"
  frame_index: "1..N"
  frame_total: "N"
  leg_phase: "本帧腿部与重心文字描述"
  frame_pose_hint: "手臂、袍摆、剑鞘相对身体的具体姿态"
  facing: "tasks 内一句侧向/略俯视说明（勿再写 45° 等距地砖）"
