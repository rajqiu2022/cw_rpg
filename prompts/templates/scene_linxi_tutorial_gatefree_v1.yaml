id: scene_linxi_tutorial_gatefree_v1
description: Gate-free replacement background for the Linxi tutorial village.
quality: high
size: "1536x1024"

prompt_template: |
  Create a production-ready single background for a 2.5D Chinese wuxia RPG, viewed from a high three-quarter angle. It is the sunlit training courtyard of a small bamboo village: a wooden master house at upper left, a modest thatched home near upper middle, an open blacksmith workshop at upper right, a circular stone practice marker in the central dirt square, bamboo groves and rocky greenery around the perimeter, and a broad dirt road leaving at the lower right.

  Style: warm hand-painted Hong Kong wuxia comic game art, precise ink contours, believable perspective, clear walkable ground, no people, no animals, no text, no signs, no UI, no watermark.

  Critical layout rule: the lower-right road exit must be completely open. Do not draw a gate, arch, door frame, roofed threshold, torii, fence across the road, posts, or any similar entrance structure anywhere near the lower-right exit. The road must continue naturally out of frame through open bamboo and low grass, leaving clean space for a future foreground gate prop and a portal marker.

  Keep houses, bamboo, rocks, fences and workshop only where described. Do not put objects on the central square or the lower-right exit road.
