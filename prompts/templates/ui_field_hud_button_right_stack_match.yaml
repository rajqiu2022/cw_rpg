id: ui_field_hud_button_right_stack_match
description: 严格匹配用户提供右侧 HUD 按钮设计图的单按钮母版
quality: high
size: "1024x1024"

identity_anchor: |
  《云影侠传》游戏主界面右侧 HUD 功能按钮。
  必须严格参考用户提供的右侧按钮设计图：
  蓝灰玄铁牌匾、双层描边、右端尖角牌形、左侧独立图标、右侧白色书法中文，
  低饱和冷色、旧武侠 RPG HUD、厚涂手绘质感。

reference_images:
  - "assets/raw/ui/field_hud/reference/hud_right_buttons_design_ref.png"

prompt_template: |
  {{identity_anchor}}

  生成一枚重新绘制的 HUD 功能按钮，按钮内容为：
  - 左侧图标：{{icon_desc}}
  - 右侧文字：{{button_label}}

  必须严格执行：
  - 只输出一枚单独横向按钮，居中摆放；不要输出整列按钮，不要输出完整 HUD。
  - 这不是裁切参考图，也不是截图修补；必须是重新绘制的独立按钮资产。
  - 造型要和参考图完全一致的设计语言：左侧图标区 + 右侧文字区，灰蓝牌匾，右端尖角，内外两层描边。
  - 比例接近参考图里的单个按钮，宽高约 2.8:1。
  - 图标位置、文字位置、边框厚度、圆角和右侧尖角都要贴近参考图。
  - 文字必须是简体中文“{{button_label}}”，白色/米白色书法字，不能是金色字，不能是现代字体。
  - 图标必须清晰可读，风格和参考图里的图标一致，不要写实 3D，不要现代扁平图标。
  - 背景必须纯白或透明感白底，方便后处理抠透明；不能有场景背景、人物、建筑、其他按钮。
  - 画面内不能出现除“{{button_label}}”以外的任何文字。

  严格禁止：
  - 禁止首界面主菜单按钮风格，禁止金色大字，禁止红绿宝石主菜单边框。
  - 禁止直接裁切参考图，禁止保留参考图背景。
  - 禁止英文、拉丁字母、乱码、错字、繁体字、水印、签名。
  - 禁止额外小红点，除非任务要求明确指定。

  反向：{negative}

variables:
  button_label: "背包"
  icon_desc: "白色布袋/行囊图标"
