id: scene_linxi_mainstreet_panorama_right_v2
description: Corrected Linxi main-street right panel with a narrow visual seam and continuous lane.
quality: high
size: "1536x1024"

prompt_template: |
  Create ONE native 1536x1024 corrected right-hand continuation panel for a scrollable Chinese wuxia RPG village main street. Use an inviting hand-painted comic 2.5D environment: high three-quarter camera, crisp ink outlines, warm morning light, gray tile roofs, weathered timber, pale stone, muted bamboo green, and no people or writing.

  Critical left-edge continuity: the leftmost 25 percent must be an OPEN, uninterrupted pale stone-and-dirt lane at the same elevation as a prior panel. The lane enters from the upper-left edge, is at least 220 pixels wide, and continues diagonally down through the center toward a clear village exit at the lower-right edge. Only a thin 80-pixel band of low bamboo, rocks, or wall may sit along the extreme left edge; never place a bamboo island, tall wall, building, fence, or courtyard across the lane or in the center seam area.

  Put a compact open-front blacksmith workshop in the upper-right quarter with clear door-level frontage and dark unlit forge bay. Put one quiet residence in the far-right upper area. Keep the central and lower lane shoulders clear for later NPCs, chest, forge glow, quest board, and portal-arrow overlays. The lower-right exit remains fully visible and reachable along the lane.

  Base scenery only: no people, NPCs, animals, carts, chest, tablets, quest boards, loose props, readable writing, sign text, UI, arrows, watermark, or roof blocking the route. No crowded market and no collage.
