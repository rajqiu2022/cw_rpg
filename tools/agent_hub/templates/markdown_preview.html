{% extends "base.html" %}
{% block title %}文档预览 · 协作调度台{% endblock %}
{% block content %}
<section class="page-head">
  <p class="eyebrow">文档预览</p>
  <h1>文档预览</h1>
  <p><code>{{ path }}</code></p>
  <div class="actions">
    <a class="button-link" href="/repo/{{ path }}?raw=1">查看源码</a>
    <a class="button-link muted-button" href="/artifacts">返回产出库</a>
  </div>
</section>

<article class="card markdown-preview">
  {{ html|safe }}
</article>
{% endblock %}
